name: RETAIL
description: Retail analytics model for museum store operations. Covers category-grain sales performance (net sales, profit, units, donations) and facility-grain daily aggregates (transactions, visitors, ecommerce orders, plus facility rollups of sales/profit/units/donations). Supports per-store and per-category profitability analysis, and is the natural-language / Cortex Analyst surface for the Retail Performance Report cluster.
tables:
  - name: FCT_RETAIL_PERFORMANCE
    description: Category-grain retail fact (one row per date x facility x category). Additive sales/profit/units/donations.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: FCT_RETAIL_PERFORMANCE
    dimensions:
      - name: KEY_FACILITY
        expr: KEY_FACILITY
        data_type: NUMBER
        description: Selling-area facility key (see seed_facility_area)
      - name: AREA_NAME
        expr: AREA_NAME
        data_type: VARCHAR
      - name: AREA_GROUP
        expr: AREA_GROUP
        data_type: VARCHAR
      - name: CATEGORY_CODE
        expr: CATEGORY_CODE
        data_type: VARCHAR
        description: CounterPoint product category (Donations folded to 'Donations')
      - name: IS_COMMEMORATION_DAY
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN
    time_dimensions:
      - name: DATE_KEY
        expr: DATE_KEY
        data_type: DATE
      - name: DATE_VALUE
        expr: DATE_VALUE
        data_type: DATE
    facts:
      - name: NET_SALES
        expr: NET_SALES
        data_type: NUMBER
        description: Sale minus return amount, non-donation lines
      - name: NET_PROFIT
        expr: NET_PROFIT
        data_type: NUMBER
      - name: NET_UNITS
        expr: NET_UNITS
        data_type: NUMBER
      - name: COST_OF_GOODS
        expr: COST_OF_GOODS
        data_type: NUMBER
      - name: DONATIONS
        expr: DONATIONS
        data_type: NUMBER
      - name: NET_SALES_BUDGET
        expr: NET_SALES_BUDGET
        data_type: NUMBER
        description: NULL by design at category grain (7.9.0) — the retail forecast is facility-grain; goals live in the fct_budget_retail_forecasts chain.
      - name: NET_PROFIT_BUDGET
        expr: NET_PROFIT_BUDGET
        data_type: NUMBER
        description: NULL by design at category grain (7.9.0) — the retail forecast is facility-grain; goals live in the fct_budget_retail_forecasts chain.
    metrics:
      - name: TOTAL_NET_SALES
        expr: SUM(NET_SALES)
        data_type: NUMBER
        description: Total net sales across all facilities and categories
      - name: TOTAL_NET_PROFIT
        expr: SUM(NET_PROFIT)
        data_type: NUMBER
        description: Total net profit
      - name: TOTAL_NET_UNITS
        expr: SUM(NET_UNITS)
        data_type: NUMBER
        description: Total units sold (category grain). Added 1.6.0 for the Retail Performance Report category page.
      - name: TOTAL_COST_OF_GOODS
        expr: SUM(COST_OF_GOODS)
        data_type: NUMBER
        description: Total COGS. Added 1.6.0.
      - name: TOTAL_RETAIL_DONATIONS
        synonyms:
          - retail donations
          - register donations
          - round-up donations
        expr: SUM(DONATIONS)
        data_type: NUMBER
        description: Total retail donations collected at the register (category grain). Distinct from the DPR view's TOTAL_DONATIONS (all donation lines).
      - name: GROSS_MARGIN_PCT
        expr: SUM(NET_PROFIT) / NULLIF(SUM(NET_SALES), 0)
        data_type: NUMBER
        description: Gross margin percentage (profit / sales)
  - name: FCT_RETAIL_DAILY
    description: Facility-grain retail fact (one row per date x facility). Transaction and visitor counts plus facility rollups of sales/profit/units/donations. This is the single-fact projection the Retail Performance Power BI wrapper (RPT_RETAIL_POWERBI) reads.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: FCT_RETAIL_DAILY
    dimensions:
      - name: KEY_FACILITY
        expr: KEY_FACILITY
        data_type: NUMBER
      - name: AREA_NAME
        expr: AREA_NAME
        data_type: VARCHAR
      - name: AREA_GROUP
        expr: AREA_GROUP
        data_type: VARCHAR
      - name: IS_COMMEMORATION_DAY
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN
    time_dimensions:
      - name: DATE_KEY
        expr: DATE_KEY
        data_type: DATE
      - name: DATE_VALUE
        expr: DATE_VALUE
        data_type: DATE
    facts:
      - name: NET_SALES
        expr: NET_SALES
        data_type: NUMBER
      - name: NET_PROFIT
        expr: NET_PROFIT
        data_type: NUMBER
      - name: NET_UNITS
        expr: NET_UNITS
        data_type: NUMBER
      - name: DONATIONS
        expr: DONATIONS
        data_type: NUMBER
      - name: TRANSACTIONS
        expr: TRANSACTIONS
        data_type: NUMBER
      - name: VISITOR_COUNT
        expr: VISITOR_COUNT
        data_type: NUMBER
      - name: ECOM_ORDERS
        expr: ECOM_ORDERS
        data_type: NUMBER
    metrics:
      # --- Facility-grain additive rollups (added 1.6.0) --------------------
      # These let RPT_RETAIL_POWERBI project one clean row per (date, facility)
      # from a SINGLE fact, exactly like the DPR wrapper reads FCT_DAILY_PERFORMANCE.
      # Names are namespaced (RETAIL_* / _ASK) so they do not collide with the
      # category-grain metrics above — including the locked TOTAL_RETAIL_DONATIONS.
      - name: TOTAL_RETAIL_NET_SALES
        expr: SUM(NET_SALES)
        data_type: NUMBER
        description: Facility-grain net sales rollup
      - name: TOTAL_RETAIL_NET_PROFIT
        expr: SUM(NET_PROFIT)
        data_type: NUMBER
        description: Facility-grain net profit (gross margin profit) rollup
      - name: TOTAL_RETAIL_NET_UNITS
        expr: SUM(NET_UNITS)
        data_type: NUMBER
        description: Facility-grain units rollup
      - name: TOTAL_RETAIL_DONATION_ASK
        expr: SUM(DONATIONS)
        data_type: NUMBER
        description: Facility-grain donation-ask rollup (same measure as the category-grain TOTAL_RETAIL_DONATIONS, which keeps the locked name and synonyms)
      # --- Counts (pre-existing) -------------------------------------------
      - name: TOTAL_TRANSACTIONS
        expr: SUM(TRANSACTIONS)
        data_type: NUMBER
        description: Total transaction count (customers)
      - name: TOTAL_VISITORS
        expr: SUM(VISITOR_COUNT)
        data_type: NUMBER
        description: Total visitor count to retail areas (Sensource stub until fed)
      - name: TOTAL_ECOM_ORDERS
        expr: SUM(ECOM_ORDERS)
        data_type: NUMBER
        description: Total ecommerce orders (Shopify stub until fed)
      - name: REVENUE_PER_VISITOR
        expr: SUM(NET_SALES) / NULLIF(SUM(VISITOR_COUNT), 0)
        data_type: NUMBER
        description: Net sales per visitor
  - name: DIM_DATE
    description: Calendar date spine spanning 2000-2035 with commemoration day flag (no fiscal columns yet; fiscal calendar pending Data & AI Committee definition)
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: DIM_DATE
    primary_key:
      columns:
        - DATE_KEY
    dimensions:
      - name: REPORT_DATE
        expr: DATE_KEY
        data_type: DATE
        description: Regular (non-time) date dimension so a flat SEMANTIC_VIEW() projection can select the date. Added 1.6.0.
      - name: DAY_OF_WEEK_NAME
        expr: DAY_OF_WEEK_NAME
        data_type: VARCHAR
      - name: MONTH_NAME
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: QUARTER_OF_YEAR
        expr: QUARTER_OF_YEAR
        data_type: NUMBER
      - name: YEAR_NUMBER
        expr: YEAR_NUMBER
        data_type: NUMBER
      - name: IS_WEEKEND
        expr: IS_WEEKEND
        data_type: BOOLEAN
      - name: IS_COMMEMORATION_DAY
        description: True for September 11 (anniversary). Flags structural anomalies across all metrics.
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN
    time_dimensions:
      - name: DATE_KEY
        expr: DATE_KEY
        data_type: DATE
      - name: DATE_DAY
        expr: DATE_DAY
        data_type: DATE
  - name: SEED_FACILITY_AREA
    description: Retail selling-area facility reference
    base_table:
      database: NS11MM_DW_PROD
      schema: SEEDS
      table: SEED_FACILITY_AREA
    primary_key:
      columns:
        - KEY_FACILITY
    dimensions:
      - name: KEY_FACILITY
        expr: KEY_FACILITY
        data_type: NUMBER
      - name: AREA_NAME
        expr: AREA_NAME
        data_type: VARCHAR
      - name: AREA_GROUP
        expr: AREA_GROUP
        data_type: VARCHAR
      - name: IS_SELLING
        expr: IS_SELLING
        data_type: BOOLEAN
relationships:
  - name: RETAIL_PERF_TO_DATE
    left_table: FCT_RETAIL_PERFORMANCE
    right_table: DIM_DATE
    join_type: many_to_one
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: RETAIL_PERF_TO_FACILITY
    left_table: FCT_RETAIL_PERFORMANCE
    right_table: SEED_FACILITY_AREA
    join_type: many_to_one
    relationship_columns:
      - left_column: KEY_FACILITY
        right_column: KEY_FACILITY
  - name: RETAIL_DAILY_TO_DATE
    left_table: FCT_RETAIL_DAILY
    right_table: DIM_DATE
    join_type: many_to_one
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: RETAIL_DAILY_TO_FACILITY
    left_table: FCT_RETAIL_DAILY
    right_table: SEED_FACILITY_AREA
    join_type: many_to_one
    relationship_columns:
      - left_column: KEY_FACILITY
        right_column: KEY_FACILITY