name: UNIFIED
description: >
  Cross-domain reconciliation surface for the Museum Data Warehouse. Ticketing
  and admissions (DPR), retail by selling area and product category, and gate
  scanning by market segment -- all reconciled against one conformed calendar so
  a user can combine any live metric with any shared date dimension in a single
  question. Facility/category retail detail, ticketing KPIs, donations, tours,
  audio, and scan/redemption all in one place. Budget/variance, full Sensource
  attendance, membership, ecommerce gross profit, monthly online revenue and
  same-day hourly sales are out of scope (see the domain models).

tables:
  - name: date
    description: Conformed calendar/date dimension. The single shared axis every live fact reconciles against.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: DIM_DATE
    primary_key:
      columns: [DATE_KEY]
    dimensions:
      - name: report_date
        synonyms: ["date", "day", "business date"]
        description: Calendar date the numbers are recognized on.
        expr: DATE_DAY
        data_type: DATE
      - name: year
        synonyms: ["year", "calendar year"]
        description: Calendar year (from dim_date year_number). No fiscal calendar yet — pending Data & AI Committee definition.
        expr: YEAR_NUMBER
        data_type: NUMBER
      - name: month
        synonyms: ["month", "month number"]
        description: Month of year (1-12).
        expr: MONTH_OF_YEAR
        data_type: NUMBER
      - name: calendar_year
        synonyms: ["year", "calendar year"]
        expr: YEAR_NUMBER
        data_type: NUMBER
      - name: calendar_quarter
        synonyms: ["quarter", "qtr", "calendar quarter"]
        expr: QUARTER_OF_YEAR
        data_type: NUMBER
      - name: calendar_month
        synonyms: ["month number", "calendar month"]
        expr: MONTH_OF_YEAR
        data_type: NUMBER
      - name: month_name
        synonyms: ["month"]
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: day_name
        synonyms: ["weekday", "day of week"]
        expr: DAY_OF_WEEK_NAME
        data_type: VARCHAR
      - name: day_of_month
        synonyms: ["day of month"]
        expr: DAY_OF_MONTH
        data_type: NUMBER
      - name: week_of_year
        synonyms: ["week", "week number"]
        expr: WEEK_OF_YEAR
        data_type: NUMBER
      - name: is_weekend
        synonyms: ["weekend flag", "weekend"]
        expr: IS_WEEKEND
        data_type: BOOLEAN
      - name: is_weekday
        synonyms: ["weekday flag"]
        expr: IS_WEEKDAY
        data_type: BOOLEAN
      - name: is_commemoration_day
        synonyms: ["commemoration", "anniversary window", "9/11 period"]
        description: TRUE for September 11, a known structural exception.
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN

  - name: dpr
    description: Ticketing / DPR additive day-grain fact. One row per calendar day.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: FCT_DAILY_PERFORMANCE
    primary_key:
      columns: [DATE_KEY]
    dimensions: []
    metrics:
      - name: total_tickets_sold
        synonyms: ["tickets sold", "admissions sold", "ticket count"]
        description: General-admission tickets sold (Gateway DPR).
        expr: SUM(TICKETS_SOLD)
      - name: total_ticket_revenue
        synonyms: ["ticket revenue", "admission revenue"]
        expr: SUM(TICKET_REVENUE)
      - name: total_pass_revenue
        synonyms: ["pass revenue", "CityPASS revenue", "C3 revenue"]
        expr: SUM(PASS_REVENUE)
      - name: total_admission_revenue
        synonyms: ["total admission revenue"]
        description: Governed admission-revenue numerator (ticket + pass revenue). Definition of record is the fct column TOTAL_ADMISSION_REVENUE; components restated here because the metric name shadows the same-named column (engine limitation) — guarded by assert_sv_admission_revenue_matches_fct on the DPR twin.
        expr: SUM(TICKET_REVENUE) + SUM(PASS_REVENUE)
      - name: total_museum_attendance
        synonyms: ["museum attendance", "museum visitors"]
        description: Museum attendance (scanned GA component; full Sensource blend not yet staged).
        expr: SUM(MUS_ATTENDANCE)
      - name: total_memorial_attendance
        synonyms: ["memorial attendance", "plaza attendance", "memorial visitors"]
        description: Memorial attendance (valid Gateway scans at memorial facilities). Scan component only.
        expr: SUM(MEM_ATTENDANCE)
      - name: total_mus_guided_tour_revenue
        synonyms: ["museum guided tour revenue", "guided tour revenue"]
        expr: SUM(MUS_GUIDED_TOUR_REVENUE)
      - name: total_mem_guided_tour_revenue
        synonyms: ["memorial guided tour revenue"]
        expr: SUM(MEM_GUIDED_TOUR_REVENUE)
      - name: total_mem_mus_tour_revenue
        synonyms: ["memorial and museum tour revenue", "combined tour revenue"]
        expr: SUM(MEM_MUS_TOUR_REVENUE)
      - name: total_revealed_tour_revenue
        synonyms: ["revealed tour revenue"]
        expr: SUM(REVEALED_TOUR_REVENUE)
      - name: total_ask_educator_revenue
        synonyms: ["ask an educator revenue", "ask educator revenue"]
        expr: SUM(ASK_EDUCATOR_REVENUE)
      - name: total_field_trip_revenue
        synonyms: ["field trip revenue", "school trip revenue"]
        description: Memorial + Museum field trip revenue.
        expr: SUM(MEM_FIELD_TRIP_REVENUE) + SUM(MUS_FIELD_TRIP_REVENUE)
      - name: total_virtual_tour_revenue
        synonyms: ["virtual tour revenue", "online tour revenue"]
        description: All virtual tour revenue (memorial, museum, youth & family).
        expr: SUM(VIRTUAL_MEM_TOUR_REVENUE) + SUM(VIRTUAL_MUS_TOUR_REVENUE) + SUM(VIRTUAL_YF_MEM_TOUR_REVENUE)
      - name: total_service_fees
        synonyms: ["service fees", "fees"]
        expr: SUM(SERVICE_FEES)
      - name: total_audio_revenue
        synonyms: ["audio guide revenue", "all audio revenue"]
        description: Museum audio/headset plus memorial audio guide revenue.
        expr: SUM(AUDIO_TOUR_HEADSET) + SUM(MEM_AUDIO_GUIDE_REVENUE)
      - name: total_audio_tour_headset_units
        synonyms: ["audio units sold", "headset units", "audio guide units"]
        expr: SUM(AUDIO_TOUR_HEADSET_UNITS)
      - name: total_retail_gross_profit
        synonyms: ["total retail profit", "retail gross profit (DPR rollup)"]
        description: Museum Store + Memorial Carts + Cafe gross profit (DPR rollup). For selling-area/category detail use rd.*/rc.*.
        expr: SUM(MUS_STORE_GROSS_PROFIT) + SUM(RETAIL_CARTS_GROSS_PROFIT) + SUM(CAFE1_ALL_PROFIT)
      - name: total_mus_store_gross_profit
        synonyms: ["museum store profit", "store gross profit"]
        expr: SUM(MUS_STORE_GROSS_PROFIT)
      - name: total_ticketing_donations
        synonyms: ["ticketing donations"]
        expr: SUM(TICKETING_DONATIONS)
      - name: total_donations
        synonyms: ["total donations", "all donations", "donation revenue"]
        description: Sum of every DPR donation line.
        expr: SUM(TICKETING_DONATIONS) + SUM(BOX_OFFICE_MEM_DON) + SUM(BOX_OFFICE_MUS_EXIT_DON) + SUM(COATCHECK_DON) + SUM(MASK_DONATIONS) + SUM(DONATION_BOX) + SUM(MUS_STORE_DONATIONS) + SUM(MUS_EXIT_DONATIONS) + SUM(CART_DONATION_ASK) + SUM(ECOM_DONATION_ASK) + SUM(CAFE1_DONATIONS)
      - name: mus_store_profit_per_visitor
        synonyms: ["store profit per visitor", "per-cap store profit", "store per cap"]
        description: "Non-additive: Museum Store GROSS PROFIT (not sales revenue) / museum visitors, recomputed at the query grain."
        expr: SUM(MUS_STORE_GROSS_PROFIT) / NULLIF(SUM(MUS_ATTENDANCE), 0)

  - name: retail_daily
    description: Retail facility-grain fact. One row per day per selling area. Base for retail ratios.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: FCT_RETAIL_DAILY
    primary_key:
      columns: [DATE_KEY, KEY_FACILITY]
    dimensions:
      - name: area_name
        synonyms: ["store", "selling area", "location", "shop"]
        description: Selling area (Museum Store, Memorial Carts, Cafe, Ecommerce, Atrium). Constrains rd.* metrics only.
        expr: AREA_NAME
        data_type: VARCHAR
      - name: area_group
        synonyms: ["area type", "retail channel"]
        description: Retail area grouping. Constrains rd.* metrics only.
        expr: AREA_GROUP
        data_type: VARCHAR
    metrics:
      - name: total_net_sales
        synonyms: ["retail sales", "net sales", "store sales"]
        description: Net retail sales (gross less returns and discounts) from CounterPoint POS, by selling area.
        expr: SUM(NET_SALES)
      - name: total_net_profit
        synonyms: ["retail profit", "net profit", "store net profit"]
        expr: SUM(NET_PROFIT)
      - name: total_units
        synonyms: ["units", "items sold", "quantity sold"]
        expr: SUM(NET_UNITS)
      - name: total_retail_donations
        synonyms: ["retail donations", "store donations at register"]
        expr: SUM(DONATIONS)
      - name: total_transactions
        synonyms: ["transactions", "carts", "orders count"]
        expr: SUM(TRANSACTIONS)
      - name: total_visitors
        synonyms: ["retail visitors", "store visitors", "door count", "store entries", "foot traffic"]
        description: "Sensource door count at the selling area (entries at the Museum Store, exits at Vesey). Numerator of capture_rate, denominator of conversion_rate. Live since 8.4.0."
        expr: SUM(VISITOR_COUNT)
      - name: total_ecom_orders
        synonyms: ["ecommerce orders", "online orders"]
        description: Ecommerce order count. STUB until Shopify lands.
        expr: SUM(ECOM_ORDERS)
      - name: profit_margin
        synonyms: ["margin", "retail margin", "profit margin"]
        description: "Non-additive: net profit / net sales, recomputed at the query grain."
        expr: SUM(NET_PROFIT) / NULLIF(SUM(NET_SALES), 0)
      - name: avg_sale
        synonyms: ["average sale", "average transaction value", "basket size"]
        description: "Non-additive: net sales / transactions, recomputed at the query grain."
        expr: SUM(NET_SALES) / NULLIF(SUM(TRANSACTIONS), 0)
      - name: conversion_rate
        synonyms: ["conversion", "conversion rate", "purchase rate", "buy rate", "share of store visitors who bought"]
        description: "Non-additive: transactions / store door count, recomputed at the query grain. The share of the people who came INTO the store who bought something. This is NOT the capture rate -- use capture_rate for that. Legacy definition of record: t_fact_mus_store_analysis.sql:19."
        expr: SUM(TRANSACTIONS) / NULLIF(SUM(VISITOR_COUNT), 0)
      - name: capture_rate
        synonyms: ["capture", "capture rate", "store capture", "draw rate", "share of museum visitors who entered the store"]
        description: "Non-additive: store door count / museum attendance (Sensource passes scanned), recomputed at the query grain. The share of museum visitors who came INTO the store. Distinct from conversion_rate, which divides by the door count rather than into it. Legacy definition of record: t_fact_mus_store_analysis.sql:17."
        expr: SUM(VISITOR_COUNT) / NULLIF(SUM(MUSEUM_ATTENDANCE), 0)
      - name: rev_per_visitor
        synonyms: ["revenue per store visitor", "sales per store visitor"]
        description: "Non-additive: net sales / store door count, recomputed at the query grain. Per-STORE-visitor. For per-museum-visitor use sales_per_cap."
        expr: SUM(NET_SALES) / NULLIF(SUM(VISITOR_COUNT), 0)
      - name: sales_per_cap
        synonyms: ["sales per cap", "sales per capita", "retail spend per museum visitor", "per cap sales"]
        description: "Non-additive: net sales / museum attendance, recomputed at the query grain. Legacy per-cap basis."
        expr: SUM(NET_SALES) / NULLIF(SUM(MUSEUM_ATTENDANCE), 0)
      - name: profit_per_cap
        synonyms: ["profit per cap", "profit per capita", "retail profit per museum visitor"]
        description: "Non-additive: net profit / museum attendance, recomputed at the query grain. Legacy per-cap basis."
        expr: SUM(NET_PROFIT) / NULLIF(SUM(MUSEUM_ATTENDANCE), 0)

  - name: retail_category
    description: Retail category-grain fact. One row per day per selling area per product category.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: FCT_RETAIL_PERFORMANCE
    primary_key:
      columns: [DATE_KEY, KEY_FACILITY, CATEGORY_CODE]
    dimensions:
      - name: area_name
        synonyms: ["store", "selling area for category"]
        description: Selling area on the category fact. Constrains rc.* metrics only.
        expr: AREA_NAME
        data_type: VARCHAR
      - name: category
        synonyms: ["product category", "category", "merch category"]
        description: CounterPoint product category (Donations folded to Donations). Constrains rc.* metrics only.
        expr: CATEGORY_CODE
        data_type: VARCHAR
    metrics:
      - name: category_net_sales
        synonyms: ["category sales", "product category sales"]
        expr: SUM(NET_SALES)
      - name: category_net_profit
        synonyms: ["category profit", "product category profit"]
        expr: SUM(NET_PROFIT)
      - name: category_units
        synonyms: ["category units", "items by category"]
        expr: SUM(NET_UNITS)
      - name: category_cost_of_goods
        synonyms: ["category cost of goods", "category COGS"]
        expr: SUM(COST_OF_GOODS)

  - name: daily_scan
    description: Gate-scan fact. One row per day per market segment. Scan component only.
    base_table:
      database: NS11MM_DW_PROD
      schema: MARTS
      table: FCT_DAILY_SCAN
    primary_key:
      columns: [DATE_KEY, SEGMENT_KEY]
    dimensions:
      - name: market_segment
        synonyms: ["segment", "market segment", "channel", "reseller", "market"]
        description: Market segment (CityPASS, C3, School Groups, Walk-up, ...). Constrains sc.* metrics only; split provisional pending channel-mapping validation.
        expr: SEGMENT_NAME
        data_type: VARCHAR
    metrics:
      - name: scan_passes_scanned
        synonyms: ["passes scanned", "scans", "admissions scanned", "entries"]
        description: Valid Gateway passes scanned at entry (excludes staff and re-entry). Scan component only.
        expr: SUM(PASSES_SCANNED)
      - name: scan_tickets_sold
        synonyms: ["scan-side tickets sold", "segment tickets sold"]
        description: GA tickets sold from the scan-side daily fact (by segment). Reconcile against dpr.total_tickets_sold.
        expr: SUM(TICKETS_SOLD)
      - name: scan_utilization
        synonyms: ["scan utilization", "utilization", "redemption rate", "scan rate"]
        description: "Non-additive: passes scanned / tickets sold, recomputed at the query grain."
        expr: SUM(PASSES_SCANNED) / NULLIF(SUM(TICKETS_SOLD), 0)

relationships:
  - name: dpr_to_date
    left_table: dpr
    right_table: date
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: retail_daily_to_date
    left_table: retail_daily
    right_table: date
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: retail_category_to_date
    left_table: retail_category
    right_table: date
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: daily_scan_to_date
    left_table: daily_scan
    right_table: date
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY

verified_queries:
  - name: cross_domain_weekend_snapshot
    question: On weekends this year, what were ticket revenue, museum store net sales, and passes scanned?
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          MARTS.UNIFIED
          DIMENSIONS date.is_weekend
          METRICS dpr.total_ticket_revenue, retail_daily.total_net_sales, daily_scan.scan_passes_scanned
      )
      WHERE is_weekend = TRUE
  - name: revenue_streams_by_month
    question: By month this year, compare admission revenue, retail net sales, and total donations.
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          MARTS.UNIFIED
          DIMENSIONS date.calendar_month
          METRICS dpr.total_admission_revenue, retail_daily.total_net_sales, dpr.total_donations
      )
      ORDER BY calendar_month
  - name: scan_redemption_by_segment
    question: What is scan utilization by market segment?
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          MARTS.UNIFIED
          DIMENSIONS daily_scan.market_segment
          METRICS daily_scan.scan_utilization
      )
      ORDER BY scan_utilization DESC

module_custom_instructions:
  sql_generation: |
    This is the cross-domain surface. Only the date.* dimensions are shared
    across every metric. A fact-local dimension constrains ONLY its own fact's
    metrics: retail_daily.area_name / area_group -> retail facility metrics,
    retail_category.area_name / category -> retail category metrics,
    daily_scan.market_segment -> scan metrics. Never group a metric by a
    dimension from a different fact (e.g. ticket revenue by market segment, or
    museum-store net sales by market segment). When a question combines metrics
    from more than one fact, group only by date.* dimensions; each metric is
    aggregated from its own fact and aligned on date, so there is no double
    counting. Round currency to 2 decimals; round attendance, ticket, tour,
    unit, transaction and scan counts to whole numbers. Use year /
    month dimensions for all period questions. If no period is given, default to the most recent complete day.
  question_categorization: |-
    Use this model for questions that span ticketing, retail and/or scanning
    together, or when the domain is ambiguous; the per-domain models
    (dpr/retail/attendance) are better for deep single-domain
    drill-down. Two ticket-sold measures exist and may differ:
    dpr.total_tickets_sold is the Gateway DPR count; daily_scan.scan_tickets_sold
    is the scan-side count by segment -- use the scan measure for
    redemption/segment questions, otherwise the DPR measure, and note the
    distinction when both are relevant. Retail gross profit exists at two grains:
    dpr.total_retail_gross_profit is the DPR rollup; retail_daily.total_net_profit
    and retail_category.category_net_profit are the selling-area/category detail.
    Out of scope, decline gracefully: budget / forecast / variance (not staged);
    full Sensource turnstile-blended attendance (only the scan component is
    available); membership and ecommerce gross profit; monthly online/website
    recurring revenue (fundraising/ecom domain model not yet deployed) and
    same-day hourly sales (see the attendance domain model). Retail capture rate and
    conversion rate are DISTINCT metrics with different denominators -- capture divides
    by museum attendance, conversion divides by the store door count; never answer one
    with the other. Ecom orders rest on a stubbed feed -- flag as provisional until
    Shopify lands; flag market-segment splits as provisional pending channel-mapping
    validation.