# Governance record for every certified metric, keyed by MET number.
#
# What a metric computes (expr, description, synonyms) lives in the semantic view specs,
# cortex_project/<view>.sv.yaml. Owners come from the Domain Owner Register through domain.
# Reports come from models/exposures.yml. Nothing here repeats either.
#
# RESTORED 2026-10-06. The original records were in semantic_models/*.yaml and were dropped
# when those files were consolidated into cortex_project/. Each view/metric pairing below was
# inferred from which reports cite the number, the reports' descriptions, and the order of
# the UNIFIED view; review.confidence and review.basis say how sure each one is. Confirm or
# correct the pairing, then delete the review block. Fields the old records held that could
# not be recovered (sla_tier, scope) are blank for the owners to fill.
#
# MET-007 to MET-046, MET-049, and MET-072 were assigned in 2.0.0 but nothing in the repo
# says what they were. They are left unassigned. New metrics take MET-073 upward.
