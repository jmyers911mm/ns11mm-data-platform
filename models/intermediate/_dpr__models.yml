version: 2

models:
  - name: int_gateway__ticket_journal_lines
    description: >
      Enriched Gateway ticket journal lines (JnlDetails jnl_code_id = 101),
      joined to tickets, items, vAttribute, COA, disbursement and events.
      Line grain. Backbone for all DPR ticket/tour/pass metrics.
    columns:
      - name: jnl_detail_id
        description: Journal detail identifier (line grain).
        data_tests: [not_null]
      - name: key_date
        description: Recognized reporting date from the recognize-basis logic.
        data_tests: [not_null]
      - name: ga_flag
        description: 1 = general admission, 0 = tour/other.
        data_tests:
          - accepted_values:
              values: [0, 1]

  - name: int_gateway__item_journal_lines
    description: >
      Enriched Gateway item journal lines (JnlDetails jnl_code_id 102-104).
      Feeds audio guide, service fee and ticketing donation metrics.
    columns:
      - name: key_date
        data_tests: [not_null]

  - name: int_dpr__tour_revenue
    description: Guided/virtual/field-trip tour quantities and revenue per day.
    columns:
      - name: key_date
        data_tests: [not_null, unique]

  - name: int_dpr__fees_and_services
    description: Service fees, audio guide revenue, memorial+museum tour per day.
    columns:
      - name: key_date
        data_tests: [not_null, unique]

  - name: int_dpr__retail
    description: CounterPoint retail gross profit, MUS AG, and retail donations per day.
    columns:
      - name: key_date
        data_tests: [not_null, unique]

  - name: int_dpr__donations
    description: Gateway ticketing/box/exit donations per day.
    columns:
      - name: key_date
        data_tests: [not_null, unique]

  - name: int_dpr__admissions
    description: >
      GA tickets sold, ticket revenue, scanned-GA attendance proxy and
      CityPASS/C3 pass revenue per day. Partial attendance (see model header
      scope note; Sensource + additional-revenue inputs not yet staged).
    columns:
      - name: key_date
        data_tests: [not_null, unique]
