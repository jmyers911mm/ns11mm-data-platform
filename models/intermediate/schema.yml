version: 2

models:
  - name: int_gateway__ticket_journal_lines
    description: >
      Enriched Gateway ticket journal lines (JnlDetails jnl_code_id = 101),
      joined to tickets, items, vAttribute, COA, disbursement and events.
      Line grain. Backbone for all DPR ticket/tour/pass metrics.
    columns:
      - name: jnl_detail_id
        description: "PK. Natural key (journal detail line grain)."
        constraints:
          - type: primary_key
        data_tests:
          - not_null
          # Grain inherited from the Gateway journal source (not enforced by an
          # in-model GROUP BY) — warn per the severity rule.
          - unique: { config: { severity: warn } }
      - name: date_key
        description: "FK to dim_date.date_key. Recognized reporting date."
        data_tests: [not_null]
      - name: ga_flag
        description: 1 = general admission, 0 = tour/other.
        data_tests:
          - accepted_values:
              values: [0, 1]

  - name: int_gateway__item_journal_lines
    description: >
      Enriched Gateway item journal lines (JnlDetails jnl_code_id 102-104).
      Feeds audio guide, service fee and ticketing donation metrics.
    columns:
      - name: jnl_detail_id
        description: "PK. Grain inherited from stg_gateway__jnlitems; the multi-join enrichment (notably plu -> stg_gateway__items) can fan out, so uniqueness is guarded at warn (promote to error once the source grain is confirmed)."
        data_tests:
          - unique:
              config: { severity: warn }
          - not_null
      - name: date_key
        description: "FK to dim_date.date_key."
        data_tests: [not_null]

  - name: int_dpr__tour_revenue
    description: >
      Guided (museum + memorial), virtual, field-trip and program tour
      quantities and revenue per day. From 8.8.0 each measure is the sum of three
      legs — issued journal lines, unissued order lines, and buyout lines — as
      the legacy DPR computes them. Buyout PLUs are excluded from the line grain
      and added back from int_gateway__tour_buyout, with the legacy quantity
      suppression applied.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: mem_guided_tour_revenue
        description: Memorial guided tour revenue (%MGT% matrix, ga_flag = 0), issued + unissued + buyout.
        data_tests: [not_null]
      - name: youth_fam_tours
        description: "Youth & Family tour count (issued + unissued). NEW ACTUAL in 8.8.0."
        data_tests: [not_null]
      - name: early_access_tours
        description: "Early Access tour count (issued + unissued + buyout). NEW ACTUAL in 8.8.0."
        data_tests: [not_null]
      - name: ea_mem_mus_tours
        description: "All-Inclusive Early Access tour count (issued + unissued). NEW ACTUAL in 8.8.0."
        data_tests: [not_null]
      - name: unissued_tour_revenue_total
        description: "Audit companion: the total tour revenue contributed by the unissued leg."
        data_tests: [not_null]
      - name: buyout_tour_revenue_total
        description: "Audit companion: the total tour revenue contributed by the buyout leg."
        data_tests: [not_null]
      - name: buyout_tours_unsuppressed_total
        description: >
          Audit companion: buyout tour count BEFORE the legacy suppression.
          buyout_tours_unsuppressed_total - buyout_tours_total is the count the
          suppression removes.
        data_tests: [not_null]

  - name: int_dpr__fees_and_services
    description: Service fees, audio guide revenue, memorial+museum tour per day.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]

  - name: int_dpr__retail
    description: CounterPoint retail gross profit, MUS AG, and retail donations per day.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]

  - name: int_dpr__donations
    description: >
      Gateway ticketing/box/exit donations per day. ticketing_donations is the
      issued leg PLUS the unissued leg from 8.8.0, matching t_reporting_donations
      and the DPR-New / Tracker-YTD .prpt (sum(issued) + sum(unissued)).
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: ticketing_donations_issued
        description: "Audit companion: the issued leg alone (the pre-8.8.0 value)."
        data_tests: [not_null]
      - name: ticketing_donations_unissued
        description: "Audit companion: the newly-added unissued leg."
        data_tests: [not_null]

  - name: int_dpr__admissions
    description: >
      GA tickets sold, ticket revenue and CityPASS/C3 pass revenue per day
      (journal-issued component). Attendance moved OUT of this model in 8.7.0 —
      mus_attendance is authored once in int_dpr__attendance; the GA quantity
      survives here only as mus_attendance_ga_proxy for reconciliation and is
      not consumed downstream.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: mus_attendance_ga_proxy
        description: >
          RECONCILIATION ONLY. GA ticket quantity — the pre-8.7.0 museum
          attendance definition. Never join this to a report.
      - name: tickets_sold
        description: >
          GA tickets sold: issued journal lines + unissued order lines + the
          memorial-tour-with-museum-admission cohort (8.8.0). Rises relative to
          the issued-only figure published before this release.
        data_tests: [not_null]
      - name: ticket_revenue
        description: "GA ticket revenue, issued + unissued (8.8.0)."
        data_tests: [not_null]
      - name: unissued_tickets_sold
        description: "Audit companion: the newly-added unissued ticket quantity."
        data_tests: [not_null]
      - name: unissued_ticket_revenue
        description: "Audit companion: the newly-added unissued ticket revenue."
        data_tests: [not_null]

  - name: int_dpr__attendance
    description: >
      Museum and memorial attendance per day. Museum = net scanned passes at
      key_facility 1006/3000 (legacy scan-validity rule) with the closed-day
      zeroing from seed_attendance_zeroing_rule applied. Memorial =
      SUM(passes_scanned) from stg_memorial__attendance
      (911dw.memorial_attendance, staged in 8.4.0) at the seeded memorial
      key_facility — its own legacy table, not the Gateway scan feed, which
      cannot emit key_facility 2000. Classification is seed-driven
      (seed_attendance_facility_group), no longer facility-name pattern
      matching. Feeds fct_daily_performance.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: mus_attendance
        description: >
          Museum attendance: net scanned passes at key_facility 1006/3000, forced
          to 0 on a seeded closed day whose total falls below the threshold.
          Guaranteed non-null only when a museum scan exists for the day.
      - name: mus_passes_scanned
        description: Museum passes before the closed-day zeroing (audit companion).
      - name: is_museum_closed_day
        description: TRUE when a seeded zeroing rule fired for the day.
        data_tests: [not_null]
      - name: mem_attendance
        description: >
          Memorial attendance: SUM(passes_scanned) from stg_memorial__attendance
          at the seeded memorial key_facility. Deliberately NOT tested not_null:
          a day the feed has no row for must read NULL, never 0.
      - name: uncounted_passes_scanned
        description: >
          Monitor. Net passes that resolved to neither attendance line (Gateway
          facility 12 -> key_facility 5000, and the legacy else '0' bucket).
      - name: mem_passes_scanned_gateway
        description: >
          Monitor, not a measure. Net GATEWAY scans that classify as memorial.
          Must stay NULL: no Gateway ACP resolves to key_facility 2000, and
          memorial attendance is authored from stg_memorial__attendance. A value
          here means the memorial line has acquired a second writer and is
          double counting. Never join this to a report.

  - name: int_gateway__item_attributes
    description: >
      Shared Gateway vAttribute lookup: avg_id -> matrix code, recognize basis,
      default customer, dynamic channel. Single home for the attribute lookup
      previously re-selected by int_gateway__item_journal_lines,
      int_gateway__ticket_journal_lines, and int_gateway__scan_lines. Raw
      passthrough of stg_gateway__vattribute (no dedup or derivation).
    columns:
      - name: avg_id
        description: "PK. Attribute value group id (grain inherited from vAttribute)."
        data_tests:
          # Passthrough — grain is inherited from the source, not enforced by an
          # in-model GROUP BY/distinct — warn per the severity rule.
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }

  - name: int_gateway__scan_lines
    description: >
      Gate scan lines with ticket market segment category. One row per scan
      event joined to the ticket's attribute for segment classification.
      Carries the signed net_scanned_qty (legacy code-0 minus code-11 rule,
      8.7.0) alongside the gross qty. Feeds fct_daily_scan.
    columns:
      - name: net_scanned_qty
        description: >
          Signed passes-scanned contribution for the scan. Summed directly by
          fct_daily_scan.passes_scanned; can be negative.
      - name: usage_id
        description: "PK. Natural key (scan event identifier). The visual_id ticket join is deduped upstream (7.9.0); uniqueness guarded at warn per the inherited-grain rule."
        constraints:
          - type: primary_key
        data_tests:
          - unique:
              config: { severity: warn }
          - not_null
      - name: date_key
        description: "FK to dim_date.date_key. Scan date."
        data_tests: [not_null]
      - name: category
        description: Sales channel / market category string for segment mapping.
        data_tests: [not_null]

  # ---------------------------------------------------------------------------
  # Added coverage. Grain/uniqueness tests are severity: warn — they assert the
  # documented grain over source data; a warn means investigate the grain
  # (widen the key columns or confirm the dups are expected), then promote to
  # error. error is kept only on columns the model GUARANTEES by construction
  # (coalesced / CASE-derived), which cannot fail.
  # ---------------------------------------------------------------------------

  - name: int_counterpoint__retail_lines
    description: >
      CounterPoint (NCR) POS ticket-history lines conformed to the DPR facility
      mapping. Line grain (one row per ps_tkt_hist_lin sale/return line).
      Emits facility_group / is_donation for downstream DPR marts.
    data_tests:
      - unique:
          column_name: "doc_id || '~' || line_seq_no"
          config: { severity: warn }
    columns:
      - name: doc_id
        description: "CounterPoint ticket/document id (part of the line grain)."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: business_date
        description: "Transaction date."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: key_facility
        description: "Resolved 911dw facility key (seed-driven, default 1020) — never null."
        data_tests: [not_null]
      - name: facility_group
        description: "Stable facility name derived from key_facility — never null."
        data_tests:
          - not_null
          - accepted_values:
              values: [museum_store, memorial_carts, museum_cafe, mag_cart, mus_ag, ecommerce, other]
      - name: is_donation
        description: "True for summary_category 6 (legacy DONATE) lines — never null."
        data_tests: [not_null]
      - name: summary_category
        description: "Legacy key_summary_category (1 = retail, 6 = donation)."
        data_tests:
          - accepted_values:
              values: [1, 6]
      - name: line_type
        description: "S = sale, R = return."
        data_tests:
          - accepted_values:
              values: ['S', 'R']
              config: { severity: warn }

  - name: int_pos_tickets
    description: >
      POS ticket transactions, one row per ticket_id where sold_at is not null.
      Feeds fct_daily_operations ticket measures.
    columns:
      - name: transaction_id
        description: "PK. Ticket transaction id (grain from source)."
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }
      - name: transaction_date
        description: "Sale date (day grain of the operations fact)."
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: int_ticket_scans
    description: >
      Gate scan events, one row per usage_id (scan) where use_time is not null,
      with the legacy scan-validity rule and the ACP -> facility resolution
      applied (8.7.0). Feeds int_gateway__scan_lines, int_dpr__attendance and
      fct_daily_operations.
    columns:
      - name: scan_id
        description: "PK. Scan event id (usage_id), grain from source."
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }
      - name: scan_date
        description: "Scan date."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: key_facility
        description: >
          911dw facility resolved through Usage.ACP -> ACPs.AcpId ->
          ACPs.FacilityID -> Facility.IDNo -> Facility.FacilityID and
          seed_gateway_facility_map. 0 = the legacy else bucket; never null.
        data_tests: [not_null]
      - name: scan_sign
        description: "+1 = code-0 entry, -1 = code-11 reversal, 0 = does not count."
        data_tests:
          - not_null
          - accepted_values:
              values: [-1, 0, 1]
      - name: is_valid_scan
        description: "True = admitted entry scan (Status 0, Code 0, facility not excluded)."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: is_reversing_scan
        description: "True = code-11 reversal leg (subtracts from passes scanned)."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: is_counted_scan
        description: "True = the scan contributes to passes scanned in either direction."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: visitor_count
        description: "Raw source quantity on the scan (unsigned)."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: net_visitor_count
        description: >
          Signed passes-scanned contribution (quantity * scan_sign). 0 for scans
          the legacy rule drops. This is the column every attendance measure sums.
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: int_ticket_inventory
    description: >
      Ticket availability/capacity, one row per entry_date + ticket_type_id.
      Feeds fct_ticket_availability and ml_ticket_demand_features.
    data_tests:
      # Grain enforced by the in-model GROUP BY (entry_date, plu) — error.
      - unique:
          column_name: "entry_date || '~' || ticket_type_id"
    columns:
      - name: inventory_key
        description: "PK. Surrogate for the entry_date + ticket_type_id grain."
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }
      - name: entry_date
        description: "Admission date."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: ticket_type_id
        description: "Ticket type / PLU."
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: int_retail__customers
    description: "Retail transaction counts per business_date x key_facility."
    data_tests:
      # Grain enforced by the in-model GROUP BY — error.
      - unique:
          column_name: "date_key || '~' || key_facility"
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: key_facility
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: int_retail__performance
    description: "Tidy category-grain retail performance (sales/profit/units/donations)."
    data_tests:
      # Grain enforced by the in-model GROUP BY (date, facility, category) — error.
      # key_facility added: the model grain is date x facility x category, so the
      # previous [date_key, category_code] combination under-specified the grain.
      - unique:
          column_name: "date_key || '~' || key_facility || '~' || category_code"
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: category_code
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: int_retail__visitors
    description: "Visitor counts and ecom orders per business_date x key_facility."
    data_tests:
      # Grain enforced in-model (grouped CTEs full-outer-joined on the grain keys) — error.
      - unique:
          column_name: "date_key || '~' || key_facility"
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: key_facility
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: int_gateway__ticket_demand_features
    description: >
      Per-ticket demand features (presale timing, channel, utilization) feeding
      fct_ticket_demand_forecast and ml_ticket_demand_features. One row per
      ticket_id. Table-materialized (multi-consumer).
    columns:
      - name: ticket_id
        description: "PK. Ticket id (grain inherited from the ticket source)."
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }

  # ─── Budget / Forecast intermediates ──────────────────────────────────────────

  - name: int_budget__dpr_forecasts
    description: >
      Cleansed DPR budget/forecast: key_date cast to DATE, TEXT columns to
      numeric, NULLs coalesced to zero. One row per day.
    columns:
      - name: date_key
        description: "PK. Calendar date (converted from YYYYMMDD integer)."
        data_tests:
          - not_null
          # Grain inherited from the Excel-shaped budget seed (not enforced
          # in-model) — warn per the severity rule.
          - unique: { config: { severity: warn } }

  - name: int_budget__admissions_forecasts
    description: >
      Cleansed admissions/attendance budget by facility: key_date cast to DATE,
      TEXT columns to numeric, NULLs coalesced. One row per day x facility.
    columns:
      - name: date_key
        description: "Calendar date (converted from YYYYMMDD integer)."
        data_tests: [not_null]
      - name: key_facility
        data_tests: [not_null]
    data_tests:
      # Grain inherited from the Excel-shaped budget seed (not enforced
      # in-model) — warn per the severity rule.
      - unique:
          column_name: "date_key || '~' || key_facility"
          name: int_budget_admissions_forecasts_grain_unique
          config: { severity: warn }

  - name: int_budget__retail_forecasts
    description: >
      Cleansed retail budget/forecast by facility: key_date cast to DATE,
      TEXT columns to numeric, NULLs coalesced. One row per day x facility.
    columns:
      - name: date_key
        description: "Calendar date (converted from YYYYMMDD integer)."
        data_tests: [not_null]
      - name: key_facility
        data_tests: [not_null]
    data_tests:
      # Grain inherited from the Excel-shaped budget seed (not enforced
      # in-model) — warn per the severity rule.
      - unique:
          column_name: "date_key || '~' || key_facility"
          name: int_budget_retail_forecasts_grain_unique
          config: { severity: warn }
  - name: int_gateway__unissued_order_lines
    description: >
      Unissued (sold, not yet ticketed) Gateway order lines, one row per
      order_line_id x cohort x leg. Reproduces the four legacy unissued facts
      including the DisbursementDetails.Basis price CASE. Cohorts:
      museum_tickets, memorial_tours, mem_tour_mus_admission, ticketing_donations.
      Feeds int_dpr__admissions, int_dpr__tour_revenue, int_dpr__donations.
      Table-materialized: 3 consumers, 6 joins.
    data_tests:
      # Grain is enforced by construction (one row per source order line per
      # cohort/leg CTE), so error severity is safe here.
      - unique:
          column_name: "order_line_id || '~' || cohort || '~' || leg"
          name: int_gateway_unissued_order_lines_grain_unique
    columns:
      - name: order_line_id
        description: "Galaxy OrderLines.OrderLineID (part of the grain)."
        data_tests: [not_null]
      - name: cohort
        description: "Which legacy unissued fact this row reproduces."
        data_tests:
          - not_null
          - accepted_values:
              values: [museum_tickets, memorial_tours, mem_tour_mus_admission, ticketing_donations]
      - name: leg
        description: >
          'priced' = the Basis-CASE revenue leg; 'ga_zero' = the legacy second
          UNION leg that credits a GA quantity with zero revenue.
        data_tests:
          - not_null
          - accepted_values:
              values: [priced, ga_zero]
      - name: date_key
        description: >
          Event date for the ticket/tour cohorts (RMEvents.StartDateTime with the
          blessed event_ticket_date/ticket_date fallback), Orders.OpenDate for the
          donations cohort — matching the legacy basis per cohort.
        data_tests: [not_null]
      - name: ga_flag
        description: "Legacy GeneralAdmissionFlag CASE. 1 = general admission."
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: qty_unissued
        description: "quantity - issued_quantity. Always > 0 by the model filter."
        data_tests: [not_null]
      - name: amt_unissued
        description: "Unissued revenue from the DisbursementDetails.Basis CASE (0 on the ga_zero leg)."
        data_tests: [not_null]

  - name: int_gateway__tour_buyout
    description: >
      Guided-tour buyout lines (911dw.fact_museum_guided_tour_buyout), one row per
      date_key x plu x source_leg. Carries the legacy quantity suppression for
      MEMGTOBUY001 / MUSGTOBUY007 / MUSGTOBUY009 (revenue counts, tour count does
      not) and the TOUADDREV002 additional-revenue leg. Feeds int_dpr__tour_revenue.
    data_tests:
      - unique:
          column_name: "date_key || '~' || plu || '~' || source_leg"
          name: int_gateway_tour_buyout_grain_unique
    columns:
      - name: date_key
        description: "Recognized reporting date (legacy basis: rmEvents.StartDateTime)."
        data_tests: [not_null]
      - name: plu
        description: "Galaxy product PLU."
        data_tests: [not_null]
      - name: buyout_line_item
        description: >
          DPR line the buyout revenue is added back to, from seed_tour_buyout_plu.
          Typed NULL on the tour_additional_revenue leg — cause BLOCKED ON A
          BUSINESS RULE (TOUADDREV002's key_museum_category cannot be resolved
          without dim_galaxy_items), so that leg is not consumed downstream.
      - name: source_leg
        description: "'journal' or 'tour_additional_revenue'."
        data_tests:
          - not_null
          - accepted_values:
              values: [journal, tour_additional_revenue]
      - name: buyout_tours
        description: "Tour count AFTER the legacy suppression."
        data_tests: [not_null]
      - name: buyout_tours_unsuppressed
        description: "Tour count BEFORE the legacy suppression (audit companion)."
        data_tests: [not_null]
      - name: buyout_revenue
        description: "Buyout revenue. Always counts, suppression or not."
        data_tests: [not_null]

