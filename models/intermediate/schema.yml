version: 2

models:
  - name: int_gateway__ticket_journal_lines
    description: >
      Enriched Gateway ticket journal lines (JnlDetails jnl_code_id = 101),
      joined to tickets, items, vAttribute, COA, disbursement and events.
      Line grain. Backbone for all DPR ticket/tour/pass metrics.
    columns:
      - name: jnl_detail_id
        description: "PK. Natural key (journal detail line grain)."
        constraints:
          - type: primary_key
        data_tests: [not_null]
      - name: date_key
        description: "FK to dim_date.date_key. Recognized reporting date."
        data_tests: [not_null]
      - name: ga_flag
        description: 1 = general admission, 0 = tour/other.
        data_tests:
          - accepted_values:
              values: [0, 1]

  - name: int_gateway__item_journal_lines
    description: >
      Enriched Gateway item journal lines (JnlDetails jnl_code_id 102-104).
      Feeds audio guide, service fee and ticketing donation metrics.
    columns:
      - name: date_key
        description: "FK to dim_date.date_key."
        data_tests: [not_null]

  - name: int_dpr__tour_revenue
    description: >
      Guided (museum + memorial), virtual, field-trip and program tour
      quantities and revenue per day.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: mem_guided_tour_revenue
        description: Memorial guided tour revenue (%MGT% matrix, ga_flag = 0).
        data_tests: [not_null]

  - name: int_dpr__fees_and_services
    description: Service fees, audio guide revenue, memorial+museum tour per day.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]

  - name: int_dpr__retail
    description: CounterPoint retail gross profit, MUS AG, and retail donations per day.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]

  - name: int_dpr__donations
    description: Gateway ticketing/box/exit donations per day.
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]

  - name: int_dpr__admissions
    description: >
      GA tickets sold, ticket revenue, scanned-GA attendance proxy and
      CityPASS/C3 pass revenue per day. Partial attendance (see model header
      scope note; Sensource + additional-revenue inputs not yet staged).
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]

  - name: int_dpr__attendance
    description: >
      Scan-based museum and memorial attendance per day, from int_ticket_scans
      (valid Gateway scans) classified to area by facility name. mem_attendance
      feeds fct_daily_performance; mus_attendance_scanned is a QA companion to
      the ga-ticket attendance proxy in int_dpr__admissions. See model header
      scope note (facility-name classification; Sensource blend not yet staged).
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: mem_attendance
        description: Valid scans at memorial-classified facilities.
        data_tests: [not_null]
      - name: mus_attendance_scanned
        description: Valid scans at museum-classified facilities (QA only).
        data_tests: [not_null]

  - name: int_gateway__scan_lines
    description: >
      Gate scan lines with ticket market segment category. One row per scan
      event joined to the ticket's attribute for segment classification.
      Feeds fct_daily_scan.
    columns:
      - name: usage_id
        description: "PK. Natural key (scan event identifier)."
        constraints:
          - type: primary_key
        data_tests: [not_null]
      - name: date_key
        description: "FK to dim_date.date_key. Scan date."
        data_tests: [not_null]
      - name: category
        description: Sales channel / market category string for segment mapping.
        data_tests: [not_null]
