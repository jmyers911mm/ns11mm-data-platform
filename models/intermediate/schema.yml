version: 2

models:
  - name: int_gateway__ticket_demand_features
    description: "Ticket demand features with presale lead time and temporal patterns"
    columns:
      - name: ticket_id
        tests:
          - unique
          - not_null
      - name: entry_date
        tests:
          - not_null
      - name: plu
        tests:
          - not_null

  - name: int_gateway__item_journal_lines
    description: "Gateway item journal lines enriched with account details"

  - name: int_gateway__ticket_journal_lines
    description: "Gateway ticket journal lines with ticket associations"

  - name: int_counterpoint__retail_lines
    description: "CounterPoint retail line items with facility assignment"
    columns:
      - name: doc_id
        tests:
          - not_null
      - name: line_seq_no
        tests:
          - not_null

  - name: int_pos_tickets
    description: "Daily POS ticket transactions from gateway for revenue reporting"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: transaction_date
        tests:
          - not_null

  - name: int_ticket_scans
    description: "Gate scan events for visitor admission counts"
    columns:
      - name: scan_id
        tests:
          - unique
          - not_null
      - name: scan_date
        tests:
          - not_null

  - name: int_ticket_inventory
    description: "Derived daily ticket inventory (reservations vs capacity)"
    columns:
      - name: inventory_key
        tests:
          - unique
          - not_null
      - name: entry_date
        tests:
          - not_null
      - name: ticket_type_id
        tests:
          - not_null

  - name: int_dpr__admissions
    description: "DPR admissions revenue allocation"

  - name: int_dpr__donations
    description: "DPR donation revenue allocation"

  - name: int_dpr__fees_and_services
    description: "DPR fees and services revenue allocation"

  - name: int_dpr__retail
    description: "DPR retail revenue allocation"

  - name: int_dpr__tour_revenue
    description: "DPR tour revenue allocation"
