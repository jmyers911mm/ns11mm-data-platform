version: 2

sources:

  - name: gateway_seed
    description: Gateway Ticketing Galaxy — seed data from Galaxy SQL Server export
    database: NS11MM_DW_DEV_JMYERS
    schema: RAW
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 14, period: day}
    tables:
      - name: seed_gate_tickets
        description: Issued tickets with status, usage, pricing, and customer info
      - name: seed_gate_orders
        description: Sales orders/transactions
      - name: seed_gate_orderlines
        description: Order line items
      - name: seed_gate_items
        description: Product/ticket type catalog
      - name: seed_gate_usage
        description: Ticket usage/scan events
      - name: seed_gate_vusage
        description: Ticket usage report view
      - name: seed_gate_vattribute
        description: Ticket attribute values report view
      - name: seed_gate_facility
        description: Facility/venue reference
      - name: seed_gate_acps
        description: Access control points reference
      - name: seed_gate_rmevents
        description: Resource management events
      - name: seed_gate_jnlheaders
        description: Journal entry headers
      - name: seed_gate_jnldetails
        description: Journal entry details
      - name: seed_gate_jnlitems
        description: Journal items reference
      - name: seed_gate_jnltickets
        description: Journal ticket associations
      - name: seed_gate_coa
        description: Chart of accounts
      - name: seed_gate_disbursementdetails
        description: Payment disbursement details

  - name: counterpoint_seed
    description: NCR CounterPoint POS — seed data from SQL Server export
    database: NS11MM_DW_DEV_JMYERS
    schema: RAW
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 14, period: day}
    tables:
      - name: seed_cp_imitem
        description: Item master — product catalog with pricing, attributes, and dimensions
      - name: seed_cp_pstkthist
        description: POS ticket history headers — transaction summaries
      - name: seed_cp_pstkthistlin
        description: POS ticket history line items — individual sale lines
      - name: seed_cp_vitkthist
        description: Ticket history view — enriched transaction headers with billing/shipping
      - name: seed_cp_vitkthistlin
        description: Ticket history line view — enriched line items with pricing analysis
