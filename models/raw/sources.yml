version: 2

sources:

  - name: gateway_seed
    description: Gateway Ticketing Galaxy — seed data from Galaxy SQL Server export
    database: NS11MM_DW_DEV_JMYERS
    schema: RAW
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 14, period: day}
    tables:
      - name: seed_gate_tickets
        description: Issued tickets with status, usage, pricing, and customer info
      - name: seed_gate_orders
        description: Sales orders/transactions
      - name: seed_gate_orderlines
        description: Order line items
      - name: seed_gate_items
        description: Product/ticket type catalog
      - name: seed_gate_usage
        description: Ticket usage/scan events
      - name: seed_gate_vusage
        description: Ticket usage report view
      - name: seed_gate_vattribute
        description: Ticket attribute values report view
      - name: seed_gate_facility
        description: Facility/venue reference
      - name: seed_gate_acps
        description: Access control points reference
      - name: seed_gate_rmevents
        description: Resource management events
      - name: seed_gate_jnlheaders
        description: Journal entry headers
      - name: seed_gate_jnldetails
        description: Journal entry details
      - name: seed_gate_jnlitems
        description: Journal items reference
      - name: seed_gate_jnltickets
        description: Journal ticket associations
      - name: seed_gate_coa
        description: Chart of accounts
      - name: seed_gate_disbursementdetails
        description: Payment disbursement details

  - name: counterpoint_seed
    description: NCR CounterPoint POS — seed data from SQL Server export
    database: NS11MM_DW_DEV_JMYERS
    schema: RAW
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 14, period: day}
    tables:
      - name: seed_cp_imitem
        description: Item master — product catalog with pricing, attributes, and dimensions
      - name: seed_cp_pstkthist
        description: POS ticket history headers — transaction summaries
      - name: seed_cp_pstkthistlin
        description: POS ticket history line items — individual sale lines
      - name: seed_cp_vitkthist
        description: Ticket history view — enriched transaction headers with billing/shipping
      - name: seed_cp_vitkthistlin
        description: Ticket history line view — enriched line items with pricing analysis

  - name: report_estate_seed
    description: Report-estate 911dw tables loaded from stage (attendance, today's sales, ecommerce)
    database: NS11MM_DW_DEV_JMYERS
    schema: RAW
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 2, period: day}
      error_after: {count: 4, period: day}
    tables:
      - name: seed_fact_passes_by_hour
        description: Hourly gate passes (Galaxy1). Feeds Daily Attendance.
      - name: seed_fact_todays_retail_data
        description: Same-day hourly CounterPoint retail. Feeds Today's Sales.
      - name: seed_fact_todays_retail_product_data
        description: Same-day product-level retail. Today's Sales detail.
      - name: seed_fact_website_recurring_data_db
        description: Recurring online donation/membership (Drupal commerce). Feeds Website Commerce. (confirm _db vs _d8)
      - name: seed_fact_shopify_orders
        description: Shopify orders. Ecom (ADR-008).
      - name: seed_fact_shopify_discounts
        description: Shopify discounts. Ecom support.
      - name: seed_fact_shopify_cost_values
        description: Shopify cost values (COGS). Ecom profit support.

      - name: seed_sensource_visitors
        description: Sensource entries/exits/passes by facility (fact_visitors). Feeds visitor ratios + true attendance.
      - name: seed_sensource_attendance
        description: Pre-aggregated daily attendance by area (mem/mus + memorial-only/store/Vesey). Feeds Attendance Report.
      - name: seed_retail_budget
        description: Retail budget/forecast by facility/day (fact_retail_forecasts). ADR-005 budget seam.
      - name: seed_dsr_budget
        description: Daily-scan budget/forecast, wide by market segment (fact_dsr_forecasts). ADR-005 budget seam.
      - name: seed_stage_acceptance_uap_daily
      - name: seed_wifi_audience_real
        description: >
          RESTRICTED / PII. WiFi captive-portal audience
          (911dw.stage_acceptance_uap_daily, from the SFTP CSV feed): email,
          name, MAC/IP/NAD, AUP acceptance. Feeds the governed
          rpt_wifi_email_export. This is the REAL audience table (distinct from
          the misnamed wide-metrics seed_wifi_audience in 1.6.2).