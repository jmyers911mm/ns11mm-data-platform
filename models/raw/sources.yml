version: 2

sources:

  - name: salesforce_nps
    description: Salesforce NPS (Sales Cloud for Nonprofits) — CRM data
    database: NS11MM_DW_DEV
    schema: RAW
    loaded_at_field: _extracted_at
    config:
      freshness:
          warn_after: {count: 90, period: minute}
          error_after: {count: 180, period: minute}
    tables:
      - name: raw_salesforce_nps_contact
        description: Salesforce Contact object — raw VARIANT JSON from pipeline
      - name: raw_salesforce_nps_account
        description: Salesforce Account object
      - name: raw_salesforce_nps_opportunity
        description: Salesforce Opportunity object
      - name: raw_salesforce_nps_campaign
        description: Salesforce Campaign object
      - name: raw_salesforce_nps_task
        description: Salesforce Task object

