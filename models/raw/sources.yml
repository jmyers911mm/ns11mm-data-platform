        description: Access control points reference
      - name: seed_gate_rmevents
        description: Resource management events
      - name: seed_gate_jnlheaders
        description: Journal entry headers
      - name: seed_gate_jnldetails
        description: Journal entry details
      - name: seed_gate_jnlitems
        description: Journal items reference
      - name: seed_gate_jnltickets
        description: Journal ticket associations
      - name: seed_gate_coa
        description: Chart of accounts
      - name: seed_gate_disbursementdetails
        description: Payment disbursement details

