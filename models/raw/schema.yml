version: 2

models:
  # ─── Gateway staging ───────────────────────────────────────────────────────
  - name: stg_gateway__tickets
    description: "Staged gateway tickets with parsed dates and deduplication"
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null
      - name: sold_at
        description: "Timestamp ticket was sold — null for unsold/reserved"
      - name: ticket_date
        description: "Entry/visit date (sourced from endoflifedate)"

  - name: stg_gateway__orders
    description: "Staged gateway sales orders"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: stg_gateway__orderlines
    description: "Staged gateway order line items"
    columns:
      - name: order_line_id
        data_tests:
          - not_null

  - name: stg_gateway__items
    description: "Staged gateway product/ticket type catalog"
    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null
      - name: plu
        data_tests:
          - not_null

  - name: stg_gateway__usage
    description: "Staged gateway ticket usage/scan events"
    columns:
      - name: usage_id
        data_tests:
          - unique
          - not_null

  - name: stg_gateway__facility
    description: "Staged gateway facility reference"
    columns:
      - name: facility_id
        data_tests:
          - unique
          - not_null

  - name: stg_gateway__acps
    description: "Staged gateway access control points"
    columns:
      - name: acp_unique_id
        data_tests:
          - unique
          - not_null

  - name: stg_gateway__rmevents
    description: "Staged gateway resource management events"
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null

  - name: stg_gateway__jnlheaders
    description: "Staged gateway journal headers"
    columns:
      - name: jnl_tran_id
        data_tests:
          - unique
          - not_null

  - name: stg_gateway__jnldetails
    description: "Staged gateway journal details"

  - name: stg_gateway__jnlitems
    description: "Staged gateway journal items"

  - name: stg_gateway__jnltickets
    description: "Staged gateway journal ticket associations"

  - name: stg_gateway__coa
    description: "Staged gateway chart of accounts"

  - name: stg_gateway__vusage
    description: "Staged gateway ticket usage report view"

  - name: stg_gateway__vattribute
    description: "Staged gateway ticket attribute values"

  - name: stg_gateway__disbursementdetails
    description: "Staged gateway payment disbursement details"

  # ─── CounterPoint staging ──────────────────────────────────────────────────
  - name: stg_counterpoint__imitem
    description: "Staged CounterPoint item master"
    columns:
      - name: item_no
        data_tests:
          - unique
          - not_null

  - name: stg_counterpoint__pstkthist
    description: "Staged CounterPoint POS ticket history headers"
    columns:
      - name: doc_id
        data_tests:
          - unique
          - not_null

  - name: stg_counterpoint__pstkthistlin
    description: "Staged CounterPoint POS ticket history line items"
    columns:
      - name: doc_id
        data_tests:
          - not_null
      - name: line_seq_no
        data_tests:
          - not_null

  - name: stg_counterpoint__vitkthist
    description: "Staged CounterPoint ticket history enriched view"
    columns:
      - name: doc_id
        data_tests:
          - unique
          - not_null

  - name: stg_counterpoint__vitkthistlin
    description: "Staged CounterPoint ticket history line enriched view"
    columns:
      - name: doc_id
        data_tests:
          - not_null
      - name: line_seq_no
        data_tests:
          - not_null

  # ─── Report-estate staging ─────────────────────────────────────────────────
  - name: stg_budget__daily_scan
    description: "Staged DSR budget/forecast by market segment (wide). Feeds fct_daily_scan budget CTE."
    columns:
      - name: business_date
        data_tests:
          - not_null
          - unique

  # ─── Added coverage (round 2), CORRECTED ───────────────────────────────────
  # Column names verified against each model's real OUTPUT (staging renames the
  # source key_date -> business_date, tkt_hour -> hour_of_day, etc.). All grain
  # tests are severity: warn — they assert the documented grain over source data
  # (several are empty stubs until their feed lands). NOTE: a wrong column name
  # here is a COMPILE error that warn cannot suppress, so these are verified.
  - name: stg_counterpoint__todays_retail
    description: "Intraday CounterPoint retail tickets per store_id x doc_id x hour_of_day."
    data_tests:
      - unique:
          column_name: "store_id || '~' || doc_id || '~' || hour_of_day"
          config: { severity: warn }

  - name: stg_counterpoint__todays_retail_product
    description: "Intraday CounterPoint retail lines per store_id x doc_id x item_no x hour_of_day."
    data_tests:
      - unique:
          column_name: "store_id || '~' || doc_id || '~' || item_no || '~' || hour_of_day"
          config: { severity: warn }

  - name: stg_dpr__daily_metrics_wide
    description: "Wide daily DPR metrics feed, one row per business_date."
    columns:
      - name: business_date
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }

  - name: stg_ecommerce__website_recurring
    description: "Recurring online revenue per order_id x sku."
    data_tests:
      - unique:
          column_name: "order_id || '~' || sku"
          config: { severity: warn }

  - name: stg_gateway__passes_by_hour
    description: "Hourly gate passes per business_date x hour_of_day."
    data_tests:
      - unique:
          column_name: "business_date || '~' || hour_of_day"
          config: { severity: warn }

  - name: stg_sensource__attendance
    description: "Sensource attendance, one row per business_date."
    columns:
      - name: business_date
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }

  - name: stg_sensource__visitors
    description: "Sensource visitor counts per business_date x key_facility x acp_id. Two writers land on SEPARATE rows, distinguished by acp_id: acp_id = 0 is the Sensource API leg (num_entry / num_exit populated, passes_scanned 0); acp_id = a gate id is the Gateway leg from t_fact_museum_passes_scanned (passes_scanned populated, num_entry / num_exit NULL)."
    data_tests:
      - unique:
          column_name: "business_date || '~' || key_facility || '~' || acp_id"
          config: { severity: warn }

  - name: stg_memorial__attendance
    description: >
      Memorial plaza scanned passes per business_date x key_facility
      (911dw.memorial_attendance). Separate legacy table from fact_visitors —
      no fact_visitors writer emits key_facility 2000. The landed table may also
      carry an acp column, which is not projected, so business_date +
      key_facility uniqueness is guarded at warn rather than asserted.
    columns:
      - name: business_date
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: key_facility
        data_tests:
          - not_null: { config: { severity: warn } }
    data_tests:
      - unique:
          column_name: "business_date || '~' || key_facility"
          config: { severity: warn }

  - name: stg_shopify__cost_values
    description: "Shopify per-order cost values, one row per order_id."
    columns:
      - name: order_id
        data_tests:
          - not_null: { config: { severity: warn } }
          - unique:   { config: { severity: warn } }

  - name: stg_shopify__discounts
    description: "Shopify discounts per order_id x discount_code."
    data_tests:
      - unique:
          column_name: "order_id || '~' || discount_code"
          config: { severity: warn }

  - name: stg_shopify__orders
    description: "Shopify order lines per order_id x order_line_id."
    data_tests:
      - unique:
          column_name: "order_id || '~' || order_line_id"
          config: { severity: warn }

  - name: stg_wifi__audience
    description: >
      PII / RESTRICTED. WiFi captive-portal capture events, one row per
      mac_address x logged_at. Contains email_address and names — no value-level
      PII tests.
    data_tests:
      - unique:
          column_name: "mac_address || '~' || logged_at"
          config: { severity: warn }