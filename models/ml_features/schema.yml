version: 2

models:
  - name: ml_ticket_demand_features
    description: "Feature table for ticket demand forecasting with lag features and rolling averages"
    columns:
      - name: visit_date
        data_tests:
          - not_null
      - name: ticket_type
        data_tests:
          - not_null
      - name: daily_visitors
        description: "Target column for Snowflake ML FORECAST"
        data_tests:
          - not_null

  - name: ml_visitor_forecast_training
    description: "Training dataset for daily visitor count forecasting model"
    columns:
      - name: ds
        description: "Timestamp column for forecasting (visit_date as timestamp_ntz)"
        data_tests:
          - unique
          - not_null
      - name: y
        description: "Target: total daily visitors"
        data_tests:
          - not_null
