version: 2

models:
  - name: dim_date
    description: "Date dimension spanning 2000-2035 with commemoration day flag. Calendar-only today — fiscal columns pending Data & AI Committee sign-off on the fiscal-calendar definition (ADR-005)."
    columns:
      - name: date_key
        description: "PK. Natural key (calendar date)."
        data_type: date
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: is_commemoration_day
        description: >
          True for September 11 (anniversary). This flag exists because the anniversary
          creates structural anomalies across all metrics. Models reference this flag to
          treat September 11 as a known exception rather than a statistical outlier.
        data_tests:
          - not_null

  - name: dim_customer
    description: "Customer dimension from Gateway ticketing. Derives customer type from CUSTNO prefix patterns (Web, CityPass, Viator, etc.)."
    columns:
      - name: customer_key
        description: "PK. Gateway CUSTOMERID."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: gate_custno
        description: "CUSTNO text code (e.g. WEB001, CIT058). Prefix encodes customer type."
      - name: customer_type
        description: "Derived from CUSTNO prefix: Web, CityPass, Viator, Go City, GetYourGuide, Tiqets, Group, Pre-Sale, Rides/Partner, Other."
        data_tests:
          - not_null

  - name: dim_gate
    description: "Gate/access-point dimension combining ACPs with their parent facility from Gateway."
    columns:
      - name: gate_key
        description: "PK. ACP unique ID."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: acp_id
        description: "Access control point ID (join key for usage/scan tables)."
        data_tests:
          - not_null
      - name: facility_name
        description: "Parent facility name (Memorial, Museum Entrance, Guided Tour, etc.)."

  - name: dim_ticket_type
    description: "Ticket/admission type dimension from Gateway items catalog. Classifies PLUs into Ticket, Pass, Tour, Event, Merchandise."
    columns:
      - name: ticket_type_key
        description: "PK. Gateway ITEMID."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: plu
        description: "PLU code — business key for ticket items. Join key to tickets and orders."
        data_tests:
          - unique
          - not_null
      - name: item_type
        description: "Derived classification: Ticket, Pass, Tour, Event, Merchandise."
        data_tests:
          - not_null

  - name: dim_product
    description: "Retail product dimension from CounterPoint POS (museum store, carts, ecommerce)."
    columns:
      - name: product_key
        description: "PK. CounterPoint item_no."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: item_description
        description: "Short product description."
      - name: price_tier
        description: "Derived: Premium (>=50), Mid-Range (>=20), Value (>0), Unpriced."

  - name: dim_access_code
    description: "Access code dimension — maps the ~36 Gateway access codes to admission type categories."
    columns:
      - name: access_code_key
        description: "PK. Access code value."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: admission_type
        description: "Derived category: Museum General, Memorial, CityPass, Tour, Pass/Membership, Education, Audio Guide, Admin/Test, Other."
        data_tests:
          - not_null

  - name: dim_event
    description: "Event dimension from Gateway resource management — tours, timed-entry slots, programs, shows."
    columns:
      - name: event_key
        description: "PK. Gateway EVENTID."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: event_name
        description: "Event name."

  - name: dim_store
    description: "Retail store dimension mapping CounterPoint store IDs to facility names via seed_retail_store_facility."
    columns:
      - name: store_key
        description: "PK. CounterPoint store_id."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: store_name
        description: "Facility name (Museum Store, Memorial Carts, Ecommerce, Museum Cafe)."
        data_tests:
          - not_null

  - name: dim_facility
    description: "Facility/selling-area dimension from seed_facility_area. Single home for the key_facility -> area_name / area_group / is_selling / facility_group mapping consumed by fct_retail_daily, fct_retail_performance, fct_today_sales_hourly, dim_store, and (for facility_group) int_counterpoint__retail_lines."
    columns:
      - name: facility_key
        description: "PK. 911dw key_facility surrogate key."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: key_facility
        description: "Selling-area key. Join key from the retail facts and dim_store."
        data_tests:
          - unique
          - not_null
      - name: area_name
        description: "Human-readable area name (Museum Store, Memorial Carts, Atrium, Ecommerce, Museum Cafe, etc.)."
        data_tests:
          - not_null
      - name: area_group
        description: "Area rollup used as store_type / reporting group: Retail, Visitors, Ecom, Cafe, Audio, Membership."
        data_tests:
          - not_null
      - name: facility_group
        description: "Stable snake_case facility identity (museum_store, memorial_carts, museum_cafe, mag_cart, mus_ag, ecommerce, other) referenced by the DPR retail model."
        data_tests:
          - not_null
      - name: is_selling
        description: "True if the area transacts sales (vs. traffic-only areas like the Atrium)."

  - name: dim_coa
    description: "Chart of Accounts dimension from Gateway GL system for journal entry classification."
    columns:
      - name: coa_key
        description: "PK. Gateway COA ID."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: account_name
        description: "GL account name."
      - name: account_kind
        description: "S=Summary, D=Detail."

  - name: dim_tour_product
    description: "Tour product classification mapping PLU codes to DPR tour types for reporting segmentation."
    columns:
      - name: tour_product_key
        description: "PK. PLU code."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: tour_type
        description: "DPR line item category: mem_field_trip, mus_field_trip, revealed_tour, ask_educator, youth_fam_tour, early_access_tour, ea_mem_mus_tour, architecture_tour."
        data_tests:
          - not_null

  # ─── Still awaiting external source connections ─────────────────────────────
  - name: dim_campaign
    description: "Campaign dimension from Salesforce. STATUS: Awaiting RAW connection."
    columns:
      - name: id
        description: "PK. Natural key (Salesforce campaign ID)."
        constraints:
          - type: primary_key

  - name: dim_payment_method
    description: "Payment method reference dimension."
    columns:
      - name: id
        description: "PK. Natural key."
        constraints:
          - type: primary_key

  - name: dim_fund
    description: "Blackbaud GL fund dimension. STATUS: Awaiting Blackbaud RAW connection."
    columns:
      - name: fund_id
        description: "PK. Natural key (Blackbaud fund ID)."
        constraints:
          - type: primary_key

  - name: dim_budget_version
    description: "Vena plan version dimension. STATUS: Awaiting Vena RAW connection."

  - name: dim_dpr_line_item
    description: "DPR report line-item metadata: section, display order, formatting, and availability status for each measure."
    columns:
      - name: line_item_key
        description: "PK. Surrogate = line_item_code."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: line_item_code
        description: "Business key (e.g. TICKETS_SOLD, MEM_ATTENDANCE)."
        data_tests:
          - not_null
      - name: section
        description: "Report section grouping (Memorial Attendance, Guided Tours, Retail & Cafe, etc.)."
      - name: value_type
        description: "additive (summable) or ratio (recompute at query grain)."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']
      - name: availability
        description: "Available = live in dbt today; Partial = some components gapped; Gap = source not yet staged."
        data_tests:
          - accepted_values:
              values: ['Available', 'Partial', 'Gap']

  - name: dim_retail_line_item
    description: "Retail Performance Report line-item metadata: section, display order, indent, number format, availability, and (for ratio lines) numerator/denominator source measures."
    columns:
      - name: line_item_key
        description: "PK. Surrogate = line_item_code."
        constraints:
          - type: primary_key
        data_tests: [unique, not_null]