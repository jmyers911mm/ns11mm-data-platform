version: 2

models:
  - name: fct_ticket_availability
    description: "Real-time ticket capacity and utilization by date/window/type"
    columns:
      - name: availability_key
        description: "PK. Surrogate key (hash of entry_date + ticket_type + window)."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: entry_date
        description: "FK to dim_date.date_key. Visitor entry date."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: ticket_type
        data_tests:
          - not_null
      - name: utilization_pct
        description: "Percentage of capacity reserved (0-100)"
        data_tests:
          - not_null

  - name: fct_ticket_demand_forecast
    description: "Ticket demand aggregated for forecasting and presale analysis"
    columns:
      - name: entry_date
        description: "FK to dim_date.date_key. Visitor entry date."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: plu
        data_tests:
          - not_null
      - name: ticket_count
        data_tests:
          - not_null
      - name: total_revenue
        data_tests:
          - not_null

  - name: fct_daily_operations
    description: "Daily operational metrics: visitors, ticket sales, revenue, retail"
    columns:
      - name: visit_date
        description: "PK. Natural key (calendar date of operations)."
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: total_visitors
        data_tests:
          - not_null
      - name: ticket_revenue
        data_tests:
          - not_null
      # Added round 2 (retail wiring). warn severity — coalesced to 0 so they
      # cannot actually fail; kept warn only to guarantee no build-blocking.
      - name: retail_revenue
        description: "CounterPoint merchandise sales (non-donation), day grain."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: retail_transactions
        description: "Distinct CounterPoint tickets with non-donation lines."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: total_revenue
        description: "ticket_revenue + retail_revenue."
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: fct_retail_performance
    description: >
      Tidy category-grain retail fact (one row per date x facility x category).
      Additive sales/profit/units/donations; replaces legacy fact_retail.
    columns:
      - name: date_key
        description: "FK to dim_date.date_key."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: key_facility
        description: "FK to seed_facility_area.key_facility."
        data_tests: [not_null]
      - name: category_code
        description: "CounterPoint product category (Donations folded to 'Donations')."
        data_tests: [not_null]
      - name: net_sales
        description: "Sale minus return amount, non-donation lines."
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, key_facility, category_code]
          name: fct_retail_performance_grain_unique
          config:
            where: "category_code is not null"

  - name: fct_retail_daily
    description: >
      Facility-grain retail fact (one row per date x facility). Transaction and
      visitor counts plus facility rollups; grain for the report ratios.
    columns:
      - name: date_key
        description: "FK to dim_date.date_key."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: key_facility
        description: "FK to seed_facility_area.key_facility."
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, key_facility]
          name: fct_retail_daily_grain_unique

  - name: fct_daily_performance
    description: >
      Day-grain DPR fact. One additive measure per column; ratios excluded
      by design (computed in rpt_ layer). Replaces legacy fact_dpr_report_data.
    columns:
      - name: date_key
        description: "PK / FK to dim_date.date_key."
        constraints:
          - type: primary_key
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: tickets_sold
        data_tests: [not_null]
      - name: ticket_revenue
        data_tests: [not_null]
      - name: mem_attendance
        description: >
          Memorial attendance (valid Gateway scans at memorial facilities).
          Scan component only; Sensource blend gated (see int_dpr__attendance).
        data_tests: [not_null]
      - name: mem_guided_tour_revenue
        description: Memorial guided tour revenue (%MGT% matrix, ga_flag = 0).
        data_tests: [not_null]

  - name: fct_daily_scan
    description: >
      Day x segment grain Daily Scan fact. Passes scanned, tickets sold, and
      budget by market segment per day. Feeds rpt_daily_scan.
    columns:
      - name: date_key
        description: "FK to dim_date.date_key."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: segment_key
        description: "FK to seed_scan_market_segment.segment_key."
        data_tests: [not_null]
      - name: passes_scanned
        data_tests: [not_null]
      - name: tickets_sold
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, segment_key]
          name: fct_daily_scan_grain_unique

  - name: fct_today_sales_hourly
    description: >
      Intraday retail fact from the same-day CounterPoint feed: one row per
      date x hour_of_day x key_facility with additive transactions, units,
      sales, cost, and profit. Backs the Today's Sales report via the
      ATTENDANCE semantic view / rpt_today_sales_powerbi.
    data_tests:
      # Grain enforced by the in-model GROUP BY — error.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, hour_of_day, key_facility]
          name: fct_today_sales_hourly_grain_unique
    columns:
      - name: date_key
        description: "FK to dim_date.date_key. Business date."
        data_tests: [not_null]
      - name: hour_of_day
        description: "Hour of the business day (from the CounterPoint feed)."
        data_tests: [not_null]
      - name: key_facility
        description: "Resolved 911dw facility key (-1 = unmapped store)."
        data_tests: [not_null]

  # ─── Budget / Forecast facts ──────────────────────────────────────────────────

  - name: fct_budget_dpr_forecasts
    description: >
      DPR budget/forecast fact (one row per day). Budget counterpart to
      fct_daily_performance — tickets, revenue, audio, donations, ecommerce,
      cafe, tours.
    columns:
      - name: date_key
        description: "PK / FK to dim_date.date_key."
        constraints:
          - type: primary_key
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: tickets_sold
        data_tests: [not_null]
      - name: ticket_revenue
        data_tests: [not_null]

  - name: fct_budget_admissions_forecasts
    description: >
      Admissions/attendance budget by facility (one row per day x facility).
      Attendance, tickets, tours, CityPASS.
    columns:
      - name: date_key
        description: "FK to dim_date.date_key."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: key_facility
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, key_facility]
          name: fct_budget_admissions_forecasts_grain_unique

  - name: fct_budget_retail_forecasts
    description: >
      Retail budget/forecast by facility (one row per day x facility).
      Visitors, conversion, profit, donations, revenue.
    columns:
      - name: date_key
        description: "FK to dim_date.date_key."
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: [date_key]
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: key_facility
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, key_facility]
          name: fct_budget_retail_forecasts_grain_unique