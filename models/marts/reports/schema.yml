version: 2

models:
  - name: rpt_member_360
    description: "Unified member/customer 360 view aggregating tickets, retail, donations, and email engagement"
    columns:
      - name: customer_id
        description: "Resolved customer identifier from dim_customer"
        tests:
          - unique
          - not_null
      - name: total_lifetime_value
        description: "Sum of ticket + retail + donation spend"
        tests:
          - not_null
      - name: engagement_segment
        description: "Derived engagement level based on email activity and recency"
        tests:
          - accepted_values:
              values: ['Highly Engaged', 'Engaged', 'Lapsed']
      - name: ltv_tier
        description: "Value tier: High Value (>=1000), Medium (>=200), Low (>0), No Spend"
        tests:
          - accepted_values:
              values: ['High Value', 'Medium Value', 'Low Value', 'No Spend']

  - name: rpt_customer_ltv
    description: "Customer lifetime value report with spend breakdown across ticket, retail, and donations"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: ltv_tier
        tests:
          - accepted_values:
              values: ['Platinum', 'Gold', 'Silver', 'Bronze']

  - name: rpt_daily_operations
    description: "Daily executive operations dashboard: visitors, revenue, retail, and weather"

  - name: rpt_ticket_sales
    description: "Ticket sales summary report with visitor category breakdown and trend analysis"

  - name: rpt_visitor_traffic
    description: "Visitor traffic patterns report with day-of-week and seasonal analysis"

  - name: rpt_retail_performance
    description: "Retail performance report: revenue, units, AOV by channel and category"

  - name: rpt_digital_marketing
    description: "Digital marketing performance report: spend, conversions, ROAS across channels"

  - name: rpt_campaign_performance
    description: "Campaign performance report with attribution and ROI metrics"

  - name: rpt_revenue_bridge
    description: "Revenue bridge analysis: period-over-period variance decomposition by revenue stream"

  - name: rpt_daily_performance_report
    description: >
      Power BI consumption layer for the Daily Performance Report. Today /
      MTD / YTD additive roll-ups plus non-additive ratios computed at this
      grain. Budget/variance columns gated on budget-source staging + ADR-005.
    columns:
      - name: date_id
        data_tests: [not_null, unique]
      - name: date_value
        data_tests: [not_null, unique]
      - name: avg_ticket_price
        description: Non-additive; total_admission_revenue / tickets_sold.

  - name: rpt_attendance
    description: "Attendance Report: memorial/museum attendance + Sensource memorial-only and store visitor counts (Sensource stubbed)."
  - name: rpt_daily_attendance
    description: "Daily Attendance Report: museum attendance from hourly passes (stubbed) with scan-based fallback."
  - name: rpt_website_commerce
    description: "Website Commerce Report: recurring online donation/membership revenue by month/year (ecom source stubbed, ADR-008)."
  - name: fct_today_sales_hourly
    description: "Today's Sales hourly retail fact (real-time CP feed stubbed)."
    columns:
      - name: date_key
        data_tests: [not_null]

  - name: rpt_wifi_email_export
    description: >
      RESTRICTED / PII. Blue State WiFi marketing email extract. Classified
      Restricted per DATA_CLASSIFICATION.md; masking applied via on-run-end
      hook; least-privilege access only; do not grant to POWERBI_ROLE/ML_ROLE.
    config:
      tags: ['pii', 'restricted', 'marketing_export']
    columns:
      - name: capture_date
        description: Date the audience row was captured.
      - name: email_address
        description: "PII (Restricted). Direct identifier. Masked for non-privileged roles."
        meta:
          classification: restricted_pii
          contains_pii: true
        data_tests: [not_null]
      - name: first_name
        description: "PII (Restricted). Direct identifier."
        meta:
          classification: restricted_pii
          contains_pii: true
      - name: last_name
        description: "PII (Restricted). Direct identifier."
        meta:
          classification: restricted_pii
          contains_pii: true
      - name: rpt_retail_performance
