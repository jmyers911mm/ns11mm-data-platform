# models/marts/reports/_reports__models.yml
version: 2

models:
  - name: rpt_dpr_report_long
    description: >
      Tidy DPR presentation, one row per (report_date, line_item_code). All
      composites and the ratio components are resolved in SQL (ADR-004: no logic
      in Power BI). amount is additive; numerator/denominator carry the ratio row.
    config:
      materialized: view
      grants:
        select: ['POWERBI_ROLE']
    columns:
      - name: report_date
        description: Calendar date. Joins to dim_date.
        data_tests: [not_null]
      - name: line_item_code
        description: Joins to dim_dpr_line_items.line_item_code.
        data_tests:
          - not_null
          - relationships:
              to: ref('dpr_line_items')
              field: line_item_code
      - name: amount
        description: Actual additive value for the line item on the date (NULL for ratio rows).
      - name: numerator
        description: Actual ratio numerator (NULL for additive rows).
      - name: denominator
        description: Actual ratio denominator (NULL for additive rows).
      - name: budget_amount
        description: Budget additive value (NULL for ratio rows and for unmapped rows — donation composites, Professional Program, Total Estimated Revenue, Virtual Tour Revenue).
      - name: budget_numerator
        description: Budget ratio numerator (NULL for additive rows).
      - name: budget_denominator
        description: Budget ratio denominator (NULL for additive rows).
  
  - name: rpt_dpr_budget_daily
    description: >
      Day-grain DPR budget, conformed from FCT_BUDGET_DPR_FORECASTS (primary),
      FCT_BUDGET_ADMISSIONS_FORECASTS (attendance + guided tours, facility-summed),
      and FCT_BUDGET_RETAIL_FORECASTS (store/carts/cafe profit by facility). Column
      names mirror rpt_dpr_powerbi so both unpivot identically in rpt_dpr_report_long.
    config:
      materialized: view
    columns:
      - name: report_date
        description: Calendar date.
        data_tests:
          - not_null
          # Grain partially inherited (the dpr CTE passes fct_budget_dpr_forecasts
          # rows through un-aggregated) -> warn per the severity rule
          - unique:
              config: { severity: warn }
  - name: rpt_dpr_powerbi
    description: >
      Power BI consumption layer over the DPR semantic view (MARTS.DPR).
      One row per REPORT_DATE. Thin, display-only projection per ADR-004 — no
      business logic; metric definitions live in the semantic view. Non-additive
      ratios (avg ticket price, store per-cap) are intentionally omitted and
      recomputed in DAX from summed components.
    config:
      materialized: view
      grants:
        select: ['POWERBI_ROLE']
      # contract:                 # enable after confirming column types (DESCRIBE the view)
      #   enforced: true
    meta:
      owner: "Data & AI Team"
      serves: "Power BI — Daily Performance Report"
      source_of_truth: "MARTS.DPR semantic view"
    columns:
      # ---------------- grain / date dimensions ----------------
      - name: report_date
        description: Calendar date the numbers are recognized on. Table grain.
        data_type: date
        data_tests:
          - not_null
          # Grain inherited from the DPR semantic view (not enforced in this
          # thin projection) — warn per the severity rule.
          - unique: { config: { severity: warn } }
      - name: calendar_year
        description: Calendar year (Jan–Dec).
        data_type: number
      - name: calendar_quarter
        description: Calendar quarter (1–4).
        data_type: number
      - name: calendar_month
        description: Calendar month number (1–12).
        data_type: number
      - name: month_name
        description: Abbreviated month name.
        data_type: varchar
      - name: day_of_month
        description: Day of the month (1–31).
        data_type: number
      - name: day_name
        description: Abbreviated day-of-week name.
        data_type: varchar
      - name: is_weekend
        description: TRUE on Saturday and Sunday.
        data_type: boolean
      - name: is_commemoration_day
        description: TRUE for the September 11 commemoration day (known structural exception).
        data_type: boolean

      # ---------------- attendance ----------------
      - name: memorial_attendance
        description: Memorial attendance (scan component only; Sensource blend not yet staged).
        data_type: number
      - name: museum_attendance
        description: Museum attendance (GA-ticket-scanned proxy).
        data_type: number

      # ---------------- admissions (ratio components) ----------------
      - name: tickets_sold
        description: General-admission tickets sold (issued-GA definition).
        data_type: number
      - name: ticket_revenue
        description: General-admission ticket revenue.
        data_type: number
      - name: pass_revenue
        description: CityPASS / C3 pass revenue (estimated; updated ~6 weeks later).
        data_type: number
      - name: admission_revenue
        description: Ticket revenue plus pass revenue.
        data_type: number

      # ---------------- guided tours ----------------
      - name: mem_mus_tours
        description: Memorial + Museum combined tour ticket count.
        data_type: number
      - name: mem_mus_tour_revenue
        description: Memorial + Museum combined tour revenue.
        data_type: number
      - name: museum_guided_tours
        description: Museum guided tour ticket count.
        data_type: number
      - name: mus_guided_tour_revenue
        description: Museum guided tour revenue.
        data_type: number
      - name: memorial_guided_tours
        description: Memorial guided tour ticket count.
        data_type: number
      - name: mem_guided_tour_revenue
        description: Memorial guided tour revenue.
        data_type: number
      - name: revealed_tour_revenue
        description: Revealed tour revenue (tentatively maps to PDF "Early Access Museum Tour" — confirm).
        data_type: number
      - name: virtual_tour_revenue
        description: All virtual tour revenue (memorial + museum + youth & family).
        data_type: number
      - name: virtual_yf_tour_revenue
        description: Virtual Youth & Family Memorial tour revenue.
        data_type: number

      # ---------------- retail & cafe ----------------
      - name: mus_store_gross_profit
        description: Museum Store gross profit (sales minus cost).
        data_type: number
      - name: retail_carts_gross_profit
        description: Memorial Carts gross profit.
        data_type: number
      - name: cafe_profit
        description: Cafe gross profit.
        data_type: number

      # ---------------- audio ----------------
      - name: audio_tour_headset
        description: Museum audio/headset revenue (Galaxy guide + CounterPoint MUS AG).
        data_type: number

      # ---------------- donation components (assembled into composites in DAX) ----------------
      - name: cart_donation_ask
        description: Memorial cart donation-ask collections.
        data_type: number
      - name: box_office_mem_don
        description: Box office memorial (plaza) box donations.
        data_type: number
      - name: donation_box
        description: General donation box collections.
        data_type: number
      - name: ecom_donation_ask
        description: Ecommerce donation-ask collections.
        data_type: number
      - name: ticketing_donations
        description: Gateway ticketing donations (excludes box/exit categories).
        data_type: number
      - name: box_office_mus_exit_don
        description: Box office museum exit box donations.
        data_type: number
      - name: coatcheck_don
        description: Coat check donations.
        data_type: number
      - name: mus_store_don
        description: Museum Store donations.
        data_type: number
      - name: mus_exit_don
        description: Museum exit donations (CounterPoint).
        data_type: number
      - name: cafe_don
        description: Cafe donations.
        data_type: number

  - name: rpt_retail_powerbi
    description: >
      Power BI consumption layer over the RETAIL semantic view (MARTS.RETAIL).
      One row per (REPORT_DATE, KEY_FACILITY). Thin, display-only projection per
      ADR-004 — no business logic; metric definitions live in the semantic view.
      Non-additive ratios are omitted and recomputed from summed components.
    config:
      materialized: view
    data_tests:
      # Inherited from the semantic-view projection -> warn (severity rule;
      # matches the warn'd uniqueness on the DPR sibling wrapper)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [report_date, key_facility]
          name: rpt_retail_powerbi_grain_unique
          config: { severity: warn }
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: key_facility
        data_tests: [not_null]

  - name: rpt_retail_budget_daily
    description: >
      Day × facility retail budget (goal), conformed from FCT_BUDGET_RETAIL_FORECASTS.
      Column names mirror rpt_retail_powerbi so both unpivot identically in
      rpt_retail_report_long. net_units and ecom_orders have no budget source (NULL).
    config:
      materialized: view

  - name: rpt_retail_report_long
    description: >
      Tidy Retail Performance presentation, one row per (report_date, key_facility,
      line_item_code) carrying actual + budget. Ratio lines carry numerator/denominator
      (ratio-of-sums recomputed at display grain, ADR-004). Visitor-based ratios NULL
      until Sensource; attendance is cross-domain (fct_daily_performance actual, forecast goal).
    config:
      materialized: view

  - name: rpt_retail_category_long
    description: >
      Category page (page 2): one row per (report_date, key_facility, category_code)
      with additive units/profit/sales/donations. Budget is category-level NULL today.
    config:
      materialized: view

  - name: rpt_retail_narrative_brief
    description: >
      Deterministic one-row-per-day JSON brief of retail facts (headline totals,
      per-area splits, DoD/WoW/YoY, MTD/YTD, 7-day direction, top movers). Sole input
      to the Cortex narrative — unit-test this, not the LLM output. ADR-004.
    config:
      materialized: view

  - name: rpt_retail_narrative
    description: >
      DISABLED (enabled=false). Documents the AI_COMPLETE logic and is the source SQL
      for the daily task in scripts/setup_retail_narrative.sql. Narrates only brief_json.

  # ─── Coverage pass (2026-07-29): descriptions for the remaining active reports.
  # Reports inherit their grain from upstream marts, so tests here are warn per
  # the severity rule (grain enforced in-model -> error; inherited -> warn).

  - name: rpt_dpr_narrative_brief
    description: >
      Deterministic one-row-per-day JSON brief of DPR facts (actuals, budget,
      DoD/WoW, MTD/YTD context, direction flags, top movers). Sole input to the
      Cortex DPR narrative — unit-test this, not the LLM output. ADR-004.
    columns:
      - name: report_date
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_dpr_narrative
    description: >
      DISABLED (enabled=false). Documents the AI_COMPLETE logic and is the source
      SQL for the daily task in scripts/setup_dpr_narrative.sql. Narrates only the
      pre-computed brief_json from rpt_dpr_narrative_brief.

  - name: rpt_daily_scan_powerbi
    description: >
      Thin SEMANTIC_VIEW() projection of the ATTENDANCE semantic view for Power BI
      (Daily Scan). One row per report_date x segment_key; additive tickets sold,
      passes scanned, and DSR forecast only — shares and variance % recompute at
      display grain.
    columns:
      - name: report_date
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_today_sales_powerbi
    description: >
      Thin SEMANTIC_VIEW() projection of the ATTENDANCE semantic view for Power BI
      (Today's Sales). One row per report_date x hour_of_day x key_facility;
      additive intraday sales, profit, units, and transactions.
    columns:
      - name: report_date
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_daily_performance_report
    description: >
      Power BI-facing Daily Performance Report surface: one row per date with
      today / MTD / YTD roll-ups of fct_daily_performance additive measures plus
      the non-additive ratios (avg ticket price, per-cap) computed at this grain.
      Materialized as a table (import source / snapshot target).
    columns:
      - name: date_value
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_attendance
    description: >
      Attendance Report view: one row per date combining DPR memorial/museum
      attendance from fct_daily_performance with Sensource plaza counts and
      retail store visitor counts (Sensource inputs stubbed until sensordata lands).
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_daily_attendance
    description: >
      Daily Attendance Report view: one row per date. Museum attendance from the
      hourly-passes feed (stub), falling back to scan-based attendance from
      fct_daily_performance so the report is non-empty today.
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_daily_scan
    description: >
      Daily Scan Report view: one row per date x market segment with passes
      scanned, tickets sold, market-mix percentages computed at query grain
      (window sums), and budget variance seams.
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_memorial_museum_tracker_ytd
    description: >
      Memorial Museum Daily Tracker (YTD) view: one row per date with day values
      and calendar-year YTD cumulative sums over fct_daily_performance measures
      plus civic_programs (placeholder). Actuals only — no budget columns (the
      projection lives in rpt_tracker_budget_daily). Superseded for the Power BI
      Tracker build by the rpt_tracker_* stack; kept for existing consumers.
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_monthly_retail_kpi
    description: >
      Monthly Retail KPI view: one row per calendar month x selling area, rolling
      up fct_retail_daily with ratio-of-sums KPIs recomputed at the month grain.
      Visitor-based KPIs NULL until Sensource lands.
    data_tests:
      # Grain enforced by the in-model GROUP BY -> error (severity rule)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [calendar_year, calendar_month, key_facility]
          name: rpt_monthly_retail_kpi_grain_unique

  - name: rpt_retail_carts_analysis
    description: >
      Retail Carts Analysis view: one row per date for the Memorial Carts area,
      with the legacy adjusted-memorial-visitor denominator driving capture rate
      and per-cap ratios (NULL until Sensource lands). Additive sales, profit,
      and customers are live.
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_retail_performance
    description: >
      Retail Performance Report view: one row per date x facility with the
      report's non-additive ratios (conversion, rev-per-visitor, avg sale,
      donation-per-visitor, profit margin) computed at query grain from
      fct_retail_daily, plus MTD/YTD roll-ups on demand.
    columns:
      - name: date_key
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_website_commerce
    description: >
      Website Commerce Report view: one row per month x revenue type x revenue
      year of recurring online donation and membership revenue from
      stg_ecommerce__website_recurring.
    data_tests:
      # Grain enforced by the in-model GROUP BY -> error (severity rule)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [month_of_year, revenue_type, revenue_year]
          name: rpt_website_commerce_grain_unique

  # ─── Reports 2–4 serving stacks (2026-07-31): Today's Sales, Daily Scan,
  # Memorial & Museum Daily Tracker YTD. Same severity rule as above: grain
  # enforced in-model -> error; inherited from a projection/GROUP-BY -> warn.

  - name: rpt_today_sales_report_long
    description: >
      Tidy Today's Sales presentation, one row per (report_date, hour_of_day,
      key_facility, line_item_code). Ratio lines carry numerator/denominator
      (ratio-of-sums recomputed at display grain, ADR-004). No budget columns —
      the report has no goals. Stub lines (visitors/attendance/totes) are typed
      NULL until the intraday feeds land.
    config:
      materialized: view
      grants:
        select: ['POWERBI_ROLE']
    columns:
      - name: report_date
        description: Calendar date. Joins to dim_date.
        data_tests: [not_null]
      - name: line_item_code
        description: Joins to dim_today_sales_line_item.line_item_code.
        data_tests:
          - not_null
          - relationships:
              to: ref('today_sales_line_items')
              field: line_item_code
      - name: amount
        description: Actual additive value for the line item (NULL for ratio and stub rows).
      - name: numerator
        description: Ratio numerator (NULL for additive rows).
      - name: denominator
        description: Ratio denominator (NULL for additive rows).

  - name: rpt_today_sales_narrative_brief
    description: >
      Deterministic one-row-per-day JSON brief of intraday Today's Sales facts
      (day-to-date totals, per-area splits, top hour/area, vs same-weekday-last-
      week full-day deltas). Sole input to the Cortex narrative — unit-test
      this, not the LLM output. ADR-004.
    config:
      materialized: view
    columns:
      - name: report_date
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_today_sales_narrative
    description: >
      DISABLED (enabled=false). Documents the AI_COMPLETE logic and is the source
      SQL for the task in scripts/setup_today_sales_narrative.sql. Narrates only
      the pre-computed brief_json from rpt_today_sales_narrative_brief.

  - name: rpt_daily_scan_report_long
    description: >
      Tidy Daily Scan presentation, one row per (report_date, segment_key,
      line_item_code) carrying the three additive measures as line items
      (TICKETS_SOLD / FORECAST_TICKETS_SOLD / PASSES_SCANNED). Variance %,
      % Used, and % of Market are DAX ratio-of-sums between the carried line
      items (ADR-004). Segment labels/order from seed_scan_market_segment
      upstream — no line-item seed.
    config:
      materialized: view
      grants:
        select: ['POWERBI_ROLE']
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: line_item_code
        data_tests:
          - not_null
          - accepted_values:
              values: ['TICKETS_SOLD', 'FORECAST_TICKETS_SOLD', 'PASSES_SCANNED']

  - name: rpt_daily_scan_narrative_brief
    description: >
      Deterministic one-row-per-day JSON brief of Daily Scan facts (total sold
      vs forecast, scanned, utilization, biggest over/under-forecast segments,
      market-mix leaders). Sole input to the Cortex narrative — unit-test this,
      not the LLM output. ADR-004.
    config:
      materialized: view
    columns:
      - name: report_date
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_daily_scan_narrative
    description: >
      DISABLED (enabled=false). Documents the AI_COMPLETE logic and is the source
      SQL for the daily task in scripts/setup_daily_scan_narrative.sql. Narrates
      only the pre-computed brief_json from rpt_daily_scan_narrative_brief.

  - name: rpt_tracker_powerbi
    description: >
      Day-grain Tracker ACTUALS conform: thin projection of rpt_dpr_powerbi
      (sanctioned rpt -> rpt projection-chain exception) carrying attendance,
      tickets sold, and every additive earned-revenue component. One row per
      REPORT_DATE. The Total Earned Revenue composite is summed in DAX from
      the carried components (mirrors DPR TOTAL_ESTIMATED_REVENUE).
    config:
      materialized: view
      grants:
        select: ['POWERBI_ROLE']
    columns:
      - name: report_date
        description: Calendar date the numbers are recognized on. Table grain.
        data_tests:
          - not_null
          # Grain inherited from rpt_dpr_powerbi (projection) — warn per the
          # severity rule.
          - unique: { config: { severity: warn } }

  - name: rpt_tracker_budget_daily
    description: >
      Day-grain Tracker PROJECTION conform: thin projection of
      rpt_dpr_budget_daily. Column names mirror rpt_tracker_powerbi so both
      unpivot identically in rpt_tracker_report_long. Donations and virtual-tour
      revenue are not in the budget — typed NULL, excluded from the projection.
    config:
      materialized: view
    columns:
      - name: report_date
        data_tests:
          - not_null
          # Grain inherited from rpt_dpr_budget_daily (projection) — warn per
          # the severity rule.
          - unique: { config: { severity: warn } }

  - name: rpt_tracker_report_long
    description: >
      Tidy Tracker presentation, one row per (report_date, line_item_code)
      carrying actual + projection. The tracker prints projection as its own
      row, so "... Projection" codes carry the projection in budget_amount and
      the actual codes carry no budget. Memorial-vs-museum revenue split is an
      open business-rule seam (typed NULL). ADR-004: no logic in Power BI.
    config:
      materialized: view
      grants:
        select: ['POWERBI_ROLE']
    columns:
      - name: report_date
        description: Calendar date. Joins to dim_date.
        data_tests: [not_null]
      - name: line_item_code
        description: Joins to dim_tracker_line_item.line_item_code.
        data_tests:
          - not_null
          - relationships:
              to: ref('tracker_line_items')
              field: line_item_code
      - name: amount
        description: Actual additive value (NULL for ratio, stub, and projection rows).
      - name: budget_amount
        description: Projection value, carried on the "... Projection" codes only.

  - name: rpt_tracker_narrative_brief
    description: >
      Deterministic one-row-per-day JSON brief of Tracker facts (YTD earned
      revenue vs projection with variance pct, YTD attendance and tickets sold
      vs projection, 7-day direction). Sole input to the Cortex narrative —
      unit-test this, not the LLM output. ADR-004.
    config:
      materialized: view
    columns:
      - name: report_date
        data_tests:
          - not_null: { config: { severity: warn } }

  - name: rpt_tracker_narrative
    description: >
      DISABLED (enabled=false). Documents the AI_COMPLETE logic and is the source
      SQL for the daily task in scripts/setup_tracker_narrative.sql. Narrates
      only the pre-computed brief_json from rpt_tracker_narrative_brief.

  - name: rpt_wifi_email_export
    description: >
      RESTRICTED / PII. Governed marketing email extract of the WiFi
      captive-portal audience (one row per distinct email per capture date).
      Carries direct identifiers; masked by the on-run-end policy hook and
      excluded from the default marts grants — export happens via the governed
      egress path only (see docs/architecture/DATA_CLASSIFICATION.md).
      Columns: email_address, first_name, last_name, capture_date (the capture
      date completes the model's declared grain).
    columns:
      - name: email_address
        description: "PII. Visitor email address captured at the WiFi portal (masked)."
        data_tests:
          - not_null: { config: { severity: warn } }
      - name: first_name
        description: "PII. Visitor first name (masked; empty string when absent)."
      - name: last_name
        description: "PII. Visitor last name (masked; empty string when absent)."