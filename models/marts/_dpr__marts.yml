version: 2

models:
  - name: fct_daily_performance
    description: >
      Day-grain DPR fact. One additive measure per column; ratios excluded
      by design (computed in rpt_ layer). Replaces legacy fact_dpr_report_data.
    columns:
      - name: date_id
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: tickets_sold
        data_tests: [not_null]
      - name: ticket_revenue
        data_tests: [not_null]
      - name: mem_attendance
        description: >
          Memorial attendance (valid Gateway scans at memorial facilities).
          Scan component only; Sensource blend gated (see int_dpr__attendance).
        data_tests: [not_null]
      - name: mem_guided_tour_revenue
        description: Memorial guided tour revenue (%MGT% matrix, ga_flag = 0).
        data_tests: [not_null]

  - name: rpt_daily_performance_report
    description: >
      Power BI consumption layer for the Daily Performance Report. Today /
      MTD / YTD additive roll-ups plus non-additive ratios computed at this
      grain. Budget/variance columns gated on budget-source staging + ADR-005.
    columns:
      - name: date_id
        data_tests: [not_null, unique]
      - name: date_value
        data_tests: [not_null, unique]
      - name: avg_ticket_price
        description: Non-additive; total_admission_revenue / tickets_sold.
