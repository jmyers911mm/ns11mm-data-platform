version: 2

# ─────────────────────────────────────────────────────────────────────────────
# Pentaho migration reports, documented as dbt exposures.
# Native dbt fields: name, label, type, maturity, description, depends_on, owner, tags.
# Governance/registry fields live under meta: (valid dbt; read by the Hub Report Registry).
# meta.metrics reference certified metrics by ID (MET-###) from the semantic_models/ YAMLs.
# NOTE: each depends_on ref() must point to an ENABLED dbt model or `dbt parse` fails.
#       Reports are pinned to their live base fact; the full target model is in meta.target_model.
# ─────────────────────────────────────────────────────────────────────────────

exposures:
  - name: pentaho_daily_performance_report
    label: "Daily Performance Report (DPR)"
    type: dashboard
    maturity: low
    description: >
      Cross-domain executive daily performance: admissions revenue, donations, and attendance rolled to the business date. Co-owned by Finance and Revenue.
    depends_on: [ref('fct_daily_performance')]
    owner:
      name: "Mary Ng-Zuffante"
      email: mngzuffante@911memorial.org
    tags: [pentaho-migration, finance]
    meta:
      id: RPT-001
      slug: pentaho-daily-performance-report
      domain: "Finance"
      report_type: "Dashboard"
      platform: Power BI
      legacy_platform: Pentaho
      disposition: MIGRATE
      status: draft
      scope: "Migrated from the legacy Pentaho estate. Target model: rpt_daily_performance over fct_daily_operations + fct_revenue_bridge."
      audience: ["CFO", "Finance & Planning", "Revenue SVP"]
      technical_owner: Jeremy Myers
      approval_date: ""
      last_validated: ""
      refresh: "Daily · 08:00 ET"
      target_model: "rpt_daily_performance over fct_daily_operations + fct_revenue_bridge"
      source_models: [MARTS.FCT_DAILY_PERFORMANCE]
      metrics: [MET-002, MET-004, MET-047, MET-005, MET-006, MET-048]
      packages: ["Daily Performance Pack"]
      caveats:
