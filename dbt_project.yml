name: 'ns11mm_data_platform'
version: '7.11.0'
config-version: 2
profile: 'ns11mm_data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests/reconciliation", "tests/referential_integrity", "tests/business_rules"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  skip_circuit_breaker: false
  # Single shared source database (ADR-019): every environment — sandboxes,
  # shared dev, CI, and prod — reads RAW/SEEDS landed extracts from this one
  # database while ingestion is seed-based. gdpr_anonymize erases against the
  # same var so erasure always hits the data the models actually read.
  # Override per-run with --vars '{source_database: <db>}' only for testing.
  source_database: NS11MM_DW_DEV


on-run-end:
  - "{% if target.name != 'dev' %}{{ apply_governance_tags() }}{% endif %}"
  - "{% if target.name != 'dev' %}{{ apply_masking_policies() }}{% endif %}"

models:
  +persist_docs:
    relation: true
    columns: true
  +pre-hook:
    - "ALTER SESSION SET STATEMENT_TIMEOUT_IN_SECONDS = 3600"
    - "{% if 'intraday' in model.tags %}ALTER SESSION SET STATEMENT_TIMEOUT_IN_SECONDS = 300{% endif %}"
  ns11mm_data_platform:
    raw:
      +materialized: view
      +schema: STAGING
      +tags: ['daily', 'critical']
      +query_tag: 'dbt_ns11mm_staging'
      +group: staging
    intermediate:
      # Default view: every intermediate model is a view. The incremental_strategy
      # / on_schema_change / transient keys below are inert for views and apply
      # only if a specific model opts INTO materialized='incremental' (or 'table')
      # in its own config() — sensible silver-layer defaults, not the default itself.
      +materialized: view
      +schema: INTERMEDIATE
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      +tags: ['daily', 'critical']
      +query_tag: 'dbt_ns11mm_silver'
      +copy_grants: true
      +transient: true
      +group: silver
    marts:
      # Default table (matches every fact/dimension). incremental_strategy /
      # on_schema_change apply only when a model opts INTO materialized='incremental'
      # (e.g. fct_ticket_availability), so those two are opt-in defaults, not the
      # default materialization. Reports override to view in their sub-group below.
      +materialized: table
      +schema: MARTS
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      +tags: ['daily', 'critical']
      +query_tag: 'dbt_ns11mm_gold'
      +copy_grants: true
      # Read access via dbt's grants config (not post-hooks) so a model can
      # OVERRIDE the default with its own grants: — required for RESTRICTED /
      # PII models (rpt_wifi_email_export sets grants: {select: []}).
      # Model-level `grants:` replaces this list; use `+grants:` to extend it.
      +grants:
        select: ['POWERBI_ROLE', 'ML_ROLE']
      dimensions:
        +materialized: table
        +group: gold_dimensions
        +access: public
      facts:
        +group: gold_facts
        +access: public
      reports:
        +materialized: view
        +group: gold_reports
        +access: public
    ml_features:
      +materialized: table
      +schema: ML_FEATURES
      +tags: ['daily', 'non-critical']
      +query_tag: 'dbt_ns11mm_ml_features'
      +transient: true
      +group: ml_features
      +access: public
      +grants:
        select: ['ML_ROLE']

seeds:
  ns11mm_data_platform:
    +schema: SEEDS

snapshots:
  ns11mm_data_platform:
    +target_schema: INTERMEDIATE
    +tags: ['daily', 'non-critical']
    +query_tag: 'dbt_ns11mm_snapshots'