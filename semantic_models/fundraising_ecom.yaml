-- Fundraising / Ecommerce domain semantic model for Cortex Analyst
-- ---------------------------------------------------------------------------
-- Domain-grouped: online recurring revenue (donations + memberships).
--   * ecom_recurring -> RPT_WEBSITE_COMMERCE (STUB: Classy/Shopify feed pending)
-- Covers: Website Commerce Report.
--
-- STUB STATUS: this whole surface is stub-fed until the ecommerce pipeline
-- (Classy / Shopify recurring) lands (ADR-008). It is exposed now so the
-- conversational surface and onboarding questions exist, but every metric
-- returns zero/empty until data flows. Guardrails in module_custom_instructions
-- tell the agent to say so rather than present an empty result as "no revenue".
name: fundraising_ecom
description: >
  Online recurring revenue: website donations and memberships by month and
  year. Backs the Website Commerce Report. NOTE: sourced from the ecommerce
  pipeline (Classy / Shopify), which is not yet ingested -- figures are pending
  until that feed is connected.

tables:
  - name: ecom_recurring
    description: "Recurring online revenue by month, type and year. STUB until ecom pipeline lands."
    base_table:
      database: NS11MM_DW_DEV_JMYERS
      schema: MARTS
      table: RPT_WEBSITE_COMMERCE
    primary_key:
      columns: [MONTH_OF_YEAR, REVENUE_TYPE, REVENUE_YEAR]
    dimensions:
      - name: revenue_type
        synonyms: ["type", "revenue category"]
        description: Donation vs Membership recurring revenue.
        expr: REVENUE_TYPE
        data_type: VARCHAR
      - name: revenue_year
        synonyms: ["year"]
        expr: REVENUE_YEAR
        data_type: NUMBER
      - name: month_name
        synonyms: ["month"]
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: month_of_year
        synonyms: ["month number"]
        expr: MONTH_OF_YEAR
        data_type: NUMBER
    metrics:
      - name: total_amount
        synonyms: ["revenue", "amount", "online revenue", "recurring revenue"]
        description: Recurring online revenue (STUB - pending the ecom feed; zero until wired).
        expr: SUM(AMOUNT)

        meta:
          display_name: Total Recurring Online Revenue
          id: MET-057
          type: Measure — Sum
          domain: Fundraising
          status: in-review
          grain: Daily
          sla_tier: Tier 2
          version: '1.0'
          business_owner: Jan-Michael Llanes
          technical_owner: Jeremy Myers
          approval_date: ''
          time_dimension: report_date
          scope: Recurring online (website) commerce revenue recognized on order date.
          source_models: [MARTS.RPT_WEBSITE_COMMERCE]
          related_metrics: []
          caveats:
            - STUB — pending the Classy / Shopify recurring ecommerce pipeline (ADR-008).
          changelog:
            - {version: '1.0', date: '2026-07-16', note: Metadata authored from platform knowledge; submitted for review.}
verified_queries:
  - name: recurring_by_type_year
    question: What was recurring online donation revenue by year?
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.FUNDRAISING_ECOM
          DIMENSIONS ecom_recurring.revenue_year, ecom_recurring.revenue_type
          METRICS ecom_recurring.total_amount
      )
      WHERE revenue_type = 'Donation'
      ORDER BY revenue_year

module_custom_instructions:
  sql_generation: |
    Round currency to 2 decimals. This domain is stub-fed: the ecommerce
    pipeline (Classy / Shopify recurring) is not yet ingested.
  question_categorization: |-
    IMPORTANT: if a query returns empty or zero, do NOT report it as "no
    revenue" or "zero donations". Explain that the Website Commerce / ecommerce
    feed is not yet connected, so figures are pending rather than actually zero.