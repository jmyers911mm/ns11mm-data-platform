-- DPR semantic model YAML for Cortex Analyst REST API and semantic view generation
-- Co-authored with CoCo
name: dpr
description: >
  Daily Performance Report semantic model over the DPR marts.
  Additive KPIs are SUM metrics so Cortex Analyst can roll up to any period;
  the two ratios are ratio-of-sums metrics (non-additive, recomputed at the
  query grain). Built on FCT_DAILY_PERFORMANCE (additive day-grain fact) joined
  to DIM_DATE. Budget/variance, full Sensource attendance, ecommerce gross
  profit, and membership are out of current scope (see custom instructions).

tables:
  - name: daily_performance
    description: One row per calendar day of DPR additive measures.
    synonyms:
      - daily performance
      - DPR fact
      - daily numbers
    base_table:
      database: NS11MM_DW_DEV_JMYERS
      schema: MARTS
      table: FCT_DAILY_PERFORMANCE
    primary_key:
      columns:
        - DATE_ID
    dimensions:
      - name: is_commemoration_day
        synonyms:
          - commemoration
          - anniversary window
          - 9/11 period
        description: TRUE for September 11, the commemoration day treated as a known structural exception.
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN
        is_enum: true
        sample_values:
          - "TRUE"
          - "FALSE"
    metrics:
      # ---------- Admissions (additive) ----------
      - name: total_tickets_sold
        synonyms: ["tickets sold", "admissions sold", "ticket count"]
        description: General-admission tickets sold.
        expr: SUM(TICKETS_SOLD)
      - name: total_ticket_revenue
        synonyms: ["ticket revenue", "admission revenue"]
        description: General-admission ticket revenue.
        expr: SUM(TICKET_REVENUE)
      - name: total_pass_revenue
        synonyms: ["pass revenue", "CityPASS revenue", "C3 revenue"]
        description: CityPASS / C3 pass revenue.
        expr: SUM(PASS_REVENUE)
      - name: total_admission_revenue
        synonyms: ["total admission revenue"]
        description: Ticket revenue plus pass revenue.
        expr: SUM(TICKET_REVENUE) + SUM(PASS_REVENUE)
      - name: total_museum_attendance
        synonyms: ["attendance", "museum attendance", "visitors"]
        description: Museum attendance (scanned general-admission component; see notes for Sensource blend).
        expr: SUM(MUS_ATTENDANCE)
      # ---------- Tours & fees (additive) ----------
      - name: total_mus_guided_tour_revenue
        synonyms: ["museum guided tour revenue", "guided tour revenue"]
        description: Museum guided tour revenue.
        expr: SUM(MUS_GUIDED_TOUR_REVENUE)
      - name: total_mem_mus_tour_revenue
        synonyms: ["memorial and museum tour revenue", "combined tour revenue"]
        description: Memorial + Museum combined tour revenue.
        expr: SUM(MEM_MUS_TOUR_REVENUE)
      - name: total_virtual_tour_revenue
        synonyms: ["virtual tour revenue", "online tour revenue"]
        description: All virtual tour revenue (memorial, museum, youth & family).
        expr: SUM(VIRTUAL_MEM_TOUR_REVENUE) + SUM(VIRTUAL_MUS_TOUR_REVENUE) + SUM(VIRTUAL_YF_MEM_TOUR_REVENUE)
      - name: total_field_trip_revenue
        synonyms: ["field trip revenue", "school trip revenue"]
        description: Memorial + Museum field trip revenue.
        expr: SUM(MEM_FIELD_TRIP_REVENUE) + SUM(MUS_FIELD_TRIP_REVENUE)
      - name: total_service_fees
        synonyms: ["service fees", "fees"]
        description: Museum + Memorial service fees.
        expr: SUM(SERVICE_FEES)
      - name: total_audio_revenue
        synonyms: ["audio guide revenue", "headset revenue"]
        description: Museum audio/headset plus memorial audio guide revenue.
        expr: SUM(AUDIO_TOUR_HEADSET) + SUM(MEM_AUDIO_GUIDE_REVENUE)
      # ---------- Retail (additive) ----------
      - name: total_mus_store_gross_profit
        synonyms: ["museum store profit", "store gross profit"]
        description: Museum Store gross profit (sales minus cost).
        expr: SUM(MUS_STORE_GROSS_PROFIT)
      - name: total_retail_carts_gross_profit
        synonyms: ["memorial cart profit", "cart gross profit"]
        description: Memorial Carts gross profit.
        expr: SUM(RETAIL_CARTS_GROSS_PROFIT)
      - name: total_cafe_profit
        synonyms: ["cafe profit"]
        description: Cafe gross profit.
        expr: SUM(CAFE1_ALL_PROFIT)
      - name: total_retail_gross_profit
        synonyms: ["total retail profit", "retail gross profit"]
        description: Museum Store + Memorial Carts + Cafe gross profit.
        expr: SUM(MUS_STORE_GROSS_PROFIT) + SUM(RETAIL_CARTS_GROSS_PROFIT) + SUM(CAFE1_ALL_PROFIT)
      # ---------- Donations (additive) ----------
      - name: total_ticketing_donations
        synonyms: ["ticketing donations"]
        description: Gateway ticketing donations (excludes box/exit categories).
        expr: SUM(TICKETING_DONATIONS)
      - name: total_donations
        synonyms: ["total donations", "all donations", "donation revenue"]
        description: Sum of every DPR donation line.
        expr: >
          SUM(TICKETING_DONATIONS) + SUM(BOX_OFFICE_MEM_DON) +
          SUM(BOX_OFFICE_MUS_EXIT_DON) + SUM(COATCHECK_DON) +
          SUM(MASK_DONATIONS) + SUM(DONATION_BOX) +
          SUM(MUS_STORE_DONATIONS) + SUM(MUS_EXIT_DONATIONS) +
          SUM(CART_DONATION_ASK) + SUM(ECOM_DONATION_ASK) +
          SUM(CAFE1_DONATIONS)
      # ---------- Non-additive ratios (ratio-of-sums) ----------
      - name: avg_ticket_price
        synonyms: ["average ticket price", "avg admission price"]
        description: >
          Non-additive: total admission revenue divided by tickets sold,
          recomputed at the query grain (never averaged across days).
        expr: (SUM(TICKET_REVENUE) + SUM(PASS_REVENUE)) / NULLIF(SUM(TICKETS_SOLD), 0)
      - name: mus_store_rev_per_visitor
        synonyms: ["museum store revenue per visitor", "store per cap", "per capita store profit"]
        description: >
          Non-additive: Museum Store gross profit per museum visitor,
          recomputed at the query grain.
        expr: SUM(MUS_STORE_GROSS_PROFIT) / NULLIF(SUM(MUS_ATTENDANCE), 0)

  - name: date
    description: Calendar date dimension with the September 11 commemoration flag.
    synonyms:
      - calendar
      - date dimension
    base_table:
      database: NS11MM_DW_DEV_JMYERS
      schema: MARTS
      table: DIM_DATE
    primary_key:
      columns:
        - DATE_ID
    time_dimensions:
      - name: report_date
        synonyms: ["date", "day", "business date"]
        description: Calendar date the numbers are recognized on.
        expr: DATE_DAY
        data_type: DATE
    dimensions:
      - name: calendar_year
        synonyms: ["year", "fiscal year"]
        description: Calendar year.
        expr: YEAR_NUMBER
        data_type: NUMBER
      - name: calendar_quarter
        synonyms: ["quarter", "qtr"]
        description: Calendar quarter (1-4).
        expr: QUARTER_OF_YEAR
        data_type: NUMBER
      - name: calendar_month
        synonyms: ["month number"]
        description: Calendar month number (1-12).
        expr: MONTH_OF_YEAR
        data_type: NUMBER
      - name: month_name
        synonyms: ["month"]
        description: Abbreviated month name.
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: day_name
        synonyms: ["weekday", "day of week"]
        description: Abbreviated day-of-week name.
        expr: DAY_OF_WEEK_NAME
        data_type: VARCHAR
      - name: is_weekend
        synonyms: ["weekend flag"]
        description: TRUE on Saturday and Sunday.
        expr: IS_WEEKEND
        data_type: BOOLEAN

relationships:
  - name: dpr_to_date
    left_table: daily_performance
    right_table: date
    relationship_columns:
      - left_column: DATE_ID
        right_column: DATE_ID

verified_queries:
  - name: ticket_revenue_by_month_2026
    question: What was ticket revenue by month in 2026?
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.DPR
          DIMENSIONS date.calendar_year, date.calendar_month, date.month_name
          METRICS daily_performance.total_ticket_revenue
      )
      WHERE calendar_year = 2026
      ORDER BY calendar_month

  - name: avg_ticket_price_last_quarter
    question: What is the average ticket price this quarter?
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.DPR
          DIMENSIONS date.calendar_year, date.calendar_quarter
          METRICS daily_performance.avg_ticket_price
      )
      WHERE calendar_year = YEAR(CURRENT_DATE)
        AND calendar_quarter = QUARTER(CURRENT_DATE)

  - name: total_donations_excluding_commemoration
    question: How much did we raise in donations this year outside the commemoration window?
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.DPR
          DIMENSIONS date.calendar_year
          METRICS daily_performance.total_donations
      )
      WHERE calendar_year = YEAR(CURRENT_DATE)
        AND is_commemoration_day = FALSE

  - name: store_per_visitor_by_month
    question: What was museum store revenue per visitor each month this year?
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.DPR
          DIMENSIONS date.calendar_year, date.calendar_month, date.month_name
          METRICS daily_performance.mus_store_rev_per_visitor
      )
      WHERE calendar_year = YEAR(CURRENT_DATE)
      ORDER BY calendar_month

  - name: retail_profit_ytd
    question: What is total retail gross profit year to date?
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.DPR
          DIMENSIONS date.calendar_year
          METRICS daily_performance.total_retail_gross_profit
      )
      WHERE calendar_year = YEAR(CURRENT_DATE)

module_custom_instructions:
  sql_generation: |
    Round all currency metrics to 2 decimal points and attendance/ticket counts
    to whole numbers. When a question does not specify a period, default to the
    most recent complete day available. When comparing two periods, note if either
    overlaps the September 6-16 commemoration window, since that window is a
    known structural exception.
  question_categorization: |
    If a question asks for budget, forecast, or variance figures, treat it as
    out of scope: explain that budget/variance is not yet in this model (pending
    budget-source staging) and offer the actuals instead.
    If a question asks for membership revenue, ecommerce gross profit, or full
    Sensource-based attendance, note those sources are out of current scope.
    If a revenue question is ambiguous about which revenue stream, ask the user
    to specify (tickets, tours, retail, donations, fees, or audio).
