name: ns11mm_marketing_sales
description: "NS11MM Marketing & Sales — connects marketing spend and attribution to actual ticket and retail revenue for ROI analysis"

tables:
  - name: marketing_sales_daily
    description: "Daily marketing metrics joined with sales revenue for spend-to-revenue analysis"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_MARKETING_SALES_DAILY
    dimensions:
      - name: channel
        synonyms: ["marketing channel"]
        description: "Marketing channel name"
        expr: CHANNEL
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Paid Search", "Paid Social", "Email", "Organic Search", "Direct"]
      - name: is_paid
        description: "Whether the channel involves paid media"
        expr: IS_PAID
        data_type: BOOLEAN
      - name: fiscal_year
        synonyms: ["FY"]
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: month_name
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: day_name
        expr: DAY_NAME
        data_type: VARCHAR
      - name: is_weekend
        expr: IS_WEEKEND
        data_type: BOOLEAN
    time_dimensions:
      - name: report_date
        synonyms: ["date", "day"]
        description: "Date of the combined marketing + sales metrics"
        expr: REPORT_DATE
        data_type: DATE
    facts:
      - name: impressions
        description: "Marketing impressions"
        expr: IMPRESSIONS
        data_type: NUMBER
      - name: clicks
        description: "Marketing clicks"
        expr: CLICKS
        data_type: NUMBER
      - name: spend
        synonyms: ["marketing spend", "ad spend"]
        description: "Marketing spend"
        expr: SPEND
        data_type: NUMBER
      - name: conversions
        synonyms: ["marketing conversions"]
        description: "Attributed marketing conversions"
        expr: CONVERSIONS
        data_type: NUMBER
      - name: ticket_transactions
        description: "Number of ticket sale transactions"
        expr: TICKET_TRANSACTIONS
        data_type: NUMBER
      - name: tickets_sold
        description: "Total tickets sold"
        expr: TICKETS_SOLD
        data_type: NUMBER
      - name: ticket_revenue
        synonyms: ["admission revenue"]
        description: "Total ticket revenue"
        expr: TICKET_REVENUE
        data_type: NUMBER
      - name: ticket_discounts
        description: "Ticket discount amount"
        expr: TICKET_DISCOUNTS
        data_type: NUMBER
      - name: retail_transactions
        description: "Number of retail transactions"
        expr: RETAIL_TRANSACTIONS
        data_type: NUMBER
      - name: retail_revenue
        synonyms: ["gift shop revenue"]
        description: "Total retail/gift shop revenue"
        expr: RETAIL_REVENUE
        data_type: NUMBER
      - name: retail_discounts
        description: "Retail discount amount"
        expr: RETAIL_DISCOUNTS
        data_type: NUMBER
      - name: total_sales_revenue
        synonyms: ["total revenue", "combined revenue"]
        description: "Total ticket + retail revenue"
        expr: TOTAL_SALES_REVENUE
        data_type: NUMBER
      - name: revenue_to_spend_ratio
        synonyms: ["ROAS", "return on ad spend", "ROI"]
        description: "Revenue divided by marketing spend"
        expr: REVENUE_TO_SPEND_RATIO
        data_type: FLOAT
    metrics:
      - name: total_marketing_spend
        synonyms: ["total spend"]
        description: "Total marketing spend"
        expr: SUM(SPEND)
      - name: total_ticket_revenue
        description: "Total ticket revenue"
        expr: SUM(TICKET_REVENUE)
      - name: total_retail_revenue
        description: "Total retail revenue"
        expr: SUM(RETAIL_REVENUE)
      - name: total_combined_revenue
        synonyms: ["total revenue"]
        description: "Total ticket + retail revenue"
        expr: SUM(TOTAL_SALES_REVENUE)
      - name: blended_roas
        synonyms: ["overall ROAS", "return on investment"]
        description: "Blended return on ad spend across all channels"
        expr: SUM(TOTAL_SALES_REVENUE) / NULLIF(SUM(SPEND), 0)
      - name: paid_channel_roas
        description: "ROAS for paid channels only"
        expr: SUM(CASE WHEN IS_PAID THEN TOTAL_SALES_REVENUE ELSE 0 END) / NULLIF(SUM(CASE WHEN IS_PAID THEN SPEND ELSE 0 END), 0)
      - name: net_ticket_revenue
        description: "Ticket revenue minus discounts"
        expr: SUM(TICKET_REVENUE) - SUM(TICKET_DISCOUNTS)
      - name: cost_per_ticket_sold
        description: "Marketing cost per ticket sold"
        expr: SUM(SPEND) / NULLIF(SUM(TICKETS_SOLD), 0)

  - name: campaign_attribution
    description: "Multi-channel attribution connecting web sessions to actual ticket and retail purchases"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_CAMPAIGN_ATTRIBUTION
    dimensions:
      - name: channel_grouping
        synonyms: ["channel"]
        description: "Attributed marketing channel"
        expr: CHANNEL_GROUPING
        data_type: VARCHAR
      - name: source
        description: "Traffic source"
        expr: SOURCE
        data_type: VARCHAR
      - name: medium
        description: "Traffic medium"
        expr: MEDIUM
        data_type: VARCHAR
      - name: customer_segment
        synonyms: ["segment"]
        description: "Customer segment of the attributed buyer"
        expr: CUSTOMER_SEGMENT
        data_type: VARCHAR
      - name: membership_type
        description: "Membership type of the attributed buyer"
        expr: MEMBERSHIP_TYPE
        data_type: VARCHAR
      - name: fiscal_year
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: month_name
        expr: MONTH_NAME
        data_type: VARCHAR
    time_dimensions:
      - name: report_date
        synonyms: ["date", "attribution date"]
        description: "Date of the attributed transaction"
        expr: REPORT_DATE
        data_type: DATE
    facts:
      - name: attributed_ticket_transactions
        description: "Ticket transactions attributed to this channel"
        expr: ATTRIBUTED_TICKET_TRANSACTIONS
        data_type: NUMBER
      - name: attributed_tickets_sold
        description: "Tickets sold attributed to this channel"
        expr: ATTRIBUTED_TICKETS_SOLD
        data_type: NUMBER
      - name: attributed_ticket_revenue
        synonyms: ["attributed admission revenue"]
        description: "Ticket revenue attributed to this channel"
        expr: ATTRIBUTED_TICKET_REVENUE
        data_type: NUMBER
      - name: attributed_retail_transactions
        description: "Retail transactions attributed to this channel"
        expr: ATTRIBUTED_RETAIL_TRANSACTIONS
        data_type: NUMBER
      - name: attributed_retail_revenue
        description: "Retail revenue attributed to this channel"
        expr: ATTRIBUTED_RETAIL_REVENUE
        data_type: NUMBER
      - name: total_attributed_revenue
        synonyms: ["attributed revenue"]
        description: "Total revenue attributed to this channel"
        expr: TOTAL_ATTRIBUTED_REVENUE
        data_type: NUMBER
    metrics:
      - name: total_attributed_ticket_revenue
        description: "Total ticket revenue attributed across all channels"
        expr: SUM(ATTRIBUTED_TICKET_REVENUE)
      - name: total_attributed_retail_revenue
        description: "Total retail revenue attributed across all channels"
        expr: SUM(ATTRIBUTED_RETAIL_REVENUE)
      - name: total_all_attributed_revenue
        synonyms: ["total attributed revenue"]
        description: "Total attributed revenue across all channels"
        expr: SUM(TOTAL_ATTRIBUTED_REVENUE)
      - name: attribution_rate
        description: "Percentage of revenue that can be attributed to a marketing channel"
        expr: SUM(TOTAL_ATTRIBUTED_REVENUE) / NULLIF(SUM(ATTRIBUTED_TICKET_REVENUE + ATTRIBUTED_RETAIL_REVENUE), 0) * 100

  - name: dates
    description: "Date dimension"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: DIM_DATE
    dimensions:
      - name: date_id
        expr: DATE_ID
        data_type: DATE
        unique: true
      - name: fiscal_year
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: month_name
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: is_weekend
        expr: IS_WEEKEND
        data_type: BOOLEAN
      - name: is_commemoration_day
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN

relationships:
  - name: marketing_sales_to_dates
    left_table: marketing_sales_daily
    right_table: dates
    relationship_columns:
      - left_column: REPORT_DATE
        right_column: DATE_ID
  - name: attribution_to_dates
    left_table: campaign_attribution
    right_table: dates
    relationship_columns:
      - left_column: REPORT_DATE
        right_column: DATE_ID

verified_queries:
  - name: roas_by_channel
    question: "What is the ROAS by marketing channel?"
    use_as_onboarding_question: true
    sql: |
      SELECT channel,
             SUM(spend) as total_spend,
             SUM(total_sales_revenue) as total_revenue,
             CASE WHEN SUM(spend) > 0 THEN SUM(total_sales_revenue) / SUM(spend) ELSE NULL END as roas
      FROM NS11MM_DW_DEV.MARTS.FCT_MARKETING_SALES_DAILY
      WHERE is_paid = true
      GROUP BY channel
      ORDER BY roas DESC
  - name: attributed_revenue_by_channel
    question: "How much revenue is attributed to each marketing channel?"
    use_as_onboarding_question: true
    sql: |
      SELECT channel_grouping,
             SUM(attributed_ticket_revenue) as ticket_revenue,
             SUM(attributed_retail_revenue) as retail_revenue,
             SUM(total_attributed_revenue) as total_revenue
      FROM NS11MM_DW_DEV.MARTS.FCT_CAMPAIGN_ATTRIBUTION
      GROUP BY channel_grouping
      ORDER BY total_revenue DESC
  - name: monthly_spend_vs_revenue
    question: "What is the monthly marketing spend vs revenue trend?"
    use_as_onboarding_question: true
    sql: |
      SELECT DATE_TRUNC('month', report_date) as month,
             SUM(spend) as total_spend,
             SUM(total_sales_revenue) as total_revenue,
             SUM(tickets_sold) as tickets_sold,
             CASE WHEN SUM(spend) > 0 THEN SUM(total_sales_revenue) / SUM(spend) ELSE NULL END as roas
      FROM NS11MM_DW_DEV.MARTS.FCT_MARKETING_SALES_DAILY
      GROUP BY 1
      ORDER BY 1

custom_instructions: |
  The NS11MM fiscal year runs October through September.
  September 11 is the commemoration anniversary — exclude from revenue/ROAS trends unless asked.
  "ROAS" means Return on Ad Spend = revenue / spend.
  When asked about "attribution", use campaign_attribution table for channel-level attribution.
  When asked about "cost per ticket", divide marketing spend by tickets sold.
  "Blended ROAS" includes all channels; "Paid ROAS" is paid channels only.
  Total revenue = ticket_revenue + retail_revenue (does not include donations).
