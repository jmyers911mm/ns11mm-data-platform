name: ns11mm_marketing_performance
description: "NS11MM Marketing Performance — paid advertising, email campaigns, website traffic, conversion funnels, and cross-channel attribution"

tables:
  - name: digital_ad_performance
    description: "Daily Google Ads and Meta Ads campaign performance metrics"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_DIGITAL_AD_PERFORMANCE
    dimensions:
      - name: ad_platform
        synonyms: ["platform", "ad network", "channel"]
        description: "Advertising platform: Google Ads or Meta Ads"
        expr: AD_PLATFORM
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Google Ads", "Meta Ads"]
      - name: campaign_id
        description: "Platform-specific campaign identifier"
        expr: CAMPAIGN_ID
        data_type: VARCHAR
      - name: campaign_name
        synonyms: ["campaign"]
        description: "Campaign name"
        expr: CAMPAIGN_NAME
        data_type: VARCHAR
      - name: campaign_status
        description: "Campaign status (Google Ads only)"
        expr: CAMPAIGN_STATUS
        data_type: VARCHAR
      - name: campaign_category
        synonyms: ["campaign type", "objective"]
        description: "Campaign category/objective"
        expr: CAMPAIGN_CATEGORY
        data_type: VARCHAR
    time_dimensions:
      - name: report_date
        synonyms: ["date", "ad date"]
        description: "Date of the ad performance metrics"
        expr: REPORT_DATE
        data_type: DATE
    facts:
      - name: impressions
        description: "Number of times ad was shown"
        expr: IMPRESSIONS
        data_type: NUMBER
      - name: reach
        description: "Unique users who saw the ad (Meta only)"
        expr: REACH
        data_type: NUMBER
      - name: clicks
        description: "Number of ad clicks"
        expr: CLICKS
        data_type: NUMBER
      - name: spend
        synonyms: ["cost", "ad spend", "budget spent"]
        description: "Amount spent on the campaign"
        expr: SPEND
        data_type: NUMBER
      - name: conversions
        description: "Number of conversion events attributed"
        expr: CONVERSIONS
        data_type: NUMBER
      - name: ctr
        synonyms: ["click through rate", "click-through rate"]
        description: "Click-through rate"
        expr: CTR
        data_type: FLOAT
      - name: avg_cpc
        synonyms: ["CPC", "cost per click"]
        description: "Average cost per click"
        expr: AVG_CPC
        data_type: NUMBER
      - name: cost_per_conversion
        synonyms: ["CPA", "cost per acquisition"]
        description: "Cost per conversion (Google Ads only)"
        expr: COST_PER_CONVERSION
        data_type: NUMBER
      - name: roas
        synonyms: ["return on ad spend"]
        description: "Return on ad spend"
        expr: ROAS
        data_type: FLOAT
    metrics:
      - name: total_ad_spend
        synonyms: ["total spend", "advertising spend", "media spend"]
        description: "Total advertising spend across all platforms"
        expr: SUM(SPEND)
      - name: total_impressions
        description: "Total ad impressions"
        expr: SUM(IMPRESSIONS)
      - name: total_clicks
        description: "Total ad clicks"
        expr: SUM(CLICKS)
      - name: total_conversions
        description: "Total attributed conversions"
        expr: SUM(CONVERSIONS)
      - name: overall_ctr
        synonyms: ["average CTR"]
        description: "Overall click-through rate"
        expr: SUM(CLICKS)::FLOAT / NULLIF(SUM(IMPRESSIONS), 0)
      - name: overall_cpc
        synonyms: ["average CPC"]
        description: "Overall cost per click"
        expr: SUM(SPEND) / NULLIF(SUM(CLICKS), 0)
      - name: overall_cpa
        synonyms: ["average CPA"]
        description: "Overall cost per acquisition/conversion"
        expr: SUM(SPEND) / NULLIF(SUM(CONVERSIONS), 0)
      - name: google_ads_spend
        description: "Total Google Ads spend"
        expr: SUM(CASE WHEN AD_PLATFORM = 'Google Ads' THEN SPEND ELSE 0 END)
      - name: meta_ads_spend
        description: "Total Meta Ads spend"
        expr: SUM(CASE WHEN AD_PLATFORM = 'Meta Ads' THEN SPEND ELSE 0 END)

  - name: email_campaigns
    description: "Marketing Cloud email campaign performance with open/click/bounce rates"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_CAMPAIGN_PERFORMANCE
    dimensions:
      - name: campaign_id
        description: "Marketing Cloud campaign/job identifier"
        expr: CAMPAIGN_ID
        data_type: VARCHAR
      - name: campaign_name
        synonyms: ["email campaign", "email name"]
        description: "Campaign name from Marketing Cloud"
        expr: CAMPAIGN_NAME
        data_type: VARCHAR
    time_dimensions:
      - name: first_send_date
        description: "Date campaign was first sent"
        expr: FIRST_SEND_DATE
        data_type: DATE
      - name: last_event_date
        description: "Date of most recent engagement event"
        expr: LAST_EVENT_DATE
        data_type: DATE
    facts:
      - name: total_sent
        synonyms: ["emails sent", "sends"]
        description: "Total emails sent"
        expr: TOTAL_SENT
        data_type: NUMBER
      - name: total_opens
        synonyms: ["opens"]
        description: "Total email opens"
        expr: TOTAL_OPENS
        data_type: NUMBER
      - name: total_clicks
        synonyms: ["email clicks"]
        description: "Total email link clicks"
        expr: TOTAL_CLICKS
        data_type: NUMBER
      - name: total_bounces
        synonyms: ["bounces"]
        description: "Total bounced emails"
        expr: TOTAL_BOUNCES
        data_type: NUMBER
      - name: total_unsubscribes
        synonyms: ["unsubscribes"]
        description: "Total unsubscribe events"
        expr: TOTAL_UNSUBSCRIBES
        data_type: NUMBER
      - name: unique_recipients
        description: "Unique subscriber keys"
        expr: UNIQUE_RECIPIENTS
        data_type: NUMBER
      - name: open_rate_pct
        synonyms: ["open rate"]
        description: "Open rate percentage"
        expr: OPEN_RATE_PCT
        data_type: FLOAT
      - name: click_to_open_rate_pct
        synonyms: ["CTOR", "click to open rate"]
        description: "Click-to-open rate percentage"
        expr: CLICK_TO_OPEN_RATE_PCT
        data_type: FLOAT
      - name: bounce_rate_pct
        synonyms: ["bounce rate"]
        description: "Bounce rate percentage"
        expr: BOUNCE_RATE_PCT
        data_type: FLOAT
      - name: unsubscribe_rate_pct
        synonyms: ["unsub rate"]
        description: "Unsubscribe rate percentage"
        expr: UNSUBSCRIBE_RATE_PCT
        data_type: FLOAT
    metrics:
      - name: total_emails_sent
        description: "Sum of all emails sent across campaigns"
        expr: SUM(TOTAL_SENT)
      - name: avg_open_rate
        synonyms: ["average open rate"]
        description: "Average open rate across campaigns"
        expr: AVG(OPEN_RATE_PCT)
      - name: avg_click_to_open_rate
        synonyms: ["average CTOR"]
        description: "Average click-to-open rate"
        expr: AVG(CLICK_TO_OPEN_RATE_PCT)
      - name: campaign_count
        description: "Number of email campaigns"
        expr: COUNT(DISTINCT CAMPAIGN_ID)

  - name: website_traffic
    description: "GA4 website traffic by channel, source/medium, and page category"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_WEBSITE_TRAFFIC
    dimensions:
      - name: channel_grouping
        synonyms: ["channel", "traffic source"]
        description: "Marketing channel: Paid Search, Organic Search, Direct, Email, Paid Social, Other"
        expr: CHANNEL_GROUPING
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Paid Search", "Paid Social", "Organic Search", "Email", "Direct", "Other"]
      - name: source
        synonyms: ["traffic source name"]
        description: "Traffic source (e.g., google, facebook)"
        expr: SOURCE
        data_type: VARCHAR
      - name: medium
        synonyms: ["traffic medium"]
        description: "Traffic medium (e.g., cpc, organic, email)"
        expr: MEDIUM
        data_type: VARCHAR
      - name: campaign
        description: "UTM campaign name"
        expr: CAMPAIGN
        data_type: VARCHAR
      - name: page_category
        synonyms: ["content category", "section"]
        description: "Page content category: Tickets, Membership, Retail, Exhibitions, Donations, General"
        expr: PAGE_CATEGORY
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Tickets", "Membership", "Retail", "Exhibitions", "Donations", "General"]
      - name: device_category
        synonyms: ["device", "device type"]
        description: "Device type: desktop, mobile, tablet"
        expr: DEVICE_CATEGORY
        data_type: VARCHAR
        is_enum: true
        sample_values: ["desktop", "mobile", "tablet"]
      - name: country
        description: "Visitor country"
        expr: COUNTRY
        data_type: VARCHAR
    time_dimensions:
      - name: report_date
        synonyms: ["date", "session date"]
        description: "Date of the web traffic"
        expr: REPORT_DATE
        data_type: DATE
    facts:
      - name: sessions
        synonyms: ["visits", "traffic"]
        description: "Number of sessions"
        expr: SESSIONS
        data_type: NUMBER
      - name: new_users
        synonyms: ["new visitors"]
        description: "Number of new users"
        expr: NEW_USERS
        data_type: NUMBER
      - name: active_users
        description: "Active users"
        expr: ACTIVE_USERS
        data_type: NUMBER
      - name: page_views
        synonyms: ["pageviews"]
        description: "Total page views"
        expr: PAGE_VIEWS
        data_type: NUMBER
      - name: engaged_sessions
        description: "Sessions with meaningful engagement"
        expr: ENGAGED_SESSIONS
        data_type: NUMBER
      - name: conversions
        description: "Conversion events"
        expr: CONVERSIONS
        data_type: NUMBER
      - name: avg_session_duration_seconds
        synonyms: ["session duration", "time on site"]
        description: "Average session duration in seconds"
        expr: AVG_SESSION_DURATION_SECONDS
        data_type: FLOAT
      - name: avg_engagement_rate
        synonyms: ["engagement rate"]
        description: "Average engagement rate"
        expr: AVG_ENGAGEMENT_RATE
        data_type: FLOAT
      - name: avg_bounce_rate
        synonyms: ["bounce rate"]
        description: "Average bounce rate"
        expr: AVG_BOUNCE_RATE
        data_type: FLOAT
      - name: conversion_rate_pct
        synonyms: ["conversion rate"]
        description: "Session-to-conversion rate percentage"
        expr: CONVERSION_RATE_PCT
        data_type: FLOAT
    metrics:
      - name: total_sessions
        synonyms: ["total traffic", "total visits"]
        description: "Total website sessions"
        expr: SUM(SESSIONS)
      - name: total_page_views
        description: "Total page views"
        expr: SUM(PAGE_VIEWS)
      - name: total_conversions
        description: "Total website conversions"
        expr: SUM(CONVERSIONS)
      - name: total_new_users
        description: "Total new users"
        expr: SUM(NEW_USERS)
      - name: overall_conversion_rate
        description: "Overall conversion rate"
        expr: SUM(CONVERSIONS)::FLOAT / NULLIF(SUM(SESSIONS), 0) * 100
      - name: pages_per_session
        description: "Average page views per session"
        expr: SUM(PAGE_VIEWS)::FLOAT / NULLIF(SUM(SESSIONS), 0)

  - name: website_funnel
    description: "Website conversion funnel from landing to purchase by channel and device"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_WEBSITE_FUNNEL
    dimensions:
      - name: channel_grouping
        expr: CHANNEL_GROUPING
        data_type: VARCHAR
      - name: device_category
        expr: DEVICE_CATEGORY
        data_type: VARCHAR
    time_dimensions:
      - name: report_date
        expr: REPORT_DATE
        data_type: DATE
    facts:
      - name: total_visitors
        description: "Total unique visitors entering funnel"
        expr: TOTAL_VISITORS
        data_type: NUMBER
      - name: stage_tickets_viewed
        description: "Visitors who viewed tickets page"
        expr: STAGE_TICKETS_VIEWED
        data_type: NUMBER
      - name: stage_converted
        description: "Visitors who completed a conversion"
        expr: STAGE_CONVERTED
        data_type: NUMBER
      - name: tickets_view_rate_pct
        description: "Rate of visitors viewing tickets"
        expr: TICKETS_VIEW_RATE_PCT
        data_type: FLOAT
      - name: overall_conversion_rate_pct
        description: "Overall funnel conversion rate"
        expr: OVERALL_CONVERSION_RATE_PCT
        data_type: FLOAT
    metrics:
      - name: funnel_conversion_rate
        description: "Overall website funnel conversion rate"
        expr: SUM(STAGE_CONVERTED)::FLOAT / NULLIF(SUM(TOTAL_VISITORS), 0) * 100

  - name: channel_summary
    description: "Cross-channel daily marketing performance rollup"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_MARKETING_CHANNEL_SUMMARY
    dimensions:
      - name: channel
        synonyms: ["marketing channel"]
        description: "Marketing channel name"
        expr: CHANNEL
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Paid Search", "Paid Social", "Email", "Organic Search", "Direct"]
      - name: is_paid
        description: "Whether the channel is paid"
        expr: IS_PAID
        data_type: BOOLEAN
      - name: fiscal_year
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: month_name
        expr: MONTH_NAME
        data_type: VARCHAR
    time_dimensions:
      - name: report_date
        expr: REPORT_DATE
        data_type: DATE
    facts:
      - name: impressions
        expr: IMPRESSIONS
        data_type: NUMBER
      - name: clicks
        expr: CLICKS
        data_type: NUMBER
      - name: spend
        expr: SPEND
        data_type: NUMBER
      - name: conversions
        expr: CONVERSIONS
        data_type: NUMBER
      - name: ctr
        expr: CTR
        data_type: FLOAT
      - name: cpc
        expr: CPC
        data_type: NUMBER
      - name: cpa
        expr: CPA
        data_type: NUMBER
    metrics:
      - name: total_channel_spend
        description: "Total spend across all channels"
        expr: SUM(SPEND)
      - name: paid_channel_spend
        description: "Spend on paid channels only"
        expr: SUM(CASE WHEN IS_PAID THEN SPEND ELSE 0 END)

  - name: dates
    description: "Date dimension with fiscal calendar"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: DIM_DATE
    dimensions:
      - name: date_id
        expr: DATE_ID
        data_type: DATE
        unique: true
      - name: day_of_week_name
        synonyms: ["day name"]
        expr: DAY_OF_WEEK_NAME
        data_type: VARCHAR
      - name: month_name
        expr: MONTH_NAME
        data_type: VARCHAR
      - name: fiscal_year
        synonyms: ["FY"]
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: is_weekend
        expr: IS_WEEKEND
        data_type: BOOLEAN
      - name: is_commemoration_day
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN

relationships:
  - name: ads_to_dates
    left_table: digital_ad_performance
    right_table: dates
    relationship_columns:
      - left_column: REPORT_DATE
        right_column: DATE_ID
  - name: traffic_to_dates
    left_table: website_traffic
    right_table: dates
    relationship_columns:
      - left_column: REPORT_DATE
        right_column: DATE_ID
  - name: channel_summary_to_dates
    left_table: channel_summary
    right_table: dates
    relationship_columns:
      - left_column: REPORT_DATE
        right_column: DATE_ID
  - name: funnel_to_dates
    left_table: website_funnel
    right_table: dates
    relationship_columns:
      - left_column: REPORT_DATE
        right_column: DATE_ID

verified_queries:
  - name: weekly_ad_spend
    question: "What is the weekly ad spend by platform?"
    use_as_onboarding_question: true
    sql: |
      SELECT DATE_TRUNC('week', report_date) as week,
             ad_platform,
             SUM(spend) as total_spend,
             SUM(clicks) as total_clicks,
             SUM(conversions) as total_conversions
      FROM NS11MM_DW_DEV.MARTS.FCT_DIGITAL_AD_PERFORMANCE
      GROUP BY 1, 2
      ORDER BY 1 DESC, 2
  - name: channel_performance_comparison
    question: "How do marketing channels compare on spend, clicks, and conversions?"
    use_as_onboarding_question: true
    sql: |
      SELECT channel, is_paid,
             SUM(spend) as total_spend,
             SUM(clicks) as total_clicks,
             SUM(conversions) as total_conversions,
             AVG(ctr) as avg_ctr,
             AVG(cpa) as avg_cpa
      FROM NS11MM_DW_DEV.MARTS.FCT_MARKETING_CHANNEL_SUMMARY
      GROUP BY channel, is_paid
      ORDER BY total_spend DESC
  - name: website_traffic_by_channel
    question: "What is the website traffic breakdown by channel?"
    use_as_onboarding_question: true
    sql: |
      SELECT channel_grouping,
             SUM(sessions) as total_sessions,
             SUM(new_users) as total_new_users,
             SUM(conversions) as total_conversions,
             AVG(conversion_rate_pct) as avg_conversion_rate
      FROM NS11MM_DW_DEV.MARTS.FCT_WEBSITE_TRAFFIC
      GROUP BY channel_grouping
      ORDER BY total_sessions DESC

custom_instructions: |
  The NS11MM fiscal year runs October through September.
  September 11 is the commemoration anniversary and creates structural anomalies — exclude from trend analysis unless asked.
  "Paid" channels include Paid Search (Google Ads) and Paid Social (Meta Ads).
  When asked about "ROAS" or "return on ad spend", use the roas field from digital_ad_performance.
  When asked about "email performance", use email_campaigns table.
  When asked about "conversion funnel", use website_funnel table.
  When asked about general "marketing performance", combine ad spend with website conversions.
