name: ns11mm_fundraising_members
description: "NS11MM Fundraising & Member Analytics — donor retention, member 360, campaign performance, and LTV"

tables:
  - name: member_360
    description: "Unified member/customer 360 view with lifetime value, engagement, and channel spend"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: RPT_MEMBER_360
    dimensions:
      - name: customer_id
        description: "Resolved customer identifier"
        expr: CUSTOMER_ID
        data_type: VARCHAR
        unique: true
      - name: full_name
        synonyms: ["name", "member name", "customer name"]
        description: "Customer full name from CRM"
        expr: FULL_NAME
        data_type: VARCHAR
      - name: customer_segment
        synonyms: ["segment", "member segment"]
        description: "Customer type: Known Member, Identified Visitor, or Anonymous"
        expr: CUSTOMER_SEGMENT
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Known Member", "Identified Visitor", "Anonymous"]
      - name: membership_type
        synonyms: ["membership level", "member type"]
        description: "Type of membership from Salesforce"
        expr: MEMBERSHIP_TYPE
        data_type: VARCHAR
      - name: membership_status
        synonyms: ["member status"]
        description: "Current membership status"
        expr: MEMBERSHIP_STATUS
        data_type: VARCHAR
      - name: donor_tier
        synonyms: ["donor level", "giving level"]
        description: "Donor classification based on YTD giving"
        expr: DONOR_TIER
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Major Donor", "Mid-Level Donor", "Donor", "Small Donor", "Non-Donor"]
      - name: ltv_tier
        synonyms: ["value tier", "customer tier"]
        description: "Lifetime value tier"
        expr: LTV_TIER
        data_type: VARCHAR
        is_enum: true
        sample_values: ["High Value", "Medium Value", "Low Value", "No Spend"]
      - name: engagement_segment
        synonyms: ["engagement level", "activity level"]
        description: "Engagement classification based on recency and email activity"
        expr: ENGAGEMENT_SEGMENT
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Highly Engaged", "Engaged", "Lapsed"]
    time_dimensions:
      - name: last_ticket_date
        synonyms: ["last visit"]
        description: "Date of most recent ticket purchase"
        expr: LAST_TICKET_DATE
        data_type: DATE
      - name: last_transaction_date
        synonyms: ["last activity", "last interaction"]
        description: "Most recent transaction across all channels"
        expr: LAST_TRANSACTION_DATE
        data_type: DATE
    facts:
      - name: total_ticket_spend
        synonyms: ["ticket spend"]
        description: "Lifetime ticket spend"
        expr: TOTAL_TICKET_SPEND
        data_type: NUMBER
      - name: total_retail_spend
        synonyms: ["retail spend", "gift shop spend"]
        description: "Lifetime retail spend"
        expr: TOTAL_RETAIL_SPEND
        data_type: NUMBER
      - name: total_donations
        synonyms: ["donation total", "giving total"]
        description: "Lifetime donation total"
        expr: TOTAL_DONATIONS
        data_type: NUMBER
      - name: total_lifetime_value
        synonyms: ["LTV", "lifetime value", "total spend"]
        description: "Sum of ticket + retail + donation spend"
        expr: TOTAL_LIFETIME_VALUE
        data_type: NUMBER
      - name: ticket_purchase_count
        synonyms: ["visits", "visit count"]
        description: "Number of ticket purchases"
        expr: TICKET_PURCHASE_COUNT
        data_type: NUMBER
      - name: email_opens
        description: "Count of email opens"
        expr: EMAIL_OPENS
        data_type: NUMBER
      - name: email_clicks
        description: "Count of email clicks"
        expr: EMAIL_CLICKS
        data_type: NUMBER
      - name: emails_received
        description: "Count of emails received"
        expr: EMAILS_RECEIVED
        data_type: NUMBER
    metrics:
      - name: total_members
        synonyms: ["member count", "how many members"]
        description: "Total number of customers"
        expr: COUNT(DISTINCT CUSTOMER_ID)
      - name: avg_lifetime_value
        synonyms: ["average LTV"]
        description: "Average lifetime value per customer"
        expr: AVG(TOTAL_LIFETIME_VALUE)
      - name: avg_ticket_spend
        description: "Average ticket spend per customer"
        expr: AVG(TOTAL_TICKET_SPEND)
      - name: email_open_rate
        description: "Average email open rate"
        expr: AVG(CASE WHEN EMAILS_RECEIVED > 0 THEN EMAIL_OPENS::FLOAT / EMAILS_RECEIVED ELSE NULL END)
      - name: highly_engaged_count
        description: "Number of highly engaged members"
        expr: COUNT(CASE WHEN ENGAGEMENT_SEGMENT = 'Highly Engaged' THEN 1 END)
      - name: lapsed_count
        synonyms: ["lapsed members"]
        description: "Number of lapsed members"
        expr: COUNT(CASE WHEN ENGAGEMENT_SEGMENT = 'Lapsed' THEN 1 END)

  - name: fundraising
    description: "Donation transactions from Classy/GoFundMe Pro with campaign enrichment"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_FUNDRAISING
    dimensions:
      - name: campaign_name
        synonyms: ["campaign", "fundraising campaign"]
        description: "Classy campaign name"
        expr: CAMPAIGN_NAME
        data_type: VARCHAR
      - name: campaign_type
        description: "Type of fundraising campaign"
        expr: CAMPAIGN_TYPE
        data_type: VARCHAR
      - name: donation_frequency
        synonyms: ["giving frequency", "recurrence"]
        description: "one-time, monthly, or annually"
        expr: DONATION_FREQUENCY
        data_type: VARCHAR
        is_enum: true
        sample_values: ["one-time", "monthly", "annually"]
      - name: is_recurring
        description: "Whether donation is recurring"
        expr: IS_RECURRING
        data_type: BOOLEAN
      - name: is_anonymous
        description: "Whether donor chose to remain anonymous"
        expr: IS_ANONYMOUS
        data_type: BOOLEAN
      - name: payment_type
        description: "Payment method for donation"
        expr: PAYMENT_TYPE
        data_type: VARCHAR
      - name: donor_member_id
        description: "Donor/member identifier linking to member_360"
        expr: DONOR_MEMBER_ID
        data_type: VARCHAR
    time_dimensions:
      - name: transaction_date
        synonyms: ["donation date", "gift date"]
        description: "Date the donation was made"
        expr: TRANSACTION_DATE
        data_type: DATE
    facts:
      - name: gross_amount
        synonyms: ["donation amount", "gift amount"]
        description: "Gross donation amount before fees"
        expr: GROSS_AMOUNT
        data_type: NUMBER
      - name: net_amount
        description: "Net donation amount after processing fees"
        expr: NET_AMOUNT
        data_type: NUMBER
      - name: processing_fee
        description: "Payment processing fee"
        expr: PROCESSING_FEE
        data_type: NUMBER
    metrics:
      - name: total_donations_raised
        synonyms: ["total raised", "fundraising total", "total giving"]
        description: "Total gross donations raised"
        expr: SUM(GROSS_AMOUNT)
      - name: total_net_donations
        description: "Total net donations after fees"
        expr: SUM(NET_AMOUNT)
      - name: donation_count
        synonyms: ["number of donations", "gifts received"]
        description: "Total number of donation transactions"
        expr: COUNT(DISTINCT TRANSACTION_ID)
      - name: avg_donation
        synonyms: ["average gift", "average donation size"]
        description: "Average donation amount"
        expr: AVG(GROSS_AMOUNT)
      - name: recurring_revenue
        synonyms: ["MRR", "recurring donations"]
        description: "Total from recurring donations"
        expr: SUM(CASE WHEN IS_RECURRING THEN GROSS_AMOUNT ELSE 0 END)
      - name: donor_count
        synonyms: ["unique donors", "number of donors"]
        description: "Number of unique donors"
        expr: COUNT(DISTINCT DONOR_MEMBER_ID)

  - name: customer_ltv
    description: "Customer lifetime value report with spend breakdown"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: RPT_CUSTOMER_LTV
    dimensions:
      - name: customer_id
        expr: CUSTOMER_ID
        data_type: VARCHAR
        unique: true
      - name: ltv_tier
        synonyms: ["value tier"]
        description: "LTV tier: Platinum (>=1000), Gold (>=500), Silver (>=100), Bronze"
        expr: LTV_TIER
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Platinum", "Gold", "Silver", "Bronze"]
      - name: customer_segment
        expr: CUSTOMER_SEGMENT
        data_type: VARCHAR
      - name: membership_type
        expr: MEMBERSHIP_TYPE
        data_type: VARCHAR
    time_dimensions:
      - name: first_transaction_date
        synonyms: ["acquisition date", "first purchase"]
        description: "Date of first transaction"
        expr: FIRST_TRANSACTION_DATE
        data_type: DATE
      - name: last_transaction_date
        synonyms: ["last activity"]
        description: "Date of most recent transaction"
        expr: LAST_TRANSACTION_DATE
        data_type: DATE
    facts:
      - name: total_lifetime_value
        synonyms: ["LTV", "total spend"]
        description: "Combined ticket + retail + donation spend"
        expr: TOTAL_LIFETIME_VALUE
        data_type: NUMBER
      - name: total_ticket_spend
        expr: TOTAL_TICKET_SPEND
        data_type: NUMBER
      - name: total_retail_spend
        expr: TOTAL_RETAIL_SPEND
        data_type: NUMBER
      - name: total_donation_spend
        expr: TOTAL_DONATION_SPEND
        data_type: NUMBER
      - name: ticket_visits
        synonyms: ["visit count"]
        expr: TICKET_VISITS
        data_type: NUMBER
    metrics:
      - name: avg_ltv
        description: "Average customer lifetime value"
        expr: AVG(TOTAL_LIFETIME_VALUE)
      - name: platinum_customers
        description: "Count of Platinum tier customers"
        expr: COUNT(CASE WHEN LTV_TIER = 'Platinum' THEN 1 END)
      - name: total_customers
        description: "Total unique customers"
        expr: COUNT(DISTINCT CUSTOMER_ID)

  - name: donor_retention
    description: "Donor retention cohort analysis tracking year-over-year giving behavior"
    base_table:
      database: NS11MM_DW_DEV
      schema: MARTS
      table: FCT_DONOR_RETENTION
    dimensions:
      - name: membership_type
        description: "Membership type of the donor"
        expr: MEMBERSHIP_TYPE
        data_type: VARCHAR
      - name: donor_tier
        description: "Donor classification tier"
        expr: DONOR_TIER
        data_type: VARCHAR
      - name: months_since_acquisition
        synonyms: ["tenure months", "age"]
        description: "Number of months since donor acquisition"
        expr: MONTHS_SINCE_ACQUISITION
        data_type: NUMBER
    time_dimensions:
      - name: cohort_month
        synonyms: ["acquisition month", "join month"]
        description: "Month the donor cohort was acquired"
        expr: COHORT_MONTH
        data_type: DATE
      - name: observation_month
        description: "Month of the retention observation"
        expr: OBSERVATION_MONTH
        data_type: DATE
    facts:
      - name: cohort_size
        synonyms: ["donors in cohort"]
        description: "Number of donors in the cohort"
        expr: COHORT_SIZE
        data_type: NUMBER
      - name: retained_donors
        synonyms: ["active donors"]
        description: "Number of donors still active/retained"
        expr: RETAINED_DONORS
        data_type: NUMBER
      - name: retention_rate_pct
        synonyms: ["retention rate", "survival rate"]
        description: "Percentage of cohort still retained"
        expr: RETENTION_RATE_PCT
        data_type: FLOAT
    metrics:
      - name: avg_retention_rate
        synonyms: ["average retention"]
        description: "Average donor retention rate"
        expr: AVG(RETENTION_RATE_PCT)
      - name: total_retained
        description: "Total retained donors across cohorts"
        expr: SUM(RETAINED_DONORS)
      - name: total_cohort_size
        description: "Total donors across all cohorts"
        expr: SUM(COHORT_SIZE)

relationships:
  - name: fundraising_to_member
    left_table: fundraising
    right_table: member_360
    relationship_columns:
      - left_column: DONOR_MEMBER_ID
        right_column: CUSTOMER_ID

metrics:
  - name: donor_retention_rate
    description: "Percentage of members who have donated"
    expr: fundraising.donor_count / NULLIF(member_360.total_members, 0)

verified_queries:
  - name: top_donors
    question: "Who are the top 10 donors by lifetime giving?"
    use_as_onboarding_question: true
    sql: |
      SELECT full_name, customer_segment, donor_tier, total_donations, total_lifetime_value
      FROM NS11MM_DW_DEV.MARTS.RPT_MEMBER_360
      WHERE total_donations > 0
      ORDER BY total_donations DESC
      LIMIT 10
  - name: monthly_fundraising
    question: "What is the monthly fundraising total for this fiscal year?"
    use_as_onboarding_question: true
    sql: |
      SELECT DATE_TRUNC('month', transaction_date) as month,
             SUM(gross_amount) as total_raised,
             COUNT(DISTINCT transaction_id) as donation_count,
             COUNT(DISTINCT donor_member_id) as unique_donors
      FROM NS11MM_DW_DEV.MARTS.FCT_FUNDRAISING
      WHERE transaction_date >= '2025-10-01'
      GROUP BY 1 ORDER BY 1
  - name: engagement_breakdown
    question: "How are members distributed across engagement segments?"
    use_as_onboarding_question: true
    sql: |
      SELECT engagement_segment, COUNT(*) as member_count,
             AVG(total_lifetime_value) as avg_ltv,
             AVG(ticket_purchase_count) as avg_visits
      FROM NS11MM_DW_DEV.MARTS.RPT_MEMBER_360
      GROUP BY engagement_segment
      ORDER BY avg_ltv DESC

custom_instructions: |
  The NS11MM fiscal year runs October through September.
  "Donors" are members with at least one donation in Classy/GoFundMe Pro.
  "Major Donors" have given >= $5,000 YTD.
  When asked about "retention", consider both membership renewal and repeat giving.
  LTV includes ticket spend + retail spend + donations.
