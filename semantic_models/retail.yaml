-- Retail domain semantic model for Cortex Analyst
-- ---------------------------------------------------------------------------
-- Domain-grouped: spans BOTH retail facts so a user can ask facility/day-level
-- questions (ratios, conversion, per-visitor) AND category drill-downs
-- (t-shirts vs food vs MAG) from one conversational surface.
--   * retail_daily    -> FCT_RETAIL_DAILY     (day x facility; ratios)
--   * retail_category -> FCT_RETAIL_PERFORMANCE (day x facility x category)
-- Covers reports: Retail Performance, Retail Carts Analysis, Monthly Retail KPI.
-- Visitor/ecom/budget metrics are stub-sourced until Sensource/Shopify/budget
-- land -- guardrails in module_custom_instructions.
name: retail
description: >
  Retail performance across the Museum Store, Memorial Carts, Cafe, Ecommerce
  and Atrium. Sales, profit, units, donations, transactions and visitor counts
  by selling area and by product category, with conversion / per-visitor /
  average-sale ratios. Backs the Retail Performance, Retail Carts, and Monthly
  Retail KPI reports.

tables:
  - name: retail_daily
    description: One row per day per selling area. Facility-grain measures and the base for ratios.
    base_table:
      database: NS11MM_DW_DEV_JMYERS
      schema: MARTS
      table: FCT_RETAIL_DAILY
    primary_key:
      columns: [DATE_KEY, KEY_FACILITY]
    dimensions:
      - name: area_name
        synonyms: ["store", "selling area", "location", "shop"]
        description: Selling area (Museum Store, Memorial Carts, Cafe, Ecommerce, Atrium).
        expr: AREA_NAME
        data_type: VARCHAR
      - name: area_group
        synonyms: ["area type", "channel"]
        expr: AREA_GROUP
        data_type: VARCHAR
      - name: is_commemoration_day
        description: TRUE on September 11 commemoration day.
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN
    metrics:
      - name: total_net_sales
        synonyms: ["sales", "retail sales", "revenue"]
        expr: SUM(NET_SALES)
      - name: total_net_profit
        synonyms: ["profit", "gross profit"]
        expr: SUM(NET_PROFIT)
      - name: total_units
        synonyms: ["units", "items sold"]
        expr: SUM(NET_UNITS)
      - name: total_donations
        synonyms: ["retail donations"]
        expr: SUM(DONATIONS)
      - name: total_transactions
        synonyms: ["customers", "transactions", "baskets"]
        expr: SUM(TRANSACTIONS)
      - name: total_visitors
        synonyms: ["visitors", "foot traffic"]
        description: Counted visitors (Sensource; stub until ingested).
        expr: SUM(VISITOR_COUNT)
      - name: total_ecom_orders
        synonyms: ["online orders", "ecommerce orders"]
        description: Ecommerce orders (Shopify; stub until ingested).
        expr: SUM(ECOM_ORDERS)
      - name: profit_margin
        synonyms: ["margin"]
        expr: SUM(NET_PROFIT) / NULLIF(SUM(NET_SALES), 0)
      - name: avg_sale
        synonyms: ["average sale", "average basket", "average transaction value"]
        expr: SUM(NET_SALES) / NULLIF(SUM(TRANSACTIONS), 0)
      - name: conversion_rate
        synonyms: ["conversion"]
        description: Transactions per visitor (NULL until Sensource lands).
        expr: SUM(TRANSACTIONS) / NULLIF(SUM(VISITOR_COUNT), 0)
      - name: rev_per_visitor
        synonyms: ["revenue per visitor", "per cap", "spend per visitor"]
        description: Net sales per visitor (NULL until Sensource lands).
        expr: SUM(NET_SALES) / NULLIF(SUM(VISITOR_COUNT), 0)

  - name: retail_category
    description: One row per day per selling area per product category. Use for category-level questions.
    base_table:
      database: NS11MM_DW_DEV_JMYERS
      schema: MARTS
      table: FCT_RETAIL_PERFORMANCE
    primary_key:
      columns: [DATE_KEY, KEY_FACILITY, CATEGORY_CODE]
    dimensions:
      - name: area_name
        synonyms: ["store", "selling area"]
        expr: AREA_NAME
        data_type: VARCHAR
      - name: category
        synonyms: ["product category", "department", "merchandise type"]
        description: CounterPoint product category (t-shirts, hats, MAG, food, books, ...).
        expr: CATEGORY_CODE
        data_type: VARCHAR
      - name: is_commemoration_day
        expr: IS_COMMEMORATION_DAY
        data_type: BOOLEAN
    metrics:
      - name: category_net_sales
        synonyms: ["category sales", "sales by category"]
        expr: SUM(NET_SALES)
      - name: category_net_profit
        synonyms: ["category profit"]
        expr: SUM(NET_PROFIT)
      - name: category_units
        synonyms: ["category units", "units by category"]
        expr: SUM(NET_UNITS)
      - name: category_cost_of_goods
        synonyms: ["COGS", "cost of goods"]
        expr: SUM(COST_OF_GOODS)

  - name: date
    description: Calendar date dimension with fiscal calendar (FY starts October).
    base_table:
      database: NS11MM_DW_DEV_JMYERS
      schema: MARTS
      table: DIM_DATE
    primary_key:
      columns: [DATE_ID]
    time_dimensions:
      - name: report_date
        synonyms: ["date", "day"]
        expr: DATE_DAY
        data_type: DATE
    dimensions:
      - name: fiscal_year
        synonyms: ["fiscal year", "FY"]
        expr: FISCAL_YEAR
        data_type: NUMBER
      - name: fiscal_month
        synonyms: ["fiscal month"]
        expr: FISCAL_MONTH
        data_type: NUMBER
      - name: calendar_year
        synonyms: ["year"]
        expr: YEAR_NUMBER
        data_type: NUMBER
      - name: calendar_month
        synonyms: ["month number"]
        expr: MONTH_OF_YEAR
        data_type: NUMBER
      - name: month_name
        synonyms: ["month"]
        expr: MONTH_NAME
        data_type: VARCHAR

relationships:
  - name: retail_daily_to_date
    left_table: retail_daily
    right_table: date
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_ID
  - name: retail_category_to_date
    left_table: retail_category
    right_table: date
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_ID

verified_queries:
  - name: top_categories_by_profit
    question: What were the top product categories by profit last month?
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.RETAIL
          DIMENSIONS retail_category.category
          METRICS retail_category.category_net_profit
      )
      ORDER BY category_net_profit DESC
      LIMIT 10
  - name: store_avg_sale_by_month
    question: What was the average sale at the Museum Store by month?
    use_as_onboarding_question: true
    sql: |
      SELECT *
      FROM SEMANTIC_VIEW(
          NS11MM_DW_DEV_JMYERS.MARTS.RETAIL
          DIMENSIONS date.calendar_month, retail_daily.area_name
          METRICS retail_daily.avg_sale
      )
      WHERE area_name = 'Museum Store'
      ORDER BY calendar_month

module_custom_instructions:
  sql_generation: |
    Use retail_daily for facility/day questions and ratios; use retail_category
    for anything about specific product categories. Never join the two fact
    tables directly in one query -- pick the grain that matches the question.
    Round currency to 2 decimals, counts to whole numbers. Conversion rate,
    rev-per-visitor and any visitor-based metric are NULL/zero until the
    Sensource visitor feed is ingested -- say so if asked. Ecommerce order
    metrics are stub-sourced until the Shopify pipeline lands.
  question_categorization: |
    Budget/goal figures: note the budget source is not yet staged. Visitor
    traffic or conversion questions: note Sensource is pending. Ecommerce
    order/sales: note the Shopify feed is pending.