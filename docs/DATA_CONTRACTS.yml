version: 2

data_contracts:
  - name: raw_source_freshness
    description: "SLA for RAW data landing from source pipelines"
    sla:
      - source: gateway
        max_stale_hours: 6
        severity: critical
        owner: Jeremy Myers
      - source: counterpoint
        max_stale_hours: 6
        severity: critical
        owner: Jeremy Myers

  - name: marts_refresh_sla
    description: "SLA for MARTS schema tables to be refreshed and available for Power BI"
    targets:
      - schema: MARTS
        refresh_by: "07:00 AM ET"
        frequency: daily
        owner: Jeremy Myers
        consumers: [POWERBI_ROLE, ML_ROLE]
      - schema: ML_FEATURES
        refresh_by: "08:00 AM ET"
        frequency: daily
        owner: Jeremy Myers
        consumers: [ML_ROLE]

  - name: data_quality_thresholds
    description: "Acceptable quality bounds — alerts fire when breached"
    thresholds:
      - table: DIM_CUSTOMER
        column: CUSTOMER_ID
        null_rate_max_pct: 0
        duplicate_rate_max_pct: 0
      - table: FCT_TICKET_SALES
        column: TRANSACTION_ID
        null_rate_max_pct: 0
        duplicate_rate_max_pct: 0
      - table: FCT_TICKET_SALES
        column: TOTAL_AMOUNT
        min_value: 0
        max_value: 10000
      - table: RPT_MEMBER_360
        column: CUSTOMER_ID
        null_rate_max_pct: 0
        duplicate_rate_max_pct: 0
      - table: FCT_DAILY_OPERATIONS
        column: TOTAL_VISITORS
        min_value: 0
        max_value: 50000
