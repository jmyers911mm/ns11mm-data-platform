version: 2
seeds:
  - name: dpr_line_items
    description: >
      Report-layout catalog for the Daily Performance Report: one row per printed
      line (section, label, sort order, indent, number format, additive-vs-ratio,
      availability). Report scaffolding, not a business dimension — joins to
      rpt_dpr_report_long on line_item_code to drive the Power BI matrix rows.
    config:
      grants:
        select: ['POWERBI_ROLE']
      # column_types intentionally omitted — dbt infers types from the CSV.
      # (Numeric columns like sort_order / indent / section_sort_order load as NUMBER.)
      # column_types:
      #   line_item_code: varchar
      #   sort_order: integer
      #   section: varchar
      #   section_sort_order: integer
      #   line_item: varchar
      #   indent: integer
      #   format: varchar
      #   value_type: varchar
      #   availability: varchar
    columns:
      - name: line_item_code
        description: Stable key joined from rpt_dpr_report_long. Grain of this table.
        data_tests: [not_null, unique]
      - name: value_type
        description: "'additive' or 'ratio' — tells Power BI's display measure how to aggregate."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']
  - name: seed_tour_plu
    description: "One row per PLU mapping to a DPR tour line item. Labels the field-trip, revealed, and ask-educator cohorts, and enumerates the tour PLUs excluded from the core museum guided-tour cohort (youth and family, early access, all-inclusive early access, architecture). Any PLU here is excluded from mus_guided_tours."
    columns:
      - name: plu
        description: "Galaxy product PLU."
        data_tests: [not_null, unique]
      - name: dpr_line_item
        description: "Target DPR line item this PLU rolls up to."
        data_tests:
          - not_null
          - accepted_values:
              values: [mem_field_trip, mus_field_trip, revealed_tour, ask_educator, architecture_tour, youth_fam_tour, early_access_tour, ea_mem_mus_tour]
  - name: seed_retail_item_facility
    description: >
      CounterPoint item_no -> facility carve-outs applied INSIDE the legacy
      t_fact_retail Sales-4 cohort only (stores 11-14, Memorial Carts). One row
      per item_no x store_id_scope, each with the t_fact_cogs cutover date from
      which the carve-out is live. Grain: item_no + store_id_scope.
      Consumed by int_counterpoint__retail_lines, which applies these rows only
      where seed_retail_store_scope.apply_item_facility_override is TRUE; before
      valid_from the line falls back to the scope's own key_facility (1020).
      8.2.0: was item_no-unique and store/date-blind, which pushed the carve-out
      facilities onto every store and every date.
    config:
      # item_no is a string in the source (mix of numeric and alpha codes);
      # pin the type so dbt seed inference does not coerce it to a number and
      # break the varchar join in int_counterpoint__retail_lines.
      column_types:
        item_no: varchar
        store_id_scope: varchar
        key_facility: integer
        valid_from: date
    columns:
      - name: item_no
        description: >
          CounterPoint item number. NOT unique on its own — the same item can be
          carved out at several stores (201114 and 201197 at stores 11-14).
        data_tests: [not_null]
      - name: store_id_scope
        description: >
          CounterPoint store id this carve-out applies to. Legacy scopes 1040 and
          1060 to stores 11-14 and 1070 / 1080 to store 14 only.
        data_tests: [not_null]
      - name: key_facility
        description: 911dw facility key the item rolls up to inside its scope.
        data_tests: [not_null]
      - name: valid_from
        description: >
          First business_date the carve-out is live (t_fact_cogs cutover):
          1040 = 2023-09-04, 1060 = 2024-01-16, 1070 / 1080 = 2024-01-21.
        data_tests: [not_null]
  - name: seed_retail_store_facility
    description: >
      Single-valued CounterPoint store_id -> facility map. Used by dim_store and
      fct_today_sales_hourly, which need one facility per store. NOT the retail
      scope: the reporting scope is many-to-many and date-bounded and lives in
      seed_retail_store_scope.
    config:
      column_types:
        store_id: varchar
        key_facility: integer
    columns:
      - name: store_id
        description: CounterPoint store id.
        data_tests: [not_null, unique]
      - name: key_facility
        description: 911dw facility key the store rolls up to.
        data_tests: [not_null]
  - name: seed_facility_area
    description: "Selling-area labels, grouping, and stable facility_group name for retail facility keys (1001 Preview/Vesey, 1002 Visitors Center, 1003 Museum Store, 1020 Memorial Carts, 1030 Atrium, 1234 Ecommerce, 4007 Cafe, 1040/1060 audio, 1070 tour guides, 1080 memberships). facility_group is the single source of truth for the key_facility -> name map consumed by int_counterpoint__retail_lines and dim_facility. 8.2.0 added 1001 and 1002, which the legacy t_fact_retail Sales 1 / Sales 2 queries populate and which previously rendered as 'Unmapped'."
    config:
      column_types:
        key_facility: integer
        is_selling: boolean
    columns:
      - name: key_facility
        data_tests: [not_null, unique]
      - name: area_name
        data_tests: [not_null]
      - name: facility_group
        description: "Stable snake_case facility identity (preview_vesey, visitors_center, museum_store, memorial_carts, museum_cafe, mag_cart, mus_ag, ecommerce, other). Downstream references this name, not the raw key_facility number."
        data_tests: [not_null]
  - name: seed_service_plu
    description: >
      One row per Galaxy PLU mapping to a DPR visitor-services line. Enumerates
      the item-grain museum audio-guide PLUs (mus_audio_guide, JnlItems
      item_kind 8) and the product-178 memorial+museum tour PLUs (mem_mus_tour),
      which carry no matrix code and so cannot be matched by a matrix pattern.
      Consumed by int_dpr__fees_and_services. Edit here to onboard/retire a PLU.
    config:
      # PLUs are alphanumeric Galaxy codes; pin to varchar so dbt seed does not
      # infer a numeric type and break the string join.
      column_types:
        plu: varchar
        dpr_line_item: varchar
    columns:
      - name: plu
        description: "Galaxy product PLU."
        data_tests: [not_null, unique]
      - name: dpr_line_item
        description: "DPR services cohort this PLU rolls up to."
        data_tests:
          - not_null
          - accepted_values:
              values: [mus_audio_guide, mem_mus_tour]

  # ─── Config-as-data lists (2026-07-23 cleanup) ─────────────────────────────
  - name: seed_retail_store_scope
    description: >
      The retail reporting scope: one row per legacy t_fact_retail query x
      CounterPoint store. Store -> facility is MANY-TO-MANY and DATE-BOUNDED —
      stores 1, 8 and 10 each report under two facilities and legacy counts them
      in both, because facility is a reporting view, not a partition. Each row
      carries the date window, an item carve-in (item_no_filter) or carve-out
      (item_no_exclude), whether the legacy shipping-description filter applies,
      whether the Sales-4 item->facility override applies, which price column
      legacy sums, and whether the row is the one a cross-facility total may add
      up (is_primary_facility). Consumed by int_counterpoint__retail_lines.
      Edit the seed, not the SQL.
      8.2.0: replaced a store_id-only in-scope list that dropped stores 2, 4, 5,
      6 and 7 entirely and could not express the two-facility stores.
    config:
      column_types:
        legacy_query: varchar
        store_id: varchar
        key_facility: integer
        valid_from: date
        valid_to: date
        item_no_filter: varchar
        item_no_exclude: varchar
        exclude_shipping_descr: boolean
        apply_item_facility_override: boolean
        price_column: varchar
        is_primary_facility: boolean
    columns:
      - name: legacy_query
        description: >
          Which t_fact_retail step this row reproduces (sales_1 .. sales_7).
          Carried onto every fact row for lineage.
        data_tests:
          - not_null
          - accepted_values:
              values: [sales_1, sales_2, sales_3, sales_4, sales_5, sales_6, sales_7]
      - name: store_id
        description: >
          CounterPoint store id. NOT unique — a store appears once per legacy
          query it belongs to.
        data_tests: [not_null]
      - name: key_facility
        description: >
          911dw facility key this store reports under for this query. For
          sales_4 this is the ELSE branch (1020); the item carve-outs come from
          seed_retail_item_facility.
        data_tests: [not_null]
      - name: valid_from
        description: First business_date in scope. Empty = open (no lower bound).
      - name: valid_to
        description: Last business_date in scope. Empty = open (still live).
      - name: item_no_filter
        description: >
          Carve-IN. When set, only this item_no qualifies for the row (legacy
          Sales 3's `STR_ID = '14' AND item_no = '201205'`). Empty = all items.
      - name: item_no_exclude
        description: >
          Carve-OUT. When set, this item_no is excluded (legacy Sales 4's
          `ITEM_NO <> '201205'`). Empty = no exclusion.
      - name: exclude_shipping_descr
        description: >
          Apply the legacy `DESCR not like '%shipping%'` filter. TRUE for
          Sales 2-7; FALSE for Sales 1, which does not carry it.
        data_tests: [not_null]
      - name: apply_item_facility_override
        description: >
          Apply seed_retail_item_facility inside this scope. TRUE only for
          sales_4 (stores 11-14) — the legacy item CASE lives in that query
          alone.
        data_tests: [not_null]
      - name: price_column
        description: >
          Which staged price column legacy sums for this query. Sales 1 sums
          GROSS_EXT_PRC; Sales 2-7 sum EXT_PRC.
        data_tests:
          - not_null
          - accepted_values:
              values: [ext_price, gross_ext_price]
      - name: is_primary_facility
        description: >
          TRUE on exactly one scope row per source line. A total ACROSS
          facilities must filter on it; per-facility reporting must not. FALSE
          for store 8 -> 1001, store 10 -> 1030 and store 1 -> 4007, whose lines
          are already counted at 1003, 1003 and 1001 respectively.
        data_tests: [not_null]

  - name: seed_retail_excluded_item
    description: >
      DEPRECATED, no consumers as of 8.2.0. Its only row (201205) was a
      Sales-4-scoped exclusion applied globally, which silently dropped the
      store-14 / item-201205 carve-in to 1003 Museum Store. The exclusion now
      lives in seed_retail_store_scope.item_no_exclude. Delete this seed once
      8.2.0 has shipped clean.
    config:
      column_types:
        item_no: varchar
    columns:
      - name: item_no
        description: CounterPoint item number to exclude.
        data_tests: [not_null, unique]

  - name: seed_retail_zero_price_item
    description: >
      CounterPoint item_no values whose SALE price is zero-rated, scoped to the
      resolved key_facility. Legacy zero-rating is per query, not global:
      Sales 3 (1003) and Sales 4 (1020) zero '200933' and '201229'; Sales 7
      (4007) zeroes '200933' only; Sales 5 (1234) zeroes nothing. Return amount
      is never zeroed. Grain: item_no + key_facility_scope.
      8.2.0: was a global item list, which zero-rated ecommerce and cafe sales
      legacy charged for.
    config:
      column_types:
        item_no: varchar
        key_facility_scope: integer
    columns:
      - name: item_no
        description: >
          CounterPoint item number to zero-rate. NOT unique on its own — the
          same SKU is zero-rated at several facilities.
        data_tests: [not_null]
      - name: key_facility_scope
        description: >
          Resolved key_facility the zero-rating applies at. A line is zero-rated
          only when its resolved facility matches.
        data_tests:
          - not_null
          - accepted_values:
              values: [1003, 1020, 4007]

  - name: seed_retail_donation_item
    description: >
      CounterPoint donation SKUs mapped to their DPR donation line, plus the
      store-scoped category reclass. donation_line drives cart_ask / mus_exit /
      mask / plaza_box / ecom_ask in int_dpr__retail. reclass_to_donation tells
      int_counterpoint__retail_lines to fold the SKU into summary_category 6
      even when CATEG_COD is not 'DONATE' — legacy t_fact_retail does this for
      item 7-00003 in Sales 5 (store 3, ecommerce) and nowhere else.
      Edit here to re-point a donation product.
    config:
      column_types:
        item_no: varchar
        donation_line: varchar
        store_id_scope: varchar
        reclass_to_donation: boolean
    columns:
      - name: item_no
        description: CounterPoint item number for the donation product.
        data_tests: [not_null, unique]
      - name: donation_line
        description: DPR donation line this SKU rolls up to.
        data_tests:
          - not_null
          - accepted_values:
              values: [cart_ask, mus_exit, mask, plaza_box, ecom_ask]
      - name: store_id_scope
        description: >
          CounterPoint store id the row applies to. Empty = all stores. Only
          7-00003 is scoped (store 3).
      - name: reclass_to_donation
        description: >
          TRUE means the SKU is folded into 'Donations' / summary_category 6
          regardless of CATEG_COD, within store_id_scope. The other four SKUs
          already carry CATEG_COD = 'DONATE' and need no reclass.
        data_tests: [not_null]

  - name: seed_gateway_excluded_plu
    description: "Gateway PLUs always dropped from the ticket journal (placeholder/external-event products)."
    config:
      column_types:
        plu: varchar
    columns:
      - name: plu
        description: Galaxy product PLU to exclude.
        data_tests: [not_null, unique]

  - name: seed_gateway_excluded_customer
    description: "Gateway itm_default_customer_id values excluded from the ticket journal (internal/default customers)."
    config:
      column_types:
        customer_id: integer
    columns:
      - name: customer_id
        description: Gateway default customer id to exclude.
        data_tests: [not_null, unique]

  # ─── Serving-layer seeds (coverage added 2026-07-29) ───────────────────────
  - name: retail_line_items
    description: >
      Report-layout catalog for the Retail Performance Report: one row per
      printed line (section, label, sort order, indent, number format,
      additive-vs-ratio, availability, facility mapping, and — for ratio
      lines — numerator/denominator source measures). Report scaffolding, not
      a business dimension. Consumed by dim_retail_line_item.
    columns:
      - name: line_item_code
        description: Stable key joined from rpt_retail_report_long. Grain of this table.
        data_tests: [not_null, unique]
      - name: value_type
        description: "'additive' or 'ratio' — tells Power BI's display measure how to aggregate."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']

  - name: today_sales_line_items
    description: >
      Report-layout catalog for the Today's Sales report: one row per printed
      line (section, label, sort order, indent, number format,
      additive-vs-ratio, availability, and — for ratio lines —
      numerator/denominator source measures). facility_group / key_facility
      are intentionally blank: the lines apply to every selling area (area
      comes from the fact row). Report scaffolding, not a business dimension.
      Consumed by dim_today_sales_line_item.
    columns:
      - name: line_item_code
        description: Stable key joined from rpt_today_sales_report_long. Grain of this table.
        data_tests: [not_null, unique]
      - name: value_type
        description: "'additive' or 'ratio' — tells Power BI's display measure how to aggregate."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']

  - name: tracker_line_items
    description: >
      Report-layout catalog for the Memorial & Museum Daily Tracker (YTD): one
      row per printed line (section, label, sort order, indent, number format,
      additive-vs-ratio, availability, and — for ratio lines —
      numerator/denominator source measures). The "... Projection" rows are
      printed lines of their own (the tracker prints scenario as rows, not
      columns). Report scaffolding, not a business dimension. Consumed by
      dim_tracker_line_item.
    columns:
      - name: line_item_code
        description: Stable key joined from rpt_tracker_report_long. Grain of this table.
        data_tests: [not_null, unique]
      - name: value_type
        description: "'additive' or 'ratio' — tells Power BI's display measure how to aggregate."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']

  - name: seed_scan_market_segment
    description: >
      Daily Scan market-segment classification rules: one row per segment
      (segment_key, display name, match_type + match_value pattern applied to
      the scan line's category). Consumed by int_gateway__scan_lines and
      fct_daily_scan.
    columns:
      - name: segment_key
        description: Stable segment key (grain of this table).
        data_tests: [not_null, unique]
      - name: segment_name
        description: Display name shown on the Daily Scan report.
        data_tests: [not_null]

  # ─── Legacy reference seeds — no active consumers ──────────────────────────
  # Candidates for deletion once the disabled marketing/CRM models are decided.
  - name: ref_customer_segments
    description: "Legacy reference seed (customer segment labels). No active consumers; candidate for deletion when the disabled marketing/CRM models are decided."
  - name: ref_ltv_tiers
    description: "Legacy reference seed (customer LTV tier bands + colors). No active consumers; candidate for deletion when the disabled marketing/CRM models are decided."
  - name: ref_marketing_channels
    description: "Legacy reference seed (marketing channel catalog). No active consumers; candidate for deletion when the disabled marketing/CRM models are decided."
  - name: ref_payment_methods
    description: "Legacy reference seed (payment method catalog). No active consumers; candidate for deletion when the disabled marketing/CRM models are decided."
  - name: ref_ticket_types
    description: "Legacy reference seed (ticket type catalog with default prices). No active consumers; candidate for deletion when the disabled marketing/CRM models are decided."

  - name: attendance_line_items
    description: >
      Report-layout catalog for the Attendance Report: one row per printed
      line (section, label, sort order, indent, number format,
      additive-vs-ratio, availability). All five lines are additive counts,
      so num_source/den_source are blank. The three Sensource-backed lines
      (MEMORIAL_ONLY, MUSEUM_STORE, MUSEUM_STORE_VESEY) became Available in
      8.4.0 when seed_sensource_facility_map made the sensor feed reachable.
      MEM_ATTENDANCE was already Available and stays Available: 8.4.0 gives it a
      real source (stg_memorial__attendance, the 911dw.memorial_attendance table
      every legacy reader uses) in place of the unreachable facility-2000 rows of
      the visitors feed. Report scaffolding, not a business dimension. Consumed
      by dim_attendance_line_item.
    columns:
      - name: line_item_code
        description: Stable key joined from rpt_attendance_report_long. Grain of this table.
        data_tests: [not_null, unique]
      - name: value_type
        description: "'additive' or 'ratio' — tells Power BI's display measure how to aggregate."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']

  - name: carts_line_items
    description: >
      Report-layout catalog for the Retail Carts Analysis report: one row per
      printed workbook column (section, label, sort order, number format,
      additive-vs-ratio, availability, and — for ratio lines — numerator/
      denominator source measures). Single-area report: facility fixed to
      Memorial Carts (1020). MUS_VISITORS became Available in 8.4.0; the
      memorial-side counts followed in 8.5.0. The three denominator-driven
      ratios are Partial, not Available: the legacy year switch
      (seed_carts_denominator_rule) has no rule past 2020, so they are blank
      for 2021 onward exactly as the legacy workbook prints them. Report
      scaffolding, not a business dimension. Consumed by dim_carts_line_item.
    columns:
      - name: line_item_code
        description: Stable key joined from rpt_carts_report_long. Grain of this table.
        data_tests: [not_null, unique]
      - name: value_type
        description: "'additive' or 'ratio' — tells Power BI's display measure how to aggregate."
        data_tests:
          - accepted_values:
              values: ['additive', 'ratio']

  - name: retail_print_lines
    description: >
      Printed-row catalog for the Retail Performance Report: one row per line
      as it appears on the legacy PDF, in print order, with the metric it reads
      and which scenario (actual / goal / variance). The legacy report prints
      scenario as rows, and prints a Variance row for selected metrics only —
      both facts are encoded here rather than inferred. Report scaffolding, not
      a business dimension. Consumed by dim_retail_print_line.
    columns:
      - name: print_code
        description: Stable key joined from rpt_retail_report_print. Grain of this table.
        data_tests: [not_null, unique]
      - name: print_order
        description: Global printed order. Unique — drives matrix row sort.
        data_tests: [not_null, unique]
      - name: scenario
        description: "'actual', 'goal', or 'variance' — which side of metric_code this printed row shows."
        data_tests:
          - accepted_values:
              values: ['actual', 'goal', 'variance']

  - name: dpr_mtd_ytd_print_lines
    description: >
      Printed-row catalog for the DPR "Month to Date" and "Year to Date" Excel
      variants: one row per printed line in print order, with the metric it
      reads. Both variants print identical rows, so one catalog serves both.
      Lines whose metric has no source in the platform today (Early Access tour
      counts, Youth & Family tour counts, Early Access Memorial + Museum,
      E-Commerce gross profit, budgeted operating expenses) are marked Stub and
      render blank rather than being omitted. Report scaffolding, not a business
      dimension. Consumed by dim_dpr_mtd_ytd_print_line.
    columns:
      - name: print_code
        description: Stable key joined from rpt_dpr_mtd_ytd_print. Grain of this table.
        data_tests: [not_null, unique]
      - name: print_order
        description: Global printed order. Unique — drives matrix row sort.
        data_tests: [not_null, unique]
      - name: metric_code
        description: The metric in rpt_dpr_mtd_ytd_long this printed row reads (unmatched = Stub).
        data_tests: [not_null]
  - name: seed_sensource_facility_map
    description: >
      Visitor-feed facility -> reporting facility crosswalk, with the measure
      column each facility reports on and the WRITER each row reads. The feed
      estate numbers its facilities 1000-1009 on the Sensource API leg
      (t_fact_visitors: SERVERS.ParentFacility in (1000..1009)), 1006 / 5000 / 0
      on the Gateway pass-scan leg (t_fact_museum_passes_scanned), and 2000 in
      the separate 911dw.memorial_attendance table; the reporting estate numbers
      selling/reporting areas 1001, 1003, 1030, 2000 (seed_facility_area). Before
      8.4.0 the two vocabularies were joined directly and never matched, so
      visitor_count was 0 regardless of the feed. Entry vs exit vs passes-scanned
      is a per-facility property carried here, not a preference: the Museum Store
      counts entries, Vesey counts exits, the museum and memorial count scanned
      passes. Every row cites the legacy file and line it was verified from.
      Consumed by int_retail__visitors and int_attendance__sensource.

      8.4.0, after a sample of 911dw.fact_visitors confirmed the shape
      (key_date, key_facility, acp, num_entry, num_exit, passes_scanned, with the
      two writers on SEPARATE rows distinguished by acp):

      * source_system added. Each row now states which leg it reads --
        `sensource` (acp = 0, entries/exits), `gateway_scan` (acp = gate id,
        passes) or `memorial_feed` (a different table entirely). Without it the
        crosswalk implied one feed where there are three.
      * is_reporting added, so a known facility with no verified reporting home
        can be DECLARED rather than left absent. 1008 and 1009 are carried this
        way; int_retail__visitors reads only is_reporting rows, and
        assert_sensource_facilities_resolve reports the declared ones with their
        volume so a busy unmapped door does not stay invisible.
      * 3000 -> 1030 DELETED. 3000 is emitted by neither writer --
        t_fact_museum_passes_scanned emits only 1006, 5000 and 0, and the
        Sensource leg covers 1000-1009 -- so the museum/Atrium measure is
        facility 1006 alone. 8.7.0 reaches the same conclusion independently
        (seed_attendance_facility_group carries 3000 as a record of the legacy
        IN list, contributing nothing).
      * 2000 RE-POINTED to source_system = memorial_feed. Memorial attendance
        lives in 911dw.memorial_attendance, now staged as
        stg_memorial__attendance; the visitors feed cannot carry 2000.
      * 1007 -> 1003 (num_entry) and 1001 -> 1001 (num_exit) retained unchanged.
        1001 is inside the Sensource ParentFacility range; its absence from a
        single 1-Jan sample is a closed-day artifact, not a missing feed.
    config:
      column_types:
        sensource_facility: integer
        reporting_facility: integer
        measure_column: varchar
        area_name: varchar
        source_system: varchar
        is_reporting: boolean
        notes: varchar
    columns:
      - name: sensource_facility
        description: >
          Feed-side facility id as it lands in stg_sensource__visitors.key_facility
          (sensource / gateway_scan rows) or stg_memorial__attendance.key_facility
          (memorial_feed rows). Grain of this table.
        data_tests: [not_null, unique]
      - name: reporting_facility
        description: >
          Reporting key_facility the measure is published against (joins
          fct_retail_daily / seed_facility_area). NULL on is_reporting = FALSE
          rows, which have no verified reporting home yet — hence the
          conditional not_null.
        data_tests:
          - not_null:
              config:
                where: "is_reporting"
      - name: measure_column
        description: >
          Which staged column this facility's visitor count reads. NULL on
          is_reporting = FALSE rows. On gateway_scan rows this names the LEGACY
          measure; from 8.7.0 the value itself is re-sourced from
          int_ticket_scans, which recomputes it under the legacy validity rule.
        data_tests:
          - not_null:
              config:
                where: "is_reporting"
          - accepted_values:
              values: ['num_entry', 'num_exit', 'passes_scanned']
              config:
                where: "is_reporting"
      - name: area_name
        description: >
          Reporting-area label. int_attendance__sensource pivots on this rather
          than on raw facility numbers. NULL on is_reporting = FALSE rows.
        data_tests:
          - not_null:
              config:
                where: "is_reporting"
      - name: source_system
        description: >
          Which writer this row reads. 'sensource' = the Sensource API leg of
          911dw.fact_visitors (acp = 0, num_entry / num_exit populated,
          passes_scanned 0). 'gateway_scan' = the t_fact_museum_passes_scanned
          leg of the same table (acp = gate id, passes_scanned populated,
          num_entry / num_exit NULL). 'memorial_feed' = the separate
          911dw.memorial_attendance table. int_retail__visitors reads the first
          two; int_attendance__sensource reads the third directly.
        data_tests:
          - not_null
          - accepted_values:
              values: ['sensource', 'gateway_scan', 'memorial_feed']
      - name: is_reporting
        description: >
          TRUE = the row publishes a measure at reporting_facility. FALSE = a
          facility confirmed present in the feed with NO verified reporting home
          (1008, 1009): declared here so it is enumerated in a governed artifact
          instead of being an absence, excluded from every model, and reported by
          assert_sensource_facilities_resolve. Do not flip to TRUE without a
          verified legacy mapping — an invented one is worse than a gap.
        data_tests: [not_null]
      - name: notes
        description: >
          Legacy file and line the mapping was verified from, or — for a
          non-reporting row — what was observed and what is still unknown.
          Required on every row; an unsourced mapping is not a mapping.
        data_tests: [not_null]

  - name: seed_carts_denominator_rule
    description: >
      Calendar-year switch for the Retail Carts Analysis capture / per-cap
      denominator. The legacy workbook does not use one denominator: 2019 uses
      (memorial visitors less 25%) less museum visitors, 2020 uses memorial
      visitors unadjusted, and the CASE at t_retail_cart_analysis_tabs.sql:19-22
      has no ELSE — so every printed row from 2021 onward has a NULL capture
      rate, NULL profit-per-cap and NULL sales-per-cap. That fall-through is
      reproduced, not repaired: a year absent from this seed produces a NULL
      denominator. Adding a rule for 2021+ is a one-row data edit once the Data
      & AI Committee decides which form applies (ADR-005 — see the 8.5.0
      DECISION_MEMO). Consumed by rpt_retail_carts_analysis.
    config:
      column_types:
        calendar_year: integer
        denominator_rule: varchar
        notes: varchar
    columns:
      - name: calendar_year
        description: Calendar year of the report date. Grain of this table.
        data_tests: [not_null, unique]
      - name: denominator_rule
        description: "Which legacy denominator form applies in this year."
        data_tests:
          - not_null
          - accepted_values:
              values: ['adjusted_memorial_less_museum', 'memorial_visitors']
      - name: notes
        description: Legacy file and line the rule was verified from.
        data_tests: [not_null]

