# NS11MM Data Platform — Terraform Deploy: dev
# Auto-triggers on merge to main (terraform paths only)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: ubuntu-latest

variables:
  # Variable group must contain:
  #   ARM_SUBSCRIPTION_ID, ARM_CLIENT_ID, ARM_CLIENT_SECRET (secret), ARM_TENANT_ID
  #   TEAMS_WEBHOOK_URL (secret), PIPELINE_SP_OBJECT_ID, ADMIN_OBJECT_ID
  #   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD (secret), SNOWFLAKE_ROLE
  - group: ns11mm-terraform-dev
  - name: TF_VAR_FILE
    value: environments/dev.tfvars.json
  - name: TF_STATE_KEY
    value: ns11mm-data-platform-dev.tfstate

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: '1.5.x'

  - script: terraform init -backend-config="key=$(TF_STATE_KEY)"
    workingDirectory: terraform/
    displayName: Terraform Init
    env:
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: terraform plan -var-file=$(TF_VAR_FILE) -out=tfplan
    workingDirectory: terraform/
    displayName: Terraform Plan
    env:
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      TF_VAR_teams_webhook_url: $(TEAMS_WEBHOOK_URL)
      TF_VAR_pipeline_sp_object_id: $(PIPELINE_SP_OBJECT_ID)
      TF_VAR_admin_object_id: $(ADMIN_OBJECT_ID)

  - script: terraform apply tfplan
    workingDirectory: terraform/
    displayName: Terraform Apply
    env:
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      TF_VAR_teams_webhook_url: $(TEAMS_WEBHOOK_URL)
      TF_VAR_pipeline_sp_object_id: $(PIPELINE_SP_OBJECT_ID)
      TF_VAR_admin_object_id: $(ADMIN_OBJECT_ID)
